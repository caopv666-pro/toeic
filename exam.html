<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Phòng Thi TOEIC Online — TOEIC Master</title>
  <meta name="description" content="Giao diện thi thử TOEIC trực tuyến chuẩn định dạng ETS, tự động tính giờ và lưu tiến độ.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css?v=20261020a">
  <link rel="stylesheet" href="css/layout.css?v=20261020a">
  <link rel="stylesheet" href="css/components.css?v=20261020a">
  <link rel="stylesheet" href="css/responsive.css?v=20261020a">
</head>
<body>

  <!-- Top Sticky Navigation Bar -->
  <nav class="app-navbar exam-navbar">
    <div class="nav-brand">
      <a href="index.html" class="exam-exit-link" onclick="return confirmExitExam(event)" title="Thoát phòng thi về trang chủ" aria-label="Thoát phòng thi về trang chủ">
        <span class="exit-arrow">←</span>
        <span class="exit-label">Thoát</span>
      </a>
      <span class="brand-badge" id="exam-header-title">Đề thi</span>
    </div>

    <!-- Integrated Header Audio Player (Listening parts) -->
    <div class="header-audio-player" id="master-lc-card" style="display: none;">
      <audio id="master-audio-element" preload="metadata"></audio>
      <button type="button" class="master-lc-play-btn" id="master-play-btn" onclick="ExamEngine.toggleMasterAudio()" aria-label="Bắt đầu hoặc tạm dừng phần nghe" aria-pressed="false" title="Bắt đầu / Tạm dừng phần nghe">
        ▶
      </button>
      <div class="master-lc-bar" title="Quy chế thi ETS: Không được tua âm thanh khi thi">
        <div class="master-lc-fill" id="master-audio-fill"></div>
      </div>
      <div class="master-lc-times">
        <span id="master-audio-cur">00:00</span>
        <span class="master-audio-divider">/</span>
        <span id="master-audio-dur">--:--</span>
      </div>
    </div>

    <!-- Center Countdown Timer -->
    <div class="exam-timer" id="desktop-timer-wrap">
      <span class="timer-icon">⏱️</span>
      <span class="exam-timer-val">120:00</span>
    </div>

    <div class="nav-links">
      <button class="theme-toggle-btn" id="theme-btn" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng / Tối">
        🌓
      </button>
      <button type="button" class="btn btn-danger btn-sm" onclick="ExamEngine.confirmSubmit()" id="btn-submit-top" aria-label="Nộp bài thi">
        Nộp bài
      </button>
    </div>
  </nav>

  <!-- Main Exam Workspace -->
  <main class="container exam-container">
    
    <!-- Loading State -->
    <div id="exam-loading-state" role="status" aria-live="polite" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 60vh; gap: 20px;">
      <div style="width: 50px; height: 50px; border: 4px solid var(--border-glass); border-top-color: var(--accent-primary); border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
      <p style="color: var(--text-secondary); font-size: 1.1rem; font-weight: 500;">Đang chuẩn bị đề thi và âm thanh...</p>
    </div>

    <!-- Error State -->
    <div id="exam-error-state" role="alert" style="display: none; padding: 40px; text-align: center; max-width: 600px; margin: 40px auto; background: var(--bg-glass-card); border-radius: 16px; border: 1px solid var(--danger);">
      <h3 style="color: var(--danger); margin-bottom: 12px; font-size: 1.3rem;">⚠️ Lỗi tải dữ liệu</h3>
      <p class="error-msg-text" style="color: var(--text-secondary); margin-bottom: 24px;"></p>
      <a href="index.html" class="btn btn-primary">Quay lại Trang chủ</a>
    </div>

    <!-- Main Exam 2-Column Grid -->
    <div class="exam-layout" id="exam-main-layout" style="display: none;">
      
      <!-- Left Column: Questions List -->
      <div class="exam-content-col" id="exam-questions-list">
        <!-- Rendered dynamically by ExamEngine -->
      </div>

      <!-- Right Column: Question Palette (Sticky on PC) -->
      <aside class="exam-sidebar-col">
        <div class="glass-panel" style="padding: 14px 12px; border-radius: var(--radius-lg);">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <h3 style="font-size: 0.96rem; font-weight: 600;">Bảng Câu Hỏi</h3>
            <span style="font-size: 0.8rem; color: var(--text-muted);" id="sidebar-total-badge">-- câu</span>
          </div>

          <!-- Palette Container -->
          <div class="palette-container-wrapper">
            <!-- Rendered dynamically -->
          </div>

          <button type="button" class="btn btn-danger" onclick="ExamEngine.confirmSubmit()" aria-label="Nộp bài và xem điểm" style="width: 100%; margin-top: 14px; padding: 8px 12px; font-size: 0.86rem;">
            Nộp bài & Xem điểm
          </button>
        </div>
      </aside>

    </div>
  </main>

  <!-- Mobile Floating Bottom Bar -->
  <div class="mobile-exam-bottom-bar" id="mobile-bar">
    <div class="exam-timer mobile-timer-pill">
      <span>⏱️</span>
      <span class="exam-timer-val">120:00</span>
    </div>
    
    <button type="button" class="btn btn-secondary btn-sm mobile-palette-trigger" onclick="ExamEngine.openMobileDrawer()" aria-haspopup="dialog" aria-expanded="false" aria-controls="mobile-drawer" aria-label="Mở bảng câu hỏi">
      📋 <span class="mobile-palette-btn-text">Bảng câu</span> (<span id="mobile-answered-badge">0/200</span>)
    </button>

    <button type="button" class="btn btn-danger btn-sm mobile-submit-trigger" onclick="ExamEngine.confirmSubmit()" aria-label="Nộp bài thi">
      Nộp bài
    </button>
  </div>

  <!-- Mobile Question Palette Drawer (Bottom Sheet) -->
  <div class="mobile-palette-drawer" id="mobile-drawer" role="dialog" aria-modal="true" aria-label="Bảng câu hỏi di động" aria-hidden="true" onclick="if(event.target === this) ExamEngine.closeMobileDrawer()">
    <div class="drawer-content">
      <div class="drawer-drag-handle"></div>
      <div class="drawer-header">
        <h3 style="font-size: 1.1rem;">Bảng Câu Hỏi</h3>
        <button type="button" onclick="ExamEngine.closeMobileDrawer()" aria-label="Đóng bảng câu hỏi" style="font-size: 1.4rem; color: var(--text-muted);">&times;</button>
      </div>

      <div class="palette-container-wrapper drawer-palette-scroll">
        <!-- Rendered dynamically -->
      </div>

      <button type="button" class="btn btn-danger" onclick="ExamEngine.confirmSubmit()" aria-label="Nộp bài thi ngay" style="width: 100%; margin-top: 16px;">
        Nộp bài thi ngay
      </button>
    </div>
  </div>

  <!-- Modern In-App Submit Confirmation Modal -->
  <div class="submit-confirm-modal" id="submit-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="modal-confirm-title" style="display: none;">
    <div class="modal-backdrop" onclick="ExamEngine.closeSubmitModal()"></div>
    <div class="modal-card animate-scale-up">
      <div class="modal-header">
        <div class="modal-header-icon" aria-hidden="true">⚠️</div>
        <h3 id="modal-confirm-title">Xác Nhận Nộp Bài Thi</h3>
        <button type="button" class="modal-close-btn" onclick="ExamEngine.closeSubmitModal()" aria-label="Đóng hộp thoại">&times;</button>
      </div>
      <div class="modal-body">
        <div class="submit-stats-row">
          <div class="submit-stat-box stat-done">
            <span class="stat-number" id="modal-stat-done">0</span>
            <span class="stat-label">Đã làm</span>
          </div>
          <div class="submit-stat-box stat-left">
            <span class="stat-number" id="modal-stat-left">200</span>
            <span class="stat-label">Chưa làm</span>
          </div>
        </div>
        <p class="submit-warning-text" id="modal-warning-text">
          Bạn vẫn còn câu hỏi chưa hoàn thành. Bạn có chắc chắn muốn nộp bài để xem điểm không?
        </p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" onclick="ExamEngine.closeSubmitModal()" aria-label="Tiếp tục làm bài">
          Tiếp tục làm bài
        </button>
        <button type="button" class="btn btn-danger" id="btn-modal-confirm-submit" onclick="ExamEngine.executeSubmit()" aria-label="Xác nhận nộp bài">
          Xác nhận nộp bài
        </button>
      </div>
    </div>
  </div>

  <style>
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- JavaScript Modules -->
  <script src="js/app-config.js?v=20261022v2"></script>
  <script src="js/storage-service.js?v=20261022v2"></script>
  <script src="js/audio-controller.js?v=20261022v2"></script>
  <script src="js/ui-renderer.js?v=20261022v2"></script>
  <script src="js/exam-engine.js?v=20261022v2"></script>

  <script>
    function confirmExitExam(event) {
      if (typeof confirm === 'function' && !confirm('Bạn có chắc chắn muốn rời phòng thi? Tiến độ làm bài hiện tại đã được tự động lưu.')) {
        if (event && typeof event.preventDefault === 'function') event.preventDefault();
        return false;
      }
      return true;
    }

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('DOMContentLoaded', () => {
        if (typeof StorageService !== 'undefined' && typeof StorageService.initTheme === 'function') {
          StorageService.initTheme();
        }
        if (typeof AudioController !== 'undefined' && typeof AudioController.init === 'function') {
          AudioController.init();
        }
        
        // Update header with test name and part (if in part mode)
        try {
          const urlParams = new URLSearchParams(window.location.search);
          const rawTest = urlParams.get('test') || '1';
          const match = String(rawTest).match(/\d+/);
          const parsedId = match ? parseInt(match[0], 10) : 1;
          const testId = (Number.isInteger(parsedId) && parsedId >= 1 && parsedId <= 10) ? parsedId : 1;
          const testNumStr = testId < 10 ? `0${testId}` : `${testId}`;
          const mode = (urlParams.get('mode') || '').toLowerCase().trim();
          const partFilter = (urlParams.get('part') || '').toLowerCase().trim();

          const titleBadge = document.getElementById('exam-header-title');
          if (titleBadge) {
            if (mode === 'part' && partFilter) {
              const defaultParts = {
                part1: 'Part 1', part2: 'Part 2', part3: 'Part 3',
                part4: 'Part 4', part5: 'Part 5', part6: 'Part 6', part7: 'Part 7'
              };
              const partName = (typeof AppConfig !== 'undefined' && AppConfig.PARTS && AppConfig.PARTS[partFilter])
                ? AppConfig.PARTS[partFilter].name.split(':')[0]
                : (defaultParts[partFilter] || partFilter.toUpperCase());
              titleBadge.textContent = `Test ${testNumStr} • ${partName}`;
            } else {
              titleBadge.textContent = `Test ${testNumStr}`;
            }
          }
        } catch (_) {}

        // Initialize Exam
        if (typeof ExamEngine !== 'undefined' && typeof ExamEngine.init === 'function') {
          ExamEngine.init().then((success) => {
            if (success) {
              const mainLayout = document.getElementById('exam-main-layout');
              if (mainLayout) mainLayout.style.display = 'grid';
            }
          });
        }
      });
    }

    function toggleTheme() {
      if (typeof StorageService !== 'undefined' && typeof StorageService.toggleTheme === 'function') {
        StorageService.toggleTheme();
      } else if (typeof document !== 'undefined' && document.documentElement) {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      }
    }

    if (typeof window !== 'undefined') {
      window.confirmExitExam = confirmExitExam;
      window.toggleTheme = toggleTheme;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        confirmExitExam,
        toggleTheme
      };
    }
  </script>
</body>
</html>
