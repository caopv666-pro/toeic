<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Từ Vựng TOEIC 450+ ➔ 850+ — TOEIC Master</title>
  <meta name="description" content="Học từ vựng TOEIC tinh gọn theo từng mục tiêu điểm 450+, 550+, 650+, 750+, 850+ qua Flashcard, Danh sách từ và Trắc nghiệm ETS.">

  <link rel="stylesheet" href="css/base.css?v=20261024v10">
  <link rel="stylesheet" href="css/layout.css?v=20261024v10">
  <link rel="stylesheet" href="css/components.css?v=20261024v10">
  <link rel="stylesheet" href="css/responsive.css?v=20261024v10">
  <style>
    /* ── Ultra-Minimalist Top Filter & Control Bar (Synced with index.html) ── */
    .study-top-section {
      padding: 16px 0 10px;
      text-align: center;
      max-width: 860px;
      margin: 0 auto;
    }
    .band-chip-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 0 auto 12px;
      max-width: 540px;
    }
    .band-chip-btn {
      flex: 1 1 0;
      padding: 7px 6px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 0;
    }
    .band-chip-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .band-chip-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .band-chip-label {
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .band-chip-sub {
      font-size: 0.66rem;
      font-weight: 600;
      opacity: 0.85;
    }

    /* Topic Pills Row */
    .topic-pills-wrap {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .topic-pill-btn {
      padding: 6px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .topic-pill-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .topic-pill-btn.active {
      background: rgba(99, 102, 241, 0.18);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    .topic-pill-count {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .topic-pill-btn.active .topic-pill-count {
      background: var(--accent-primary);
      color: #ffffff;
    }

    /* Slim Status & Backup Bar */
    .slim-status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .slim-progress-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 240px;
      min-width: 0;
    }
    .slim-bar-track {
      flex: 1;
      max-width: 140px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .slim-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .slim-actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slim-link-btn {
      padding: 4px 9px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .slim-link-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.1);
    }

    /* ── Minimalist Flashcard ── */
    .fc-container {
      max-width: 580px;
      margin: 0 auto 32px;
    }
    .fc-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .vocab-flashcard {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 24px 24px 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }
    .vocab-flashcard:hover {
      border-color: var(--accent-primary);
    }
    .vocab-flashcard.is-flipped {
      border-color: var(--accent-secondary);
    }
    .fc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pos-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.14);
      color: #a5b4fc;
    }
    .icon-pill-btn {
      padding: 5px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-pill-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    .icon-pill-btn.starred {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.12);
    }
    .fc-body {
      text-align: center;
      padding: 20px 8px;
    }
    .fc-word {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }
    .fc-ipa {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .fc-meaning {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--success);
      margin-bottom: 12px;
    }
    .fc-example-en {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 480px;
      margin: 0 auto;
    }
    .fc-back-details {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.84rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fc-hint {
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .fc-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    /* ── Minimalist Word List Grid (2 Columns like index.html) ── */
    .list-filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .search-box-minimal {
      flex: 1 1 220px;
      padding: 7px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.84rem;
    }
    .filter-chips-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .mini-filter-chip {
      padding: 5px 10px;
      border-radius: var(--radius-full);
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .mini-filter-chip.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .vocab-compact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 40px;
    }
    .vocab-compact-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease;
    }
    .vocab-compact-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .vocab-compact-card.is-mastered {
      border-left: 3px solid var(--success);
    }
    .vocab-compact-card.is-learning {
      border-left: 3px solid var(--warning);
    }
    .vc-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .vc-word-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .vc-word {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .vc-ipa {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .vc-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .vc-icon-btn {
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }
    .vc-icon-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    .vc-icon-btn.active-mastered {
      background: rgba(16, 185, 129, 0.16);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .vc-icon-btn.active-learning {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .vc-meaning {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--success);
    }
    .vc-sub-note {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .vc-example-line {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.4;
    }

    /* ── Minimalist Quiz View ── */
    .quiz-wrap {
      max-width: 720px;
      margin: 0 auto 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-item-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .quiz-q-text {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.5;
      margin: 6px 0 12px;
    }
    .quiz-opts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .quiz-opt-btn {
      text-align: left;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .quiz-opt-btn:hover {
      border-color: var(--accent-primary);
    }
    .quiz-opt-btn.is-correct {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--success);
      color: var(--success);
    }
    .quiz-opt-btn.is-wrong {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--danger);
      color: var(--danger);
    }
    .quiz-explain-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(99, 102, 241, 0.08);
      border-left: 3px solid var(--accent-primary);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    @media (max-width: 640px) {
      .vocab-compact-grid,
      .quiz-opts-grid {
        grid-template-columns: 1fr;
      }
      .band-chip-label {
        font-size: 0.78rem;
      }
    }

    [data-theme="light"] .band-chip-btn,
    [data-theme="light"] .topic-pill-btn,
    [data-theme="light"] .slim-status-strip,
    [data-theme="light"] .vocab-flashcard,
    [data-theme="light"] .vocab-compact-card,
    [data-theme="light"] .quiz-item-card,
    [data-theme="light"] .search-box-minimal,
    [data-theme="light"] .mini-filter-chip,
    [data-theme="light"] .quiz-opt-btn,
    [data-theme="light"] .vc-icon-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #1e293b;
    }
    [data-theme="light"] .band-chip-btn.active,
    [data-theme="light"] .mini-filter-chip.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    [data-theme="light"] .topic-pill-btn.active {
      background: #eef2ff;
      color: #312e81;
      border-color: #6366f1;
    }
    [data-theme="light"] .fc-back-details {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .vc-example-line {
      border-top-color: #f1f5f9;
    }

    /* ── 40-Test ETS Dictionary Minimalist Styles ── */
    .dict-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
    }
    .dict-search-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .dict-sort-select {
      padding: 7px 10px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }
    .dict-stat-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }
    .dict-mini-badge {
      font-size: 0.71rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
    }
    .dict-mini-badge.is-hot {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.35);
      color: var(--success);
    }
    .dict-mini-badge.is-fam {
      background: rgba(99, 102, 241, 0.14);
      border-color: rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }
    .dict-card-clickable {
      cursor: pointer;
    }
    .dict-pager-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 16px 0 40px;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    /* Word Detail Modal */
    .dict-modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: rgba(9, 13, 26, 0.72);
      backdrop-filter: blur(5px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .dict-modal-backdrop.open {
      display: flex;
    }
    .dict-modal-panel {
      width: 100%;
      max-width: 720px;
      max-height: 88vh;
      overflow-y: auto;
      background: var(--bg-primary);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 20px 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .dict-freq-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .dict-freq-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 9px 10px;
      text-align: center;
    }
    .dict-freq-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      line-height: 1.2;
    }
    .dict-freq-lbl {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .dict-sec-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 14px;
    }
    .dict-sec-title {
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .fam-chips-wrap,
    .qmap-chips-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .fam-chip-btn {
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: border-color 0.15s ease;
    }
    .fam-chip-btn:hover,
    .fam-chip-btn.is-self {
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.15);
    }
    .qmap-link-chip {
      text-decoration: none;
      padding: 4px 9px;
      border-radius: 6px;
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
    }
    .qmap-link-chip:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }
    .qmap-link-chip.is-ans {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--success);
    }
    .qmap-link-chip.is-opt {
      background: rgba(99, 102, 241, 0.12);
      border-color: rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }

    @media (max-width: 640px) {
      .dict-freq-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    [data-theme="light"] .dict-sort-select,
    [data-theme="light"] .dict-modal-panel,
    [data-theme="light"] .fam-chip-btn,
    [data-theme="light"] .qmap-link-chip {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #1e293b;
    }
    [data-theme="light"] .dict-freq-box,
    [data-theme="light"] .dict-sec-box,
    [data-theme="light"] .dict-mini-badge {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #334155;
    }
    [data-theme="light"] .dict-mini-badge.is-fam,
    [data-theme="light"] .qmap-link-chip.is-opt {
      background: #eef2ff;
      border-color: #a5b4fc;
      color: #3730a3;
    }
    [data-theme="light"] .dict-mini-badge.is-hot,
    [data-theme="light"] .qmap-link-chip.is-ans {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #047857;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="app-navbar">
    <div class="nav-brand">
      <a href="index.html" style="color: inherit; display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <span>🎯 TOEIC Master</span>
      </a>
      <span class="brand-badge">Từ Vựng</span>
    </div>
    <div class="nav-links">
      <div class="header-ctrl-dropdown" id="header-zoom-ctrl">
        <button type="button" class="nav-icon-ctrl-btn" id="zoom-menu-btn" onclick="StorageService.toggleHeaderPopover('zoom-popover-menu', event)" aria-label="Điều chỉnh cỡ chữ và thu phóng toàn trang" title="Chỉnh cỡ chữ / Thu phóng toàn trang">
          <span>🔤</span>
          <span id="zoom-level-label">100%</span>
        </button>
        <div class="header-ctrl-popover" id="zoom-popover-menu" style="display: none;" onclick="event.stopPropagation()">

  <!-- 40-Test Dictionary Word Detail Modal -->
  <div class="dict-modal-backdrop" id="dict-word-modal" role="dialog" aria-modal="true" aria-label="Chi tiết từ điển 40 đề ETS" onclick="closeDictWordModal(event)">
    <div class="dict-modal-panel" id="dict-word-modal-body" onclick="event.stopPropagation()"></div>
  </div>

  <script src="js/app-config.js?v=20261025v11"></script>
  <script src="js/storage-service.js?v=20261025v11"></script>
  <script src="js/study-data.js?v=20261025v11"></script>
  <script>
    let currentBand = '450';
    let currentTopicId = '';
    let currentMode = 'list'; // 'list' | 'flashcard' | 'quiz' | 'dict'
    let flashcardIndex = 0;
    let isFlashcardFlipped = false;
    let listSearchQuery = '';
    let listStatusFilter = 'all';
    let quizUserAnswers = {};

    // 40-Test ETS Dictionary State
    let dictSearchQuery = '';
    let dictBandFilter = 'all'; // 'all' | '450' | '550' | '650' | '750' | '850'
    let dictPosFilter = 'all';  // 'all' | 'fam' | 'ans' | 'n' | 'v' | 'adj' | 'adv' | 'phr' | 'starred'
    let dictSortBy = 'freq';    // 'freq' | 'ans' | 'az'
    let dictPage = 1;
    const DICT_PAGE_SIZE = 40;
    let activeDictWordKey = '';
    let _dictLookupCache = null;

    function getSafeStorage() {
      return (typeof StorageService !== 'undefined')
        ? StorageService
        : (typeof window !== 'undefined' && window.StorageService ? window.StorageService : null);
    }

    function getStudyData() {
      if (typeof StudyData !== 'undefined' && StudyData) return StudyData;
      if (typeof window !== 'undefined' && window.StudyData) return window.StudyData;
      return { bands: [], vocabTopics: [], grammarTopics: [], etsDictionary: [] };
    }

    function getDictIndex() {
      const data = getStudyData();
      const entries = data.etsDictionary || [];
      if (_dictLookupCache && _dictLookupCache.len === entries.length) return _dictLookupCache;
      const byWord = new Map();
      const byId = new Map();
      entries.forEach(e => {
        byWord.set(String(e.w || '').toLowerCase(), e);
        byId.set(e.id, e);
      });
      _dictLookupCache = { len: entries.length, entries, byWord, byId };
      return _dictLookupCache;
    }

    function resolveDictEntry(wordOrId) {
      const idx = getDictIndex();
      const raw = String(wordOrId || '').trim();
      if (!raw) return null;
      if (idx.byId.has(raw)) return idx.byId.get(raw);
      const lw = raw.toLowerCase();
      if (idx.byWord.has(lw)) return idx.byWord.get(lw);
      // Inflection fallback (e.g., products -> product, produced -> produce, cities -> city)
      if (lw.endsWith('ies') && idx.byWord.has(lw.slice(0, -3) + 'y')) return idx.byWord.get(lw.slice(0, -3) + 'y');
      if (lw.endsWith('ied') && idx.byWord.has(lw.slice(0, -3) + 'y')) return idx.byWord.get(lw.slice(0, -3) + 'y');
      if (lw.endsWith('es') && idx.byWord.has(lw.slice(0, -2))) return idx.byWord.get(lw.slice(0, -2));
      if (lw.endsWith('s') && idx.byWord.has(lw.slice(0, -1))) return idx.byWord.get(lw.slice(0, -1));
      if (lw.endsWith('ed') && idx.byWord.has(lw.slice(0, -2))) return idx.byWord.get(lw.slice(0, -2));
      if (lw.endsWith('ed') && idx.byWord.has(lw.slice(0, -1))) return idx.byWord.get(lw.slice(0, -1));
      if (lw.endsWith('ing') && idx.byWord.has(lw.slice(0, -3))) return idx.byWord.get(lw.slice(0, -3));
      if (lw.endsWith('ing') && idx.byWord.has(lw.slice(0, -3) + 'e')) return idx.byWord.get(lw.slice(0, -3) + 'e');
      return null;
    }

    function decodeQMapCode(rawCode) {
      const s = String(rawCode || '').trim();
      const isAns = s.endsWith('*');
      const isOpt = s.endsWith('+');
      const core = s.replace(/[*+]$/, '');
      const [yy, tId, qNumStr] = core.split('-');
      const qNum = Number(qNumStr) || 1;
      const year = `20${yy}`;
      let partNum = 7;
      if (qNum <= 6) partNum = 1;
      else if (qNum <= 31) partNum = 2;
      else if (qNum <= 70) partNum = 3;
      else if (qNum <= 100) partNum = 4;
      else if (qNum <= 130) partNum = 5;
      else if (qNum <= 146) partNum = 6;
      const roleLabel = isAns ? '★ Đáp án đúng' : (isOpt ? '◆ Phương án P5/6' : `P${partNum}`);
      return {
        year,
        testId: tId,
        qNum,
        partNum,
        isAns,
        isOpt,
        label: `ETS ${year} • T${tId} • Q${qNum}`,
        roleLabel,
        href: `result.html?book=${year}&test=${tId}&show=review&q=${qNum}`
      };
    }

    function toggleTheme() {
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleTheme === 'function') {
        storage.toggleTheme();
      }
    }

    function speakEnglishWord(text, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
        return false;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(String(text || ''));
        utter.lang = 'en-US';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
        return true;
      } catch (_) {
        return false;
      }
    }

    function getTopicsForBand(bandId) {
      const data = getStudyData();
      return (data.vocabTopics || []).filter(t => String(t.band) === String(bandId));
    }

    function getCurrentTopic() {
      const topics = getTopicsForBand(currentBand);
      return topics.find(t => t.id === currentTopicId) || topics[0] || null;
    }

    function computeBandStats(bandId) {
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function'
        ? storage.getStudyProgress()
        : { vocabStatus: {}, vocabStarred: {} };
      const topics = getTopicsForBand(bandId);
      let totalWords = 0;
      let masteredCount = 0;
      let learningCount = 0;
      let starredCount = 0;

      topics.forEach(t => {
        (t.words || []).forEach(w => {
          totalWords++;
          const st = prog.vocabStatus && prog.vocabStatus[w.id];
          if (st === 'mastered') masteredCount++;
          else if (st === 'learning') learningCount++;
          if (prog.vocabStarred && prog.vocabStarred[w.id]) starredCount++;
        });
      });

      const pct = totalWords > 0 ? Math.round((masteredCount / totalWords) * 100) : 0;
      return { totalWords, masteredCount, learningCount, starredCount, pct };
    }

    function selectBand(bandId) {
      const validBands = ['450', '550', '650', '750', '850'];
      const clean = String(bandId || '450').replace('+', '').trim();
      currentBand = validBands.includes(clean) ? clean : '450';
      const storage = getSafeStorage();
      if (storage && typeof storage.setStudyBand === 'function') {
        storage.setStudyBand(currentBand);
      }
      if (currentMode === 'dict') {
        dictBandFilter = dictBandFilter === currentBand ? 'all' : currentBand;
        dictPage = 1;
        renderAll();
        return currentBand;
      }
      const topics = getTopicsForBand(currentBand);
      currentTopicId = topics[0] ? topics[0].id : '';
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      quizUserAnswers = {};
      renderAll();
      return currentBand;
    }

    function selectTopic(topicId) {
      currentTopicId = String(topicId || '');
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      quizUserAnswers = {};
      renderAll();
      return currentTopicId;
    }

    function switchVocabMode(mode) {
      const validModes = ['flashcard', 'list', 'quiz', 'dict'];
      currentMode = validModes.includes(mode) ? mode : 'list';
      validModes.forEach(m => {
        const btn = typeof document !== 'undefined' ? document.getElementById(`vmode-${m}`) : null;
        if (btn) {
          if (btn.classList) btn.classList.toggle('active', m === currentMode);
          if (typeof btn.setAttribute === 'function') btn.setAttribute('aria-pressed', m === currentMode ? 'true' : 'false');
        }
      });
      renderAll();
      return currentMode;
    }

    function renderBandSelector() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-band-selector') : null;
      if (!wrap) return;
      const data = getStudyData();
      const bands = data.bands || [];
      if (currentMode === 'dict') {
        const entries = (data.etsDictionary || []);
        wrap.innerHTML = [
          `<button type="button" class="band-chip-btn ${dictBandFilter === 'all' ? 'active' : ''}" onclick="setDictBandFilter('all')" aria-pressed="${dictBandFilter === 'all' ? 'true' : 'false'}">
            <span class="band-chip-label">Tất cả</span>
            <span class="band-chip-sub">${entries.length} từ</span>
          </button>`,
          ...bands.map(b => {
            const cnt = entries.filter(e => String(e.band) === String(b.id)).length;
            const isAct = String(dictBandFilter) === String(b.id);
            return `
              <button type="button" class="band-chip-btn ${isAct ? 'active' : ''}" data-band="${b.id}" onclick="setDictBandFilter('${b.id}')" aria-pressed="${isAct ? 'true' : 'false'}">
                <span class="band-chip-label">${b.label}</span>
                <span class="band-chip-sub">${cnt} từ</span>
              </button>
            `;
          })
        ].join('');
        return;
      }

      wrap.innerHTML = bands.map(b => {
        const stats = computeBandStats(b.id);
        const isActive = String(b.id) === String(currentBand);
        return `
          <button type="button" class="band-chip-btn ${isActive ? 'active' : ''}" data-band="${b.id}" onclick="selectBand('${b.id}')" aria-pressed="${isActive ? 'true' : 'false'}">
            <span class="band-chip-label">${b.label}</span>
            <span class="band-chip-sub">${stats.masteredCount}/${stats.totalWords}</span>
          </button>
        `;
      }).join('');
    }

    function renderBandOverview() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-band-overview') : null;
      if (!wrap) return;
      const data = getStudyData();

      if (currentMode === 'dict') {
        const dStats = data.dictionaryStats || { totalEntries: (data.etsDictionary || []).length, multiMemberFamiliesCount: 0 };
        wrap.innerHTML = `
          <div class="slim-progress-left">
            <strong>📖 Từ điển 40 Đề ETS:</strong>
            <span>Tổng hợp <strong>${dStats.totalEntries}</strong> mục từ • <strong>${dStats.multiMemberFamiliesCount}</strong> gia đình từ cùng gốc • Tra map trực tiếp 8.000 câu</span>
          </div>
          <div class="slim-actions-right">
            <button type="button" class="slim-link-btn" onclick="exportStudyBackup()" title="Xuất file JSON sao lưu tiến độ">⬇️ Sao lưu</button>
            <button type="button" class="slim-link-btn" onclick="triggerImportStudyBackup()" title="Khôi phục tiến độ từ file JSON">⬆️ Khôi phục</button>
          </div>
        `;
        return;
      }

      const stats = computeBandStats(currentBand);
      const topic = getCurrentTopic();
      const topicLabel = topic ? topic.title : '';

      wrap.innerHTML = `
        <div class="slim-progress-left">
          <strong>Mốc ${currentBand}+:</strong>
          <div class="slim-bar-track" role="progressbar" aria-valuenow="${stats.pct}" aria-valuemin="0" aria-valuemax="100">
            <div class="slim-bar-fill" style="width:${stats.pct}%;"></div>
          </div>
          <span>Đã thuộc <strong>${stats.masteredCount}/${stats.totalWords}</strong> (${stats.pct}%) • ⭐ ${stats.starredCount}</span>
        </div>
        <div class="slim-actions-right">
          <span style="color:var(--text-muted);margin-right:4px;">${topicLabel}</span>
          <button type="button" class="slim-link-btn" onclick="exportStudyBackup()" title="Xuất file JSON sao lưu tiến độ">⬇️ Sao lưu</button>
          <button type="button" class="slim-link-btn" onclick="triggerImportStudyBackup()" title="Khôi phục tiến độ từ file JSON">⬆️ Khôi phục</button>
        </div>
      `;
    }

    function renderTopicTabs() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-topic-tabs') : null;
      if (!wrap) return;
      if (currentMode === 'dict') {
        wrap.style.display = 'none';
        wrap.innerHTML = '';
        return;
      }
      wrap.style.display = '';
      const topics = getTopicsForBand(currentBand);
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {} };

      wrap.innerHTML = topics.map(t => {
        const isActive = t.id === currentTopicId;
        const words = t.words || [];
        const mastered = words.filter(w => prog.vocabStatus && prog.vocabStatus[w.id] === 'mastered').length;

        return `
          <button type="button" class="topic-pill-btn ${isActive ? 'active' : ''}" onclick="selectTopic('${t.id}')" aria-pressed="${isActive ? 'true' : 'false'}">
            <span>${t.icon || ''} ${t.title.replace(/\s*\(\d+\+\)$/, '')}</span>
            <span class="topic-pill-count">${mastered}/${words.length}</span>
          </button>
        `;
      }).join('');
    }

    function renderFlashcardMode(topic) {
      const words = (topic && topic.words) || [];
      if (words.length === 0) return '<p style="text-align:center;">Không có dữ liệu từ vựng.</p>';
      if (flashcardIndex < 0) flashcardIndex = 0;
      if (flashcardIndex >= words.length) flashcardIndex = words.length - 1;

      const w = words[flashcardIndex];
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {}, vocabStarred: {} };
      const status = (prog.vocabStatus && prog.vocabStatus[w.id]) || 'unseen';
      const isStarred = Boolean(prog.vocabStarred && prog.vocabStarred[w.id]);
      const safeWordEsc = w.word.replace(/'/g, "\\'");

      return `
        <div class="fc-container">
          <div class="fc-meta-row">
            <span>${topic.title} • <strong>${flashcardIndex + 1} / ${words.length}</strong></span>
            <span>${status === 'mastered' ? '✅ Đã thuộc' : (status === 'learning' ? '⏳ Cần ôn' : 'Chưa học')}</span>
          </div>

          <div class="vocab-flashcard ${isFlashcardFlipped ? 'is-flipped' : ''}" id="active-flashcard" onclick="flipFlashcard()" role="button" tabindex="0" aria-label="Lật thẻ từ ${w.word}">
            <div class="fc-header">
              <span class="pos-tag">${w.pos}</span>
              <div style="display:flex;gap:6px;">
                <button type="button" class="icon-pill-btn" onclick="openDictWordModal('${safeWordEsc}', event)" title="Tra Map câu hỏi & Từ cùng gốc trong 40 đề">🔍 Map 40 đề</button>
                <button type="button" class="icon-pill-btn" onclick="speakEnglishWord('${safeWordEsc}', event)">🔊 Nghe</button>
                <button type="button" class="icon-pill-btn ${isStarred ? 'starred' : ''}" onclick="handleToggleStar('${w.id}', event)">${isStarred ? '⭐' : '☆'}</button>
              </div>
            </div>

            ${!isFlashcardFlipped ? `
              <div class="fc-body">
                <div class="fc-word">${w.word}</div>
                <div class="fc-ipa">${w.ipa}</div>
                <div class="fc-example-en">"${w.exampleEn}"</div>
              </div>
              <div class="fc-hint">Nhấn vào thẻ hoặc phím Space để lật xem nghĩa &amp; giải thích</div>
            ` : `
              <div class="fc-body" style="padding:12px 4px;">
                <div style="font-size:1.25rem;font-weight:800;margin-bottom:2px;">${w.word} <span style="font-size:0.82rem;font-weight:500;color:var(--text-muted);">${w.ipa}</span></div>
                <div class="fc-meaning">${w.meaning}</div>
                <div class="fc-back-details">
                  <div><strong>Cụm từ / Vị trí:</strong> ${w.collocations}</div>
                  <div><strong>Ghi chú ETS:</strong> ${w.tip}</div>
                  <div style="padding-top:4px;border-top:1px solid rgba(255,255,255,0.06);">
                    <strong>${w.exampleSource}:</strong> "${w.exampleEn}"<br>
                    <span style="color:var(--text-secondary);">→ ${w.exampleVi}</span>
                  </div>
                </div>
              </div>
              <div class="fc-hint">Nhấn vào thẻ để lật lại mặt trước</div>
            `}
          </div>

          <div class="fc-nav-bar">

    function renderWordListMode(topic) {
      const words = (topic && topic.words) || [];
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {}, vocabStarred: {} };
      const q = (listSearchQuery || '').trim().toLowerCase();

      const filtered = words.filter(w => {
        const st = (prog.vocabStatus && prog.vocabStatus[w.id]) || 'unseen';
        const starred = Boolean(prog.vocabStarred && prog.vocabStarred[w.id]);
        if (listStatusFilter === 'mastered' && st !== 'mastered') return false;
        if (listStatusFilter === 'learning' && st !== 'learning') return false;
        if (listStatusFilter === 'unseen' && st !== 'unseen') return false;
        if (listStatusFilter === 'starred' && !starred) return false;
        if (q) {
          return `${w.word} ${w.meaning} ${w.collocations} ${w.exampleEn}`.toLowerCase().includes(q);
        }
        return true;
      });

      const filters = [
        { id: 'all', label: `Tất cả (${words.length})` },
        { id: 'unseen', label: 'Chưa thuộc' },
        { id: 'learning', label: 'Cần ôn' },
        { id: 'mastered', label: 'Đã thuộc' },
        { id: 'starred', label: '⭐' }
      ];

      return `
        <div class="list-filter-bar">
          <input type="search" class="search-box-minimal" id="vocab-search-input" placeholder="Tìm từ vựng, nghĩa hoặc cụm từ..." value="${listSearchQuery.replace(/"/g, '&quot;')}" oninput="handleVocabSearch(this.value)" aria-label="Tìm kiếm từ vựng">
          <div class="filter-chips-group">
            ${filters.map(f => `
              <button type="button" class="mini-filter-chip ${listStatusFilter === f.id ? 'active' : ''}" onclick="setVocabListFilter('${f.id}')">${f.label}</button>

          </div>
        </div>

        ${filtered.length === 0 ? `
          <div style="text-align:center;padding:32px;color:var(--text-muted);font-size:0.88rem;">Không có từ vựng nào khớp với bộ lọc.</div>
        ` : `
          <div class="vocab-compact-grid">
            ${filtered.map(w => {
              const st = (prog.vocabStatus && prog.vocabStatus[w.id]) || 'unseen';
              const starred = Boolean(prog.vocabStarred && prog.vocabStarred[w.id]);
              const safeWordEsc = w.word.replace(/'/g, "\\'");
              const dictHit = resolveDictEntry(w.word);
              return `
                <article class="vocab-compact-card ${st === 'mastered' ? 'is-mastered' : (st === 'learning' ? 'is-learning' : '')}">
                  <div class="vc-row-top">
                    <div class="vc-word-group">
                      <span class="vc-word" style="cursor:pointer;" onclick="openDictWordModal('${safeWordEsc}', event)" title="Nhấn để xem Map câu hỏi & Từ cùng gốc">${w.word}</span>
                      <span class="pos-tag">${w.pos}</span>
                      <span class="vc-ipa">${w.ipa}</span>
                    </div>
                    <div class="vc-actions">
                      <button type="button" class="vc-icon-btn" onclick="openDictWordModal('${safeWordEsc}', event)" title="Tra Map câu hỏi & Gia đình từ trong 40 đề">🔍${dictHit ? ` ${dictHit.tot}` : ''}</button>
                      <button type="button" class="vc-icon-btn" onclick="speakEnglishWord('${safeWordEsc}', event)" title="Phát âm">🔊</button>
                      <button type="button" class="vc-icon-btn" onclick="handleToggleStar('${w.id}', event)" title="Gắn sao">${starred ? '⭐' : '☆'}</button>
                      <button type="button" class="vc-icon-btn ${st === 'learning' ? 'active-learning' : ''}" onclick="setWordStatus('${w.id}', 'learning')" title="Cần ôn lại">Ôn</button>
                      <button type="button" class="vc-icon-btn ${st === 'mastered' ? 'active-mastered' : ''}" onclick="setWordStatus('${w.id}', 'mastered')" title="Đánh dấu đã thuộc">✓ Thuộc</button>
                    </div>
                  </div>
                  <div class="vc-meaning">${w.meaning}</div>
                  <div class="vc-sub-note">${w.collocations}</div>
                  <div class="vc-example-line">
                    <span style="color:var(--text-secondary);">"${w.exampleEn}"</span> — ${w.exampleVi} <span style="opacity:0.7;">(${w.exampleSource})</span>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function renderQuizMode(topic) {
      const questions = (topic && topic.quizQuestions) || [];
      if (questions.length === 0) return '<p style="text-align:center;">Không có câu hỏi trắc nghiệm.</p>';

      let answeredCount = 0;
      let correctCount = 0;
      questions.forEach(q => {
        const u = quizUserAnswers[q.id];
        if (u) {
          answeredCount++;
          if (u === q.correctAnswer) correctCount++;
        }
      });

      return `
        <div class="quiz-wrap">
          <div class="slim-status-strip" style="margin-bottom:4px;">
            <span><strong>Trắc nghiệm ${topic.title}</strong> • Đã làm ${answeredCount}/${questions.length} • Đúng <strong style="color:var(--success);">${correctCount}/${questions.length}</strong></span>
            <button type="button" class="slim-link-btn" onclick="resetVocabQuiz()">🔄 Làm lại</button>
          </div>

          ${questions.map((q, idx) => {
            const userChoice = quizUserAnswers[q.id] || null;
            const letters = ['A', 'B', 'C', 'D'];
            const reviewHref = q.isOfficialEtsPart5 && q.bookShort && q.testId && q.questionNumber
              ? `result.html?book=20${q.bookShort}&test=${q.testId}&show=review&q=${q.questionNumber}`
              : '';
            return `
              <div class="quiz-item-card">
                <div style="display:flex;justify-content:space-between;align-items:center;font-size:0.74rem;color:var(--text-muted);">
                  <strong>Câu ${idx + 1}/${questions.length}</strong>
                  <span style="display:inline-flex;align-items:center;gap:8px;">
                    <span>${q.source}</span>
                    ${reviewHref ? `<a href="${reviewHref}" target="_blank" rel="noopener" style="color:var(--accent-secondary);text-decoration:none;font-weight:700;">🔗 Mở đề gốc</a>` : ''}
                  </span>
                </div>
                <div class="quiz-q-text">${q.questionText}</div>
                <div class="quiz-opts-grid">
                  ${letters.map(letter => {
                    const optText = q.options && q.options[letter] ? q.options[letter] : '';
                    let cls = 'quiz-opt-btn';
                    if (userChoice) {
                      if (letter === q.correctAnswer) cls += ' is-correct';
                      else if (letter === userChoice) cls += ' is-wrong';
                    }
                    return `
                      <button type="button" class="${cls}" onclick="answerVocabQuiz('${q.id}', '${letter}')">
                        <span class="ans-key">${letter}</span>
                        <span>${optText}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
                ${userChoice ? `
                  <div class="quiz-explain-box">
                    <div style="font-weight:700;color:${userChoice === q.correctAnswer ? 'var(--success)' : 'var(--danger)'};margin-bottom:3px;">
                      ${userChoice === q.correctAnswer ? '✓ Chính xác!' : `✕ Đáp án đúng: (${q.correctAnswer}) ${q.options[q.correctAnswer] || ''}`}
                    </div>
                    <div><strong>Dịch:</strong> ${q.questionTranslation}</div>
                    <div style="color:var(--text-secondary);margin-top:2px;">${q.explanation}</div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function getFilteredDictionaryEntries() {
      const idx = getDictIndex();
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStarred: {} };
      const q = (dictSearchQuery || '').trim().toLowerCase();
      const directResolved = q ? resolveDictEntry(q) : null;

      let list = idx.entries.filter(e => {
        if (dictBandFilter !== 'all' && String(e.band) !== String(dictBandFilter)) return false;
        if (dictPosFilter === 'fam' && (!e.fam || e.fam.length < 2)) return false;
        if (dictPosFilter === 'ans' && (!e.p56Ans || e.p56Ans < 1)) return false;
        if (dictPosFilter === 'starred' && !(prog.vocabStarred && prog.vocabStarred[e.id])) return false;
        if (['n', 'v', 'adj', 'adv', 'phr'].includes(dictPosFilter)) {
          const pTokens = String(e.pos || '').split(/\s*\/\s*/);
          if (!pTokens.includes(dictPosFilter)) return false;
        }
        if (q) {
          if (directResolved && directResolved.id === e.id) return true;
          if (e.w.includes(q) || String(e.m || '').toLowerCase().includes(q)) return true;
          if ((e.fam || []).some(fm => fm.w.includes(q))) return true;
          if ((e.colloc || []).some(c => c.toLowerCase().includes(q))) return true;
          return false;
        }
        return true;
      });

      if (q) {
        // Put exact or inflection-resolved headword match first!
        list = list.slice().sort((a, b) => {
          const aExact = a.w === q || (directResolved && a.id === directResolved.id) ? 1 : (a.w.startsWith(q) ? 0.5 : 0);
          const bExact = b.w === q || (directResolved && b.id === directResolved.id) ? 1 : (b.w.startsWith(q) ? 0.5 : 0);
          if (bExact !== aExact) return bExact - aExact;
          return b.tot - a.tot;
        });
      } else if (dictSortBy === 'ans') {
        list = list.slice().sort((a, b) => b.p56Ans - a.p56Ans || b.p56Opt - a.p56Opt || b.tot - a.tot);
      } else if (dictSortBy === 'az') {
        list = list.slice().sort((a, b) => a.w.localeCompare(b.w));
      }
      return list;
    }

    function renderDictionaryMode() {
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {}, vocabStarred: {} };
      const filtered = getFilteredDictionaryEntries();
      const totalPages = Math.max(1, Math.ceil(filtered.length / DICT_PAGE_SIZE));
      if (dictPage > totalPages) dictPage = totalPages;
      if (dictPage < 1) dictPage = 1;
      const startIdx = (dictPage - 1) * DICT_PAGE_SIZE;
      const pageItems = filtered.slice(startIdx, startIdx + DICT_PAGE_SIZE);

      const posFilters = [
        { id: 'all', label: 'Tất cả' },
        { id: 'fam', label: '🌳 Có từ cùng gốc' },
        { id: 'ans', label: '🎯 Đáp án đúng P5/6' },
        { id: 'n', label: 'Danh từ' },
        { id: 'v', label: 'Động từ' },
        { id: 'adj', label: 'Tính từ' },
        { id: 'adv', label: 'Trạng từ' },
        { id: 'phr', label: 'Cụm từ' },
        { id: 'starred', label: '⭐ Đã lưu' }

      return `
        <div class="dict-toolbar">
          <div class="dict-search-row">
            <input type="search" class="search-box-minimal" id="dict-search-input" placeholder="Tra từ tiếng Anh (kể cả chia thì/số nhiều), nghĩa tiếng Việt hoặc cụm từ trong 40 đề..." value="${dictSearchQuery.replace(/"/g, '&quot;')}" oninput="handleDictSearch(this.value)" aria-label="Tra từ điển 40 đề ETS">
            <select class="dict-sort-select" onchange="setDictSortBy(this.value)" aria-label="Sắp xếp từ điển">
              <option value="freq" ${dictSortBy === 'freq' ? 'selected' : ''}>🔥 Xuất hiện nhiều nhất</option>
              <option value="ans" ${dictSortBy === 'ans' ? 'selected' : ''}>🎯 Hay làm đáp án P5/6</option>
              <option value="az" ${dictSortBy === 'az' ? 'selected' : ''}>🔤 Bảng chữ cái A ➔ Z</option>
            </select>
          </div>
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
            <div class="filter-chips-group">
              ${posFilters.map(f => `
                <button type="button" class="mini-filter-chip ${dictPosFilter === f.id ? 'active' : ''}" onclick="setDictPosFilter('${f.id}')">${f.label}</button>
              `).join('')}
            </div>
            <span style="font-size:0.76rem;color:var(--text-muted);">Tìm thấy <strong>${filtered.length}</strong> mục từ</span>
          </div>
        </div>

        ${pageItems.length === 0 ? `
          <div style="text-align:center;padding:36px;color:var(--text-muted);font-size:0.88rem;">Không tìm thấy từ khớp với bộ lọc hiện tại.</div>
        ` : `
          <div class="vocab-compact-grid" style="margin-bottom:16px;">
            ${pageItems.map(e => {
              const st = (prog.vocabStatus && prog.vocabStatus[e.id]) || 'unseen';
              const starred = Boolean(prog.vocabStarred && prog.vocabStarred[e.id]);
              const safeWordEsc = e.w.replace(/'/g, "\\'");
              return `
                <article class="vocab-compact-card dict-card-clickable ${st === 'mastered' ? 'is-mastered' : (st === 'learning' ? 'is-learning' : '')}" onclick="openDictWordModal('${e.id}', event)">
                  <div class="vc-row-top">
                    <div class="vc-word-group">
                      <span class="vc-word">${e.w}</span>
                      <span class="pos-tag">${e.pos}</span>
                      ${e.ipa ? `<span class="vc-ipa">${e.ipa}</span>` : `<span class="vc-ipa">${e.band}+</span>`}
                    </div>
                    <div class="vc-actions" onclick="event.stopPropagation()">
                      <button type="button" class="vc-icon-btn" onclick="speakEnglishWord('${safeWordEsc}', event)" title="Phát âm">🔊</button>
                      <button type="button" class="vc-icon-btn" onclick="handleToggleStar('${e.id}', event)" title="Gắn sao">${starred ? '⭐' : '☆'}</button>
                      <button type="button" class="vc-icon-btn ${st === 'mastered' ? 'active-mastered' : ''}" onclick="setWordStatus('${e.id}', 'mastered')" title="Đã thuộc">✓</button>
                    </div>
                  </div>
                  <div class="vc-meaning">${e.m}</div>
                  <div class="dict-stat-badges">
                    <span class="dict-mini-badge">📊 <strong>${e.tot}</strong> lần (LC:${e.parts.lc} • P5-6:${e.parts.p56} • P7:${e.parts.p7})</span>
                    ${e.p56Ans > 0 ? `<span class="dict-mini-badge is-hot">🎯 ${e.p56Ans} lần đáp án đúng</span>` : ''}
                    ${e.fam && e.fam.length >= 2 ? `<span class="dict-mini-badge is-fam">🌳 ${e.fam.length} từ cùng gốc</span>` : ''}
                  </div>
                </article>
              `;
            }).join('')}
          </div>

          ${totalPages > 1 ? `
            <div class="dict-pager-bar">
              <button type="button" class="btn btn-secondary btn-sm" onclick="stepDictPage(-1)" ${dictPage <= 1 ? 'disabled' : ''}>◀ Trang trước</button>
              <span>Trang <strong>${dictPage} / ${totalPages}</strong> (${filtered.length} từ)</span>
              <button type="button" class="btn btn-secondary btn-sm" onclick="stepDictPage(1)" ${dictPage >= totalPages ? 'disabled' : ''}>Trang sau ▶</button>
            </div>
          ` : ''}
        `}
      `;
    }

    function openDictWordModal(wordOrId, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      const entry = resolveDictEntry(wordOrId);
      const modal = typeof document !== 'undefined' ? document.getElementById('dict-word-modal') : null;
      const body = typeof document !== 'undefined' ? document.getElementById('dict-word-modal-body') : null;
      if (!entry || !modal || !body) return null;

      activeDictWordKey = entry.id;
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {}, vocabStarred: {} };
      const st = (prog.vocabStatus && prog.vocabStatus[entry.id]) || 'unseen';
      const starred = Boolean(prog.vocabStarred && prog.vocabStarred[entry.id]);
      const safeWordEsc = entry.w.replace(/'/g, "\\'");
      const decodedQMap = (entry.qMap || []).map(decodeQMapCode);

      body.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
              <h2 style="margin:0;font-size:1.65rem;font-weight:800;color:var(--text-primary);">${entry.w}</h2>
              <span class="pos-tag">${entry.pos}</span>
              ${entry.ipa ? `<span class="vc-ipa" style="font-size:0.9rem;">${entry.ipa}</span>` : ''}
              <span class="dict-mini-badge">Mục tiêu ${entry.band}+</span>
            </div>
            <div style="font-size:1.1rem;font-weight:800;color:var(--success);margin-top:4px;">${entry.m}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;">
            <button type="button" class="icon-pill-btn" onclick="speakEnglishWord('${safeWordEsc}', event)">🔊 Phát âm</button>
            <button type="button" class="icon-pill-btn ${starred ? 'starred' : ''}" onclick="handleToggleStar('${entry.id}', event); openDictWordModal('${entry.id}')">${starred ? '⭐ Đã lưu' : '☆ Lưu từ'}</button>
            <button type="button" class="vc-icon-btn ${st === 'mastered' ? 'active-mastered' : ''}" onclick="setWordStatus('${entry.id}', 'mastered'); openDictWordModal('${entry.id}')">✓ Đã thuộc</button>
            <button type="button" class="icon-pill-btn" onclick="closeDictWordModal()" aria-label="Đóng cửa sổ">✕</button>
          </div>
        </div>

        <!-- 1. Frequency Breakdown across 40 ETS Tests -->
        <div class="dict-freq-grid">
          <div class="dict-freq-box">
            <div class="dict-freq-num" style="color:var(--accent-secondary);">${entry.tot}</div>
            <div class="dict-freq-lbl">Tổng lần gặp / 40 đề</div>
          </div>
          <div class="dict-freq-box">
            <div class="dict-freq-num">${entry.parts.lc}</div>
            <div class="dict-freq-lbl">Nghe (Part 1–4)</div>
          </div>
          <div class="dict-freq-box">
            <div class="dict-freq-num" style="color:var(--success);">${entry.parts.p56}</div>
            <div class="dict-freq-lbl">Part 5–6 (${entry.p56Opt} chọn • ${entry.p56Ans} đúng)</div>
          </div>
          <div class="dict-freq-box">
            <div class="dict-freq-num">${entry.parts.p7}</div>
            <div class="dict-freq-lbl">Đọc hiểu (Part 7)</div>
          </div>
        </div>

        <!-- 2. Word Family / Same Morphological Root -->
        ${entry.fam && entry.fam.length >= 2 ? `
          <div class="dict-sec-box">
            <div class="dict-sec-title">🌳 Gia đình từ / Các từ cùng gốc trong 40 đề (${entry.fam.length} từ)</div>
            <div class="fam-chips-wrap">
              ${entry.fam.map(fm => `
                <button type="button" class="fam-chip-btn ${fm.w === entry.w ? 'is-self' : ''}" onclick="openDictWordModal('${fm.w.replace(/'/g, "\\'")}', event)">
                  <strong>${fm.w}</strong>
                  <span class="pos-tag" style="padding:1px 5px;font-size:0.66rem;">${fm.pos}</span>
                  <span style="color:var(--text-secondary);font-size:0.75rem;">${fm.m}</span>
                  <span style="color:var(--text-muted);font-size:0.72rem;">(${fm.tot} lần)</span>
                </button>
              `).join('')}
            </div>
          </div>
        ` : ''}

        <!-- 3. Collocations, Tips & Real ETS Bilingual Examples -->
        ${(entry.colloc && entry.colloc.length > 0) || entry.tip || (entry.ex && entry.ex.length > 0) ? `
          <div class="dict-sec-box" style="display:flex;flex-direction:column;gap:8px;font-size:0.84rem;line-height:1.45;">

            ${decodedQMap.map(qm => `
              <a href="${qm.href}" target="_blank" rel="noopener" class="qmap-link-chip ${qm.isAns ? 'is-ans' : (qm.isOpt ? 'is-opt' : '')}" title="Mở giải thích chi tiết câu ${qm.qNum} (${qm.label})">
                <span>${qm.label}</span>
                <span style="opacity:0.85;">• ${qm.roleLabel}</span>
              </a>
            `).join('')}
            ${entry.tot > decodedQMap.length ? `
              <span class="dict-mini-badge">+ ${entry.tot - decodedQMap.length} câu khác trong bộ 40 đề</span>
            ` : ''}
          </div>
        </div>
      `;

      if (modal.classList) modal.classList.add('open');
      return entry;
    }

    function closeDictWordModal(event) {
      if (event && event.target && event.target.id && event.target.id !== 'dict-word-modal') return;
      const modal = typeof document !== 'undefined' ? document.getElementById('dict-word-modal') : null;
      if (modal && modal.classList) modal.classList.remove('open');
      activeDictWordKey = '';
    }

    function handleDictSearch(val) {
      dictSearchQuery = String(val || '');
      dictPage = 1;
      renderWorkspace();
      const input = typeof document !== 'undefined' ? document.getElementById('dict-search-input') : null;
      if (input && typeof input.focus === 'function') {
        input.focus();
        try { input.setSelectionRange(dictSearchQuery.length, dictSearchQuery.length); } catch (_) {}
      }
    }

    function setDictBandFilter(band) {
      dictBandFilter = band || 'all';
      dictPage = 1;
      renderAll();
    }

    function setDictPosFilter(pos) {
      dictPosFilter = pos || 'all';
      dictPage = 1;
      renderWorkspace();
    }

    function setDictSortBy(sortVal) {
      dictSortBy = sortVal || 'freq';
      dictPage = 1;
      renderWorkspace();
    }

    function stepDictPage(delta) {
      dictPage = Math.max(1, dictPage + delta);
      renderWorkspace();
      if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function renderWorkspace() {
      const container = typeof document !== 'undefined' ? document.getElementById('vocab-workspace-container') : null;
      if (!container) return;
      if (currentMode === 'dict') {
        container.innerHTML = renderDictionaryMode();
        return;
      }
      const topic = getCurrentTopic();
      if (!topic) {
        container.innerHTML = '';
        return;
      }
      if (currentMode === 'flashcard') {
        container.innerHTML = renderFlashcardMode(topic);
      } else if (currentMode === 'quiz') {
        container.innerHTML = renderQuizMode(topic);
      } else {
        container.innerHTML = renderWordListMode(topic);
      }
    }

    function renderAll() {
      renderBandSelector();
      renderTopicTabs();
      renderBandOverview();
      renderWorkspace();
    }

    function flipFlashcard() {
      isFlashcardFlipped = !isFlashcardFlipped;
      renderWorkspace();
      return isFlashcardFlipped;
    }

    function stepFlashcard(delta) {
      const topic = getCurrentTopic();
      const words = (topic && topic.words) || [];
      if (words.length === 0) return 0;
      flashcardIndex = Math.min(words.length - 1, Math.max(0, flashcardIndex + delta));
      isFlashcardFlipped = false;
      renderWorkspace();
      return flashcardIndex;
    }

    function setWordStatus(wordId, status) {
      const storage = getSafeStorage();
      if (storage && typeof storage.setVocabWordStatus === 'function') {
        const prog = storage.getStudyProgress();
        const cur = prog.vocabStatus && prog.vocabStatus[wordId];
        const next = cur === status ? 'unseen' : status;
        storage.setVocabWordStatus(wordId, next);
      }
      renderAll();
    }

    function markWordStatusAndNext(wordId, status) {
      const storage = getSafeStorage();
      if (storage && typeof storage.setVocabWordStatus === 'function') {
        storage.setVocabWordStatus(wordId, status);
      }
      const topic = getCurrentTopic();
      const words = (topic && topic.words) || [];
      if (flashcardIndex < words.length - 1) flashcardIndex++;
      isFlashcardFlipped = false;
      renderAll();
    }

    function handleToggleStar(wordId, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleVocabStar === 'function') {
        storage.toggleVocabStar(wordId);
      }
      renderAll();
    }

    function handleVocabSearch(val) {
      listSearchQuery = String(val || '');
      renderWorkspace();
      const input = typeof document !== 'undefined' ? document.getElementById('vocab-search-input') : null;
      if (input && typeof input.focus === 'function') {
        input.focus();
        try { input.setSelectionRange(listSearchQuery.length, listSearchQuery.length); } catch (_) {}
      }
    }

    function setVocabListFilter(filterId) {
      listStatusFilter = filterId || 'all';
      renderWorkspace();
    }

    function answerVocabQuiz(questionId, choice) {
      quizUserAnswers[questionId] = choice;
      const topic = getCurrentTopic();
      if (topic && Array.isArray(topic.quizQuestions)) {
        let correct = 0;
        topic.quizQuestions.forEach(q => {
          if (quizUserAnswers[q.id] === q.correctAnswer) correct++;
        });
        const storage = getSafeStorage();
        if (storage && typeof storage.saveVocabQuizScore === 'function') {
          storage.saveVocabQuizScore(topic.id, correct, topic.quizQuestions.length);
        }
      }
      renderAll();
    }

    function resetVocabQuiz() {
      quizUserAnswers = {};
      renderWorkspace();
    }

    function exportStudyBackup() {
      const storage = getSafeStorage();
      if (!storage || typeof storage.exportStudyProgressJSON !== 'function') return null;
      const jsonStr = storage.exportStudyProgressJSON();
      if (typeof document !== 'undefined' && typeof Blob !== 'undefined' && typeof URL !== 'undefined') {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `toeic_study_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
      return jsonStr;
    }

    function triggerImportStudyBackup() {
      const input = typeof document !== 'undefined' ? document.getElementById('study-backup-file-input') : null;
      if (input && typeof input.click === 'function') input.click();
    }

    function handleImportStudyBackup(event) {
      const file = event && event.target && event.target.files && event.target.files[0];
      if (!file || typeof FileReader === 'undefined') return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e && e.target ? e.target.result : '';
        const storage = getSafeStorage();
        if (storage && typeof storage.importStudyProgressJSON === 'function') {
          const res = storage.importStudyProgressJSON(content);
          if (res && res.ok) {
            if (typeof alert === 'function') alert('✅ Khôi phục tiến độ thành công!');
            renderAll();
          } else if (typeof alert === 'function') {
            alert('⚠️ ' + ((res && res.error) || 'File backup không hợp lệ.'));
          }
        }
      };
      reader.readAsText(file);
    }

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('DOMContentLoaded', () => {
        const storage = getSafeStorage();
        if (storage && typeof storage.initTheme === 'function') storage.initTheme();
        let initialBand = '450';
        if (storage && typeof storage.getStudyProgress === 'function') {
          initialBand = storage.getStudyProgress().lastBand || '450';
        }
        let targetWord = '';
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('band')) initialBand = params.get('band');
          if (params.get('mode')) switchVocabMode(params.get('mode'));
          if (params.get('word')) targetWord = params.get('word');
        } catch (_) {}
        selectBand(initialBand);
        if (targetWord) {
          switchVocabMode('dict');
          handleDictSearch(targetWord);
          openDictWordModal(targetWord);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' && activeDictWordKey) {
          closeDictWordModal();
          return;
        }
        if (currentMode !== 'flashcard' || activeDictWordKey) return;
        const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          flipFlashcard();
        } else if (e.code === 'ArrowRight') {
          stepFlashcard(1);
        } else if (e.code === 'ArrowLeft') {
          stepFlashcard(-1);
        }
      });
    }

    if (typeof window !== 'undefined') {
      window.selectBand = selectBand;
      window.selectTopic = selectTopic;
      window.switchVocabMode = switchVocabMode;
      window.flipFlashcard = flipFlashcard;
      window.stepFlashcard = stepFlashcard;
      window.setWordStatus = setWordStatus;
      window.markWordStatusAndNext = markWordStatusAndNext;
      window.handleToggleStar = handleToggleStar;
      window.handleVocabSearch = handleVocabSearch;
      window.setVocabListFilter = setVocabListFilter;
      window.answerVocabQuiz = answerVocabQuiz;
      window.resetVocabQuiz = resetVocabQuiz;
      window.handleDictSearch = handleDictSearch;
      window.setDictBandFilter = setDictBandFilter;
      window.setDictPosFilter = setDictPosFilter;
      window.setDictSortBy = setDictSortBy;
      window.stepDictPage = stepDictPage;
      window.openDictWordModal = openDictWordModal;
      window.closeDictWordModal = closeDictWordModal;
      window.resolveDictEntry = resolveDictEntry;
      window.decodeQMapCode = decodeQMapCode;
      window.exportStudyBackup = exportStudyBackup;
      window.triggerImportStudyBackup = triggerImportStudyBackup;
      window.handleImportStudyBackup = handleImportStudyBackup;
      window.speakEnglishWord = speakEnglishWord;
      window.toggleTheme = toggleTheme;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        selectBand,
        selectTopic,
        switchVocabMode,
        flipFlashcard,
        stepFlashcard,
        setWordStatus,
        markWordStatusAndNext,
        handleToggleStar,
        handleVocabSearch,
        setVocabListFilter,
        answerVocabQuiz,
        resetVocabQuiz,
        handleDictSearch,
        setDictBandFilter,
        setDictPosFilter,
        setDictSortBy,
        stepDictPage,
        openDictWordModal,
        closeDictWordModal,
        resolveDictEntry,
        decodeQMapCode,
         getFilteredDictionaryEntries,
        exportStudyBackup,
        computeBandStats
      };
    }
  </script>
</body>
</html>
