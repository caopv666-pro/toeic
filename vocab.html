<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Từ Vựng &amp; Từ Điển 40 Đề ETS (450+ ➔ 850+) — TOEIC Master</title>
  <meta name="description" content="Kho từ vựng và từ điển tổng hợp từ 40 bộ đề ETS TOEIC (450+ ➔ 850+): tra map 8.000 câu hỏi, gia đình từ cùng gốc, Flashcard và Quiz thực chiến.">

  <link rel="stylesheet" href="css/base.css?v=20261025v12">
  <link rel="stylesheet" href="css/layout.css?v=20261025v12">
  <link rel="stylesheet" href="css/components.css?v=20261025v12">
  <link rel="stylesheet" href="css/responsive.css?v=20261025v12">
  <style>
    /* ── Ultra-Minimalist Top Filter & Control Bar ── */
    .study-top-section {
      padding: 14px 0 8px;
      text-align: center;
      max-width: 880px;
      margin: 0 auto;
    }
    .band-chip-row {
      display: flex;
      justify-content: center;
      align-items: stretch;
      gap: 5px;
      margin: 0 auto 10px;
      max-width: 620px;
    }
    .band-chip-btn {
      flex: 1 1 0;
      padding: 6px 4px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1px;
      min-width: 0;
    }
    .band-chip-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .band-chip-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .band-chip-label {
      font-size: 0.82rem;
      font-weight: 800;
      line-height: 1.15;
      white-space: nowrap;
    }
    .band-chip-sub {
      font-size: 0.65rem;
      font-weight: 600;
      opacity: 0.88;
      white-space: nowrap;
    }

    /* 3-Tab Mode Switcher — Never Overflows Mobile */
    .study-top-section .mode-tabs {
      display: flex;
      width: 100%;
      max-width: 520px;
      margin: 0 auto 10px;
      padding: 4px;
      gap: 4px;
      box-sizing: border-box;
    }
    .study-top-section .mode-tab-btn {
      flex: 1 1 0;
      min-width: 0;
      padding: 8px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      white-space: nowrap;
      text-align: center;
    }

    /* Slim Status & Backup Bar */
    .slim-status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }
    .slim-progress-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1 1 240px;
      min-width: 0;
      flex-wrap: wrap;
      text-align: left;
    }
    .slim-bar-track {
      flex: 1 1 80px;
      max-width: 120px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .slim-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .slim-actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slim-link-btn {
      padding: 4px 9px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .slim-link-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.1);
    }

    /* ── Shared Minimalist Toolbar & Pack Selector ── */
    .vocab-workspace-wrap {
      max-width: 880px;
      margin: 0 auto 48px;
    }
    .dict-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .dict-search-row {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }
    .search-box-minimal {
      flex: 1 1 190px;
      min-width: 0;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.84rem;
    }
    .dict-sort-select,
    .pack-select-box {
      padding: 8px 10px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      max-width: 100%;
    }
    .swipe-pills-row {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }
    .mini-filter-chip {
      padding: 5px 11px;
      border-radius: var(--radius-full);
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all 0.15s ease;
    }
    .mini-filter-chip:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
    }
    .mini-filter-chip.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    .pack-bar-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      margin-bottom: 12px;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }

    /* ── 40-Test Dictionary Cards Grid ── */
    .vocab-compact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .vocab-compact-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      cursor: pointer;
      transition: border-color 0.15s ease, transform 0.12s ease;
    }
    .vocab-compact-card:hover {
      border-color: var(--accent-primary);
      transform: translateY(-1px);
    }
    .vocab-compact-card.is-mastered {
      border-left: 3px solid var(--success);
    }
    .vocab-compact-card.is-learning {
      border-left: 3px solid var(--warning);
    }
    .vc-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .vc-word-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .vc-word {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .vc-ipa {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .pos-tag {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 2px 7px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.14);
      color: #a5b4fc;
    }
    .vc-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .vc-icon-btn {
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }
    .vc-icon-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    .vc-icon-btn.active-mastered {
      background: rgba(16, 185, 129, 0.16);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .vc-icon-btn.active-learning {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .vc-meaning {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--success);
      line-height: 1.38;
    }
    .dict-stat-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 2px;
    }
    .dict-mini-badge {
      font-size: 0.71rem;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
    }
    .dict-mini-badge.is-hot {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.35);
      color: var(--success);
    }
    .dict-mini-badge.is-fam {
      background: rgba(99, 102, 241, 0.14);
      border-color: rgba(99, 102, 241, 0.35);
      color: #a5b4fc;
    }
    .dict-pager-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      margin-bottom: 24px;
      font-size: 0.8rem;
    }

    /* ── Minimalist Flashcard ── */
    .fc-container {
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .fc-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .vocab-flashcard {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 22px 22px 18px;
      min-height: 270px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }
    .vocab-flashcard:hover {
      border-color: var(--accent-primary);
    }
    .vocab-flashcard.is-flipped {
      border-color: var(--accent-secondary);
    }
    .fc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .icon-pill-btn {
      padding: 5px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-pill-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    .icon-pill-btn.starred {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.12);
    }
    .fc-body {
      text-align: center;
      padding: 18px 6px;
    }
    .fc-word {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }
    .fc-ipa {
      font-family: var(--font-mono);
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }
    .fc-meaning {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--success);
      margin-bottom: 12px;
    }
    .fc-example-en {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 490px;
      margin: 0 auto;
    }
    .fc-back-details {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 11px 14px;
      font-size: 0.83rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fc-hint {
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .fc-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* ── Minimalist Quiz View ── */
    .quiz-wrap {
      max-width: 760px;
      margin: 0 auto 40px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .quiz-item-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 15px 16px;
    }
    .quiz-q-text {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.5;
      margin: 6px 0 12px;
    }
    .quiz-opts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .quiz-opts-grid.is-meaning-opts {
      grid-template-columns: 1fr;
    }
    .quiz-opt-btn {
      text-align: left;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .quiz-opt-btn:hover {
      border-color: var(--accent-primary);
    }
    .quiz-opt-btn.is-correct {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--success);
      color: var(--success);
    }
    .quiz-opt-btn.is-wrong {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--danger);
      color: var(--danger);
    }
    .quiz-explain-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(99, 102, 241, 0.08);
      border-left: 3px solid var(--accent-primary);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    /* ── Word Detail Modal (Word Family + Question Map) ── */
    .dict-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1200;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      align-items: flex-start;
      justify-content: center;
      padding: max(16px, env(safe-area-inset-top, 16px)) 12px 32px;
      overflow-y: auto;
    }
    .dict-modal-backdrop.open {
      display: flex;
    }
    .dict-modal-panel {
      width: 100%;
      max-width: 720px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 18px 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
      margin: auto 0;
    }
    .dict-freq-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin: 12px 0;
    }
    .dict-freq-box {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 8px 6px;
      text-align: center;
    }
    .dict-freq-num {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .dict-freq-lbl {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .dict-sec-block {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.07);
    }
    .dict-sec-title {
      font-size: 0.76rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--accent-secondary);
      margin-bottom: 8px;
    }
    .dict-fam-list,
    .dict-qmap-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .dict-fam-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: var(--radius-md);
      background: rgba(99, 102, 241, 0.1);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: var(--text-primary);
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .dict-fam-chip:hover,
    .dict-fam-chip.is-self {
      background: rgba(99, 102, 241, 0.25);
      border-color: var(--accent-primary);
    }
    .dict-qmap-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 9px;
      border-radius: var(--radius-sm);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.15s ease;
    }
    .dict-qmap-chip:hover {
      border-color: var(--accent-secondary);
      color: var(--text-primary);
      background: rgba(6, 182, 212, 0.12);
    }
    .dict-qmap-chip.is-ans {
      background: rgba(16, 185, 129, 0.14);
      border-color: rgba(16, 185, 129, 0.4);
      color: var(--success);
    }

    @media (max-width: 640px) {
      .vocab-compact-grid,
      .quiz-opts-grid {
        grid-template-columns: 1fr;
      }
      .dict-freq-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
      .band-chip-btn {
        padding: 6px 2px;
      }
      .band-chip-label {
        font-size: 0.75rem;
      }
      .band-chip-sub {
        font-size: 0.61rem;
      }
      .study-top-section .mode-tab-btn {
        font-size: 0.78rem;
        padding: 7px 4px;
      }
      .swipe-pills-row {
        flex-wrap: nowrap;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        padding-bottom: 2px;
      }
      .swipe-pills-row::-webkit-scrollbar {
        display: none;
      }
    }

    [data-theme="light"] .band-chip-btn,
    [data-theme="light"] .slim-status-strip,
    [data-theme="light"] .pack-bar-row,
    [data-theme="light"] .vocab-flashcard,
    [data-theme="light"] .vocab-compact-card,
    [data-theme="light"] .quiz-item-card,
    [data-theme="light"] .search-box-minimal,
    [data-theme="light"] .dict-sort-select,
    [data-theme="light"] .pack-select-box,
    [data-theme="light"] .mini-filter-chip,
    [data-theme="light"] .quiz-opt-btn,
    [data-theme="light"] .vc-icon-btn,
    [data-theme="light"] .dict-pager-bar,
    [data-theme="light"] .dict-modal-panel {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #1e293b;
    }
    [data-theme="light"] .band-chip-btn.active,
    [data-theme="light"] .mini-filter-chip.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    [data-theme="light"] .fc-back-details,
    [data-theme="light"] .dict-freq-box,
    [data-theme="light"] .dict-qmap-chip {
      background: #f8fafc;
      border-color: #cbd5e1;
      color: #334155;
    }
    [data-theme="light"] .dict-mini-badge {
      background: #f1f5f9;
      border-color: #cbd5e1;
      color: #334155;
    }
    [data-theme="light"] .dict-mini-badge.is-hot,
    [data-theme="light"] .dict-qmap-chip.is-ans {
      background: #ecfdf5;
      border-color: #6ee7b7;
      color: #047857;
    }
    [data-theme="light"] .dict-mini-badge.is-fam,
    [data-theme="light"] .pos-tag {
      background: #eef2ff;
      border-color: #a5b4fc;
      color: #3730a3;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="app-navbar">
    <div class="nav-brand">
      <a href="index.html" style="color: inherit; display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <span>🎯 TOEIC Master</span>
      </a>
      <span class="brand-badge">Từ Vựng</span>
    </div>
    <div class="nav-links">
      <div class="header-ctrl-dropdown" id="header-zoom-ctrl">
        <button type="button" class="nav-icon-ctrl-btn" id="zoom-menu-btn" onclick="StorageService.toggleHeaderPopover('zoom-popover-menu', event)" aria-label="Điều chỉnh cỡ chữ và thu phóng toàn trang" title="Chỉnh cỡ chữ / Thu phóng toàn trang">
          <span>🔤</span>
          <span id="zoom-level-label">100%</span>
        </button>

  <div class="dict-modal-backdrop" id="dict-word-modal" role="dialog" aria-modal="true" aria-label="Chi tiết từ điển 40 đề ETS" onclick="closeDictWordModal(event)">

  <script src="js/app-config.js?v=20261025v12"></script>
  <script src="js/storage-service.js?v=20261025v12"></script>
  <script src="js/study-data.js?v=20261025v12"></script>
  <script>
    // Unified State across 100% of the 40-Test ETS Dictionary (4,153 headwords + 386 Official Part 5 Vocab Qs)
    const PACK_SIZE = 30;
    let currentBand = '450';     // 'all' | '450' | '550' | '650' | '750' | '850'
    let currentMode = 'dict';    // 'dict' | 'flashcard' | 'quiz'
    let currentPack = 1;         // 1-indexed Study Pack (30 words per pack across all 3 modes!)
    let vocabPosFilter = 'all';  // 'all' | 'unlearned' | 'starred' | 'fam' | 'ans' | 'n' | 'v' | 'adj' | 'adv' | 'phr'
    let dictSearchQuery = '';
    let dictSortBy = 'freq';     // 'freq' | 'ans' | 'az'

    // Flashcard state
    let flashcardIndex = 0;
    let isFlashcardFlipped = false;
    let flashcardShuffledOrder = null;

    // Quiz state
    let quizSourceMode = 'dict'; // 'dict' (100% of 40-Test Dictionary by Pack) | 'part5' (386 Official Part 5 Vocab Qs)
    let quizP5Filter = 'all';    // 'all' | 'unanswered' | 'wrong'
    let quizP5Page = 1;
    const QUIZ_P5_PAGE_SIZE = 20;
    let quizUserAnswers = {};
    let sessionJustAnswered = new Set();

    let activeDictWordKey = '';
    let _dictLookupCache = null;

    function getSafeStorage() {
      return (typeof StorageService !== 'undefined')
        ? StorageService
        : (typeof window !== 'undefined' && window.StorageService ? window.StorageService : null);
    }

    function getStudyData() {
      if (typeof StudyData !== 'undefined' && StudyData) return StudyData;
      if (typeof window !== 'undefined' && window.StudyData) return window.StudyData;
      return { bands: [], officialVocabPart5: [], grammarTopics: [], etsDictionary: [] };
    }

    function getDictIndex() {
      const data = getStudyData();
      const entries = data.etsDictionary || [];
      if (_dictLookupCache && _dictLookupCache.len === entries.length) return _dictLookupCache;
      const byWord = new Map();
      const byId = new Map();
      const byPos = new Map();
      const officialByWord = new Map();
      entries.forEach(e => {
        byWord.set(String(e.w || '').toLowerCase(), e);
        byId.set(e.id, e);
        const pPos = String(e.pos || 'n').split(/[\s/]+/)[0].toLowerCase();
        if (!byPos.has(pPos)) byPos.set(pPos, []);
        byPos.get(pPos).push(e);
      });
      (data.officialVocabPart5 || []).forEach(q => {
        const tw = String(q.targetWord || '').toLowerCase().trim();
        if (tw && !officialByWord.has(tw)) {
          officialByWord.set(tw, q);
        }
      });
      _dictLookupCache = { len: entries.length, entries, byWord, byId, byPos, officialByWord };
      return _dictLookupCache;
    }

    function resolveDictEntry(wordOrId) {
      const idx = getDictIndex();
      const raw = String(wordOrId || '').trim();
      if (!raw) return null;
      if (idx.byId.has(raw)) return idx.byId.get(raw);
      const lw = raw.toLowerCase();
      if (idx.byWord.has(lw)) return idx.byWord.get(lw);
      if (lw.endsWith('ies') && idx.byWord.has(lw.slice(0, -3) + 'y')) return idx.byWord.get(lw.slice(0, -3) + 'y');
      if (lw.endsWith('ied') && idx.byWord.has(lw.slice(0, -3) + 'y')) return idx.byWord.get(lw.slice(0, -3) + 'y');
      if (lw.endsWith('es') && idx.byWord.has(lw.slice(0, -2))) return idx.byWord.get(lw.slice(0, -2));
      if (lw.endsWith('s') && idx.byWord.has(lw.slice(0, -1))) return idx.byWord.get(lw.slice(0, -1));
      if (lw.endsWith('ed') && idx.byWord.has(lw.slice(0, -2))) return idx.byWord.get(lw.slice(0, -2));
      if (lw.endsWith('ed') && idx.byWord.has(lw.slice(0, -1))) return idx.byWord.get(lw.slice(0, -1));
      if (lw.endsWith('ing') && idx.byWord.has(lw.slice(0, -3))) return idx.byWord.get(lw.slice(0, -3));
      if (lw.endsWith('ing') && idx.byWord.has(lw.slice(0, -3) + 'e')) return idx.byWord.get(lw.slice(0, -3) + 'e');
      return null;
    }

    function decodeQMapCode(rawCode) {
      const s = String(rawCode || '').trim();
      const isAns = s.endsWith('*');
      const isOpt = s.endsWith('+');
      const core = s.replace(/[*+]$/, '');
      const [yy, tId, qNumStr] = core.split('-');
      const qNum = Number(qNumStr) || 1;
      const year = `20${yy}`;
      let partNum = 7;
      if (qNum <= 6) partNum = 1;
      else if (qNum <= 31) partNum = 2;
      else if (qNum <= 70) partNum = 3;
      else if (qNum <= 100) partNum = 4;
      else if (qNum <= 130) partNum = 5;
      else if (qNum <= 146) partNum = 6;
      const roleLabel = isAns ? '★ Đáp án đúng' : (isOpt ? '◆ Phương án P5/6' : `P${partNum}`);
      return {
        year,
        testId: tId,
        qNum,
        partNum,
        isAns,
        isOpt,
        label: `ETS ${year} • T${tId} • Q${qNum}`,
        roleLabel,
        href: `result.html?book=${year}&test=${tId}&show=review&q=${qNum}`
      };
    }

    function toggleTheme() {
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleTheme === 'function') {
        storage.toggleTheme();
      }
    }

    function speakEnglishWord(text, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
        return false;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(String(text || ''));
        utter.lang = 'en-US';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
        return true;
      } catch (_) {
        return false;
      }
    }

    function computeBandStats(bandId) {
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function'
        ? storage.getStudyProgress()
        : { vocabStatus: {}, vocabStarred: {} };
      const idx = getDictIndex();
      const pool = (!bandId || bandId === 'all')
        ? idx.entries
        : idx.entries.filter(e => String(e.band) === String(bandId));

      let totalWords = pool.length;
      let masteredCount = 0;
      let learningCount = 0;
      let starredCount = 0;

      pool.forEach(e => {
        const st = prog.vocabStatus && prog.vocabStatus[e.id];
        if (st === 'mastered') masteredCount++;
        else if (st === 'learning') learningCount++;
        if (prog.vocabStarred && prog.vocabStarred[e.id]) starredCount++;
      });

      const pct = totalWords > 0 ? Math.round((masteredCount / totalWords) * 100) : 0;
      return { totalWords, masteredCount, learningCount, starredCount, pct };
    }

    function selectBand(bandId) {
      const validBands = ['all', '450', '550', '650', '750', '850'];
      const clean = String(bandId || '450').replace('+', '').trim().toLowerCase();
      currentBand = validBands.includes(clean) ? clean : '450';
      if (currentBand !== 'all') {
        const storage = getSafeStorage();
        if (storage && typeof storage.setStudyBand === 'function') {
          storage.setStudyBand(currentBand);
        }
      }
      currentPack = 1;
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      flashcardShuffledOrder = null;
      quizP5Page = 1;
      sessionJustAnswered.clear();
      renderAll();
      return currentBand;
    }

    function setDictBandFilter(band) {
      return selectBand(band);
    }

    function switchVocabMode(mode) {
      // 'list' gracefully redirects to 'dict' since 40-Test Dictionary replaces the redundant Word List
      const normalized = mode === 'list' ? 'dict' : mode;
      const validModes = ['dict', 'flashcard', 'quiz'];
      currentMode = validModes.includes(normalized) ? normalized : 'dict';
      validModes.forEach(m => {
        const btn = typeof document !== 'undefined' ? document.getElementById(`vmode-${m}`) : null;
        if (btn) {
          if (btn.classList) btn.classList.toggle('active', m === currentMode);
          if (typeof btn.setAttribute === 'function') btn.setAttribute('aria-pressed', m === currentMode ? 'true' : 'false');
        }
      });
      isFlashcardFlipped = false;
      sessionJustAnswered.clear();
      renderAll();
      return currentMode;
    }

    function getFilteredDictionaryEntries(ignoreSearch = false) {
      const idx = getDictIndex();
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function'
        ? storage.getStudyProgress()
        : { vocabStatus: {}, vocabStarred: {} };
      const q = ignoreSearch ? '' : (dictSearchQuery || '').trim().toLowerCase();
      const directResolved = q ? resolveDictEntry(q) : null;

      let list = idx.entries.filter(e => {
        if (currentBand !== 'all' && String(e.band) !== String(currentBand)) return false;

        if (vocabPosFilter === 'unlearned') {
          const st = prog.vocabStatus && prog.vocabStatus[e.id];
          if (st === 'mastered' && !sessionJustAnswered.has(e.id)) return false;
        } else if (vocabPosFilter === 'starred') {
          if (!(prog.vocabStarred && prog.vocabStarred[e.id])) return false;
        } else if (vocabPosFilter === 'fam') {
          if (!e.fam || e.fam.length < 2) return false;
        } else if (vocabPosFilter === 'ans') {
          if (!e.p56Ans || e.p56Ans < 1) return false;
        } else if (vocabPosFilter !== 'all') {
          const posTokens = String(e.pos || '').toLowerCase().split(/[\s/]+/);
          if (!posTokens.includes(vocabPosFilter)) return false;
        }

        if (q) {
          if (directResolved && e.id === directResolved.id) return true;
          const inWord = e.w.toLowerCase().includes(q);
          const inMeaning = String(e.m || '').toLowerCase().includes(q);
          const inFam = (e.fam || []).some(f => f.w.toLowerCase() === q);
          if (!inWord && !inMeaning && !inFam) return false;
        }
        return true;
      });

      if (dictSortBy === 'ans') {
        list = list.slice().sort((a, b) => b.p56Ans - a.p56Ans || b.tot - a.tot);
      } else if (dictSortBy === 'az') {
        list = list.slice().sort((a, b) => a.w.localeCompare(b.w));
      } else if (q && directResolved) {
        list = list.slice().sort((a, b) => (a.id === directResolved.id ? -1 : (b.id === directResolved.id ? 1 : 0)));
      }
      return list;
    }

    function getCurrentPackSlice(entries) {
      const totalPacks = Math.max(1, Math.ceil(entries.length / PACK_SIZE));
      if (currentPack < 1) currentPack = 1;
      if (currentPack > totalPacks) currentPack = totalPacks;
      const startIdx = (currentPack - 1) * PACK_SIZE;
      const items = entries.slice(startIdx, startIdx + PACK_SIZE);
      return { totalPacks, startIdx, items };
    }

    function selectVocabPack(packNum) {
      currentPack = Math.max(1, Number(packNum) || 1);
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      flashcardShuffledOrder = null;
      sessionJustAnswered.clear();
      renderWorkspace();
      return currentPack;
    }

    function stepDictPage(delta) {
      return selectVocabPack(currentPack + (Number(delta) || 0));
    }

    function openPackInMode(packNum, targetMode) {
      currentPack = Math.max(1, Number(packNum) || 1);
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      flashcardShuffledOrder = null;
      if (targetMode === 'quiz') quizSourceMode = 'dict';
      switchVocabMode(targetMode);
      if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function handleDictSearch(val) {
      dictSearchQuery = String(val || '');
      currentPack = 1;
      renderWorkspace();
    }

    function setDictPosFilter(pos) {
      vocabPosFilter = pos || 'all';
      currentPack = 1;
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      flashcardShuffledOrder = null;
      sessionJustAnswered.clear();
      renderWorkspace();
      return vocabPosFilter;
    }

    function setDictSortBy(sortVal) {
      dictSortBy = sortVal || 'freq';
      currentPack = 1;
      flashcardIndex = 0;
      flashcardShuffledOrder = null;
      renderWorkspace();
    }

    function renderFilterPillsRow() {
      const filters = [
        { k: 'all', lbl: 'Tất cả' },
        { k: 'unlearned', lbl: '⏳ Chưa thuộc' },
        { k: 'starred', lbl: '⭐ Đã lưu' },
        { k: 'fam', lbl: '🌳 Gia đình từ' },
        { k: 'ans', lbl: '🎯 Đáp án P5/6' },
        { k: 'n', lbl: 'Danh từ' },
        { k: 'v', lbl: 'Động từ' },
        { k: 'adj', lbl: 'Tính từ' },
        { k: 'adv', lbl: 'Trạng từ' },
        { k: 'phr', lbl: 'Cụm từ' }
      ];
      return `
        <div class="swipe-pills-row" role="group" aria-label="Bộ lọc từ vựng">
          ${filters.map(p => `
            <button type="button" class="mini-filter-chip ${vocabPosFilter === p.k ? 'active' : ''}" onclick="setDictPosFilter('${p.k}')">${p.lbl}</button>
          `).join('')}
        </div>
      `;
    }

    function renderPackOptionsHtml(entries, prog) {
      const totalPacks = Math.max(1, Math.ceil(entries.length / PACK_SIZE));
      const opts = [];
      for (let p = 1; p <= totalPacks; p++) {
        const s = (p - 1) * PACK_SIZE;
        const e = Math.min(entries.length, s + PACK_SIZE);
        const slice = entries.slice(s, e);
        let mastered = 0;
        slice.forEach(w => {
          if (prog.vocabStatus && prog.vocabStatus[w.id] === 'mastered') mastered++;
        });
        opts.push(`<option value="${p}" ${p === currentPack ? 'selected' : ''}>📦 Bộ ${p}/${totalPacks} (Từ ${s + 1}–${e}) • Thuộc ${mastered}/${slice.length}</option>`);
      }
      return opts.join('');
    }

    function renderBandSelector() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-band-selector') : null;
      if (!wrap) return;
      const data = getStudyData();
      const bands = data.bands || [];
      const allStats = computeBandStats('all');

      wrap.innerHTML = [
        `<button type="button" class="band-chip-btn ${currentBand === 'all' ? 'active' : ''}" data-band="all" onclick="selectBand('all')" aria-pressed="${currentBand === 'all' ? 'true' : 'false'}">
          <span class="band-chip-label">Tất cả</span>
          <span class="band-chip-sub">${allStats.masteredCount}/${allStats.totalWords}</span>
        </button>`,
        ...bands.map(b => {
          const st = computeBandStats(b.id);
          const isAct = String(currentBand) === String(b.id);
          return `
            <button type="button" class="band-chip-btn ${isAct ? 'active' : ''}" data-band="${b.id}" onclick="selectBand('${b.id}')" aria-pressed="${isAct ? 'true' : 'false'}">
              <span class="band-chip-label">${b.label}</span>
              <span class="band-chip-sub">${st.masteredCount}/${st.totalWords}</span>
            </button>
          `;
        })
      ].join('');
    }

    function renderBandOverview() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-band-overview') : null;
      if (!wrap) return;
      const stats = computeBandStats(currentBand);
      const bandTitle = currentBand === 'all' ? 'Kho 40 Đề ETS' : `Mốc ${currentBand}+`;

      wrap.innerHTML = `
        <div class="slim-progress-left">
          <strong>${bandTitle}:</strong>
          <div class="slim-bar-track" role="progressbar" aria-valuenow="${stats.pct}" aria-valuemin="0" aria-valuemax="100">
            <div class="slim-bar-fill" style="width:${stats.pct}%;"></div>
          </div>
          <span>Đã thuộc <strong>${stats.masteredCount}/${stats.totalWords}</strong> từ (${stats.pct}%) • ⭐ ${stats.starredCount}</span>
        </div>
        <div class="slim-actions-right">

    function shuffleFlashcards() {
      const filtered = getFilteredDictionaryEntries(true);
      const { items } = getCurrentPackSlice(filtered);
      const indices = items.map((_, i) => i);
      for (let i = indices.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = indices[i];
        indices[i] = indices[j];
        indices[j] = tmp;
      }
      flashcardShuffledOrder = indices;
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      renderWorkspace();
    }

    // ── MODE 3: QUIZ ETS (100% of 4,153 Dictionary Words by Pack + 386 Official Part 5 Vocab Qs) ──
    function hashStringDeterministic(str) {
      let h = 2166136261 >>> 0;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 16777619) >>> 0;
      }
      return h >>> 0;
    }

    function buildDictQuizQuestionForEntry(entry, allEntries) {
      const idx = getDictIndex();
      const officialQ = idx.officialByWord.get(entry.w.toLowerCase());
      if (officialQ) {
        return {
          id: `dq_${entry.id}`,
          dictId: entry.id,
          word: entry.w,
          isMeaningMode: false,
          source: officialQ.source,
          reviewHref: `result.html?book=20${officialQ.bookShort}&test=${officialQ.testId}&show=review&q=${officialQ.questionNumber}`,
          questionText: officialQ.questionText,
          options: officialQ.options,
          correctAnswer: officialQ.correctAnswer,
          questionTranslation: officialQ.questionTranslation,
          explanation: officialQ.explanation
        };
      }

      const seed = hashStringDeterministic(entry.id);
      const primaryPos = String(entry.pos || 'n').split(/[\s/]+/)[0].toLowerCase();
      const posBucket = idx.byPos.get(primaryPos) || [];
      const customPool = Array.isArray(allEntries) && allEntries.length >= 15 && allEntries.length < idx.entries.length
        ? allEntries.filter(cand => cand.id !== entry.id && cand.root !== entry.root && String(cand.pos || '').toLowerCase().includes(primaryPos))
        : [];
      const fallbackPool = customPool.length >= 10
        ? customPool
        : (posBucket.length >= 10 ? posBucket : idx.entries);

      const distractors = [];
      let step = (seed % 97) + 7;
      let cursor = seed % Math.max(1, fallbackPool.length);
      let guard = 0;
      while (distractors.length < 3 && guard < fallbackPool.length + 10) {
        guard++;
        const cand = fallbackPool[cursor % fallbackPool.length];
        cursor += step;
        if (cand && cand.id !== entry.id && (!entry.root || cand.root !== entry.root) && !distractors.some(d => d.id === cand.id) && cand.m !== entry.m) {
          distractors.push(cand);
        }
      }

      const firstQMap = entry.qMap && entry.qMap[0] ? decodeQMapCode(entry.qMap[0]) : null;
      const sampleEx = entry.ex && entry.ex[0] ? entry.ex[0] : null;
      const escapedW = entry.w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const wordRegex = !entry.w.includes(' ')
        ? new RegExp(`\\b(${escapedW}(?:s|es|ed|d|ing|ies|ied)?)\\b`, 'i')
        : new RegExp(`(${escapedW})`, 'i');

      const letters = ['A', 'B', 'C', 'D'];
      const correctPosIdx = seed % 4;
      const correctLetter = letters[correctPosIdx];

      if (sampleEx && sampleEx.en && wordRegex.test(sampleEx.en)) {
        const blankedSentence = sampleEx.en.replace(wordRegex, '-------');
        const orderedItems = [];
        let dIdx = 0;
        for (let i = 0; i < 4; i++) {
          orderedItems.push(i === correctPosIdx ? entry.w : (distractors[dIdx++] ? distractors[dIdx - 1].w : 'option'));
        }
        const exDecoded = sampleEx.c ? decodeQMapCode(sampleEx.c) : firstQMap;
        return {
          id: `dq_${entry.id}`,
          dictId: entry.id,
          word: entry.w,
          isMeaningMode: false,
          source: sampleEx.q || (firstQMap ? firstQMap.label : `Kho 40 đề ETS (${entry.band}+)`),
          reviewHref: exDecoded ? exDecoded.href : '',
          questionText: blankedSentence,
          options: { A: orderedItems[0], B: orderedItems[1], C: orderedItems[2], D: orderedItems[3] },
          correctAnswer: correctLetter,
          questionTranslation: sampleEx.vi || '',
          explanation: `<strong>${entry.w}</strong> (${entry.pos}): ${entry.m}.${entry.tip ? ' 💡 ' + entry.tip : ''}`
        };
      }

      // Clean Meaning Quiz when exact blank sentence isn't available
      const orderedMeanings = [];
      let dIdx = 0;
      for (let i = 0; i < 4; i++) {
        orderedMeanings.push(i === correctPosIdx ? entry.m : (distractors[dIdx++] ? distractors[dIdx - 1].m : 'khác'));
      }
      return {
        id: `dq_${entry.id}`,
        dictId: entry.id,
        word: entry.w,
        isMeaningMode: true,
        source: firstQMap ? `${firstQMap.label} • Gặp ${entry.tot} lần` : `Kho 40 đề ETS (${entry.band}+)`,
        reviewHref: firstQMap ? firstQMap.href : '',
        questionText: `Trong đề thi TOEIC, từ vựng "${entry.w}" (${entry.pos}) mang nghĩa nào sau đây?`,
        options: { A: orderedMeanings[0], B: orderedMeanings[1], C: orderedMeanings[2], D: orderedMeanings[3] },
        correctAnswer: correctLetter,
        questionTranslation: entry.colloc && entry.colloc.length ? `Cụm từ thường gặp: ${entry.colloc.join(' • ')}` : '',
        explanation: `<strong>${entry.w}</strong> (${entry.pos}): ${entry.m}.${entry.tip ? ' 💡 ' + entry.tip : ''}`
      };
    }

    function setQuizSourceMode(srcMode) {
      quizSourceMode = srcMode === 'part5' ? 'part5' : 'dict';
      quizP5Page = 1;
      sessionJustAnswered.clear();
      renderWorkspace();
      return quizSourceMode;
    }

    function setQuizP5Filter(flt) {
      quizP5Filter = ['all', 'unanswered', 'wrong'].includes(flt) ? flt : 'all';
      quizP5Page = 1;
      sessionJustAnswered.clear();
      renderWorkspace();
      return quizP5Filter;
    }

    function stepQuizP5Page(delta) {
      quizP5Page = Math.max(1, quizP5Page + (Number(delta) || 0));
      sessionJustAnswered.clear();
      renderWorkspace();
      if (typeof window !== 'undefined' && typeof window.scrollTo === 'function') {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      return quizP5Page;
    }

    function renderQuizMode() {
      const data = getStudyData();
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function'
        ? storage.getStudyProgress()
        : { vocabStatus: {}, vocabStarred: {} };

      const allOfficialP5 = (data.officialVocabPart5 || []).filter(
        q => currentBand === 'all' || String(q.band) === String(currentBand)
      );
      const filteredDictEntries = getFilteredDictionaryEntries(true);

      const modeSwitchHtml = `
        <div class="dict-toolbar">
          <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">

            </button>
          </div>
          ${quizSourceMode === 'dict' ? renderFilterPillsRow() : ''}
        </div>
      `;

      let questionsToRender = [];
      let totalQuestionsInSet = 0;
      let answeredCount = 0;
      let correctCount = 0;
      let extraBarHtml = '';
      let pagerHtml = '';

      if (quizSourceMode === 'dict') {
        if (filteredDictEntries.length === 0) {
          return `${modeSwitchHtml}<p style="text-align:center;color:var(--text-muted);padding:24px 0;">Không có từ vựng nào trong bộ lọc này.</p>`;
        }
        const { items: packEntries } = getCurrentPackSlice(filteredDictEntries);
        const packQuestions = packEntries.map(e => buildDictQuizQuestionForEntry(e, filteredDictEntries));
        totalQuestionsInSet = packQuestions.length;
        packQuestions.forEach(q => {
          const u = quizUserAnswers[q.id];
          if (u) {
            answeredCount++;
            if (u === q.correctAnswer) correctCount++;
          }
        });
        questionsToRender = packQuestions;
        extraBarHtml = `
          <div class="pack-bar-row">
            <select class="pack-select-box" style="flex:1 1 220px;" aria-label="Chọn bộ Quiz từ điển" onchange="selectVocabPack(this.value)">
              ${renderPackOptionsHtml(filteredDictEntries, prog)}
            </select>
            <div style="display:flex;gap:8px;align-items:center;">
              <span>Đúng <strong style="color:var(--success);">${correctCount}/${totalQuestionsInSet}</strong></span>
              <button type="button" class="slim-link-btn" onclick="openPackInMode(${currentPack}, 'flashcard')">🃏 Xem Flashcard</button>
              <button type="button" class="slim-link-btn" onclick="resetVocabQuiz()">🔄 Làm lại</button>
            </div>
          </div>
        `;
      } else {
        totalQuestionsInSet = allOfficialP5.length;
        let wrongCount = 0;
        allOfficialP5.forEach(q => {
          const u = quizUserAnswers[q.id];
          if (u) {
            answeredCount++;
            if (u === q.correctAnswer) correctCount++;
            else wrongCount++;
          }
        });
        const unansweredCount = Math.max(0, totalQuestionsInSet - answeredCount);
        const filteredP5 = allOfficialP5.filter(q => {
          const u = quizUserAnswers[q.id];
          if (quizP5Filter === 'unanswered') return !u || sessionJustAnswered.has(q.id);
          if (quizP5Filter === 'wrong') return (Boolean(u) && u !== q.correctAnswer) || (sessionJustAnswered.has(q.id) && Boolean(u));
          return true;
        });

        const totalPages = Math.max(1, Math.ceil(filteredP5.length / QUIZ_P5_PAGE_SIZE));
        if (quizP5Page > totalPages) quizP5Page = totalPages;
        const startIdx = (quizP5Page - 1) * QUIZ_P5_PAGE_SIZE;
        questionsToRender = filteredP5.slice(startIdx, startIdx + QUIZ_P5_PAGE_SIZE).map(q => ({
          ...q,
          dictId: (resolveDictEntry(q.targetWord) || {}).id || '',
          word: q.targetWord || '',
          reviewHref: `result.html?book=20${q.bookShort}&test=${q.testId}&show=review&q=${q.questionNumber}`
        }));

        extraBarHtml = `
          <div class="pack-bar-row">
            <div style="display:flex;gap:6px;flex-wrap:wrap;">
              <button type="button" class="mini-filter-chip ${quizP5Filter === 'all' ? 'active' : ''}" onclick="setQuizP5Filter('all')">Tất cả (${totalQuestionsInSet})</button>
              <button type="button" class="mini-filter-chip ${quizP5Filter === 'unanswered' ? 'active' : ''}" onclick="setQuizP5Filter('unanswered')">Chưa làm (${unansweredCount})</button>
              <button type="button" class="mini-filter-chip ${quizP5Filter === 'wrong' ? 'active' : ''}" onclick="setQuizP5Filter('wrong')">Làm sai (${wrongCount})</button>
            </div>
            <div style="display:flex;gap:8px;align-items:center;">
              <span>Đúng <strong style="color:var(--success);">${correctCount}/${totalQuestionsInSet}</strong></span>
              <button type="button" class="slim-link-btn" onclick="resetVocabQuiz()">🔄 Làm lại</button>
            </div>
          </div>
        `;

        if (totalPages > 1) {
          pagerHtml = `
            <div class="dict-pager-bar">
              <button type="button" class="btn btn-secondary btn-sm" onclick="stepQuizP5Page(-1)" ${quizP5Page <= 1 ? 'disabled' : ''}>◀ Trang trước</button>
              <span>Trang <strong>${quizP5Page}/${totalPages}</strong> (${filteredP5.length} câu Part 5)</span>
              <button type="button" class="btn btn-secondary btn-sm" onclick="stepQuizP5Page(1)" ${quizP5Page >= totalPages ? 'disabled' : ''}>Trang sau ▶</button>
            </div>
          `;
        }
      }

      const letters = ['A', 'B', 'C', 'D'];

      return `
        ${modeSwitchHtml}
        <div class="quiz-wrap">
          ${extraBarHtml}
          ${pagerHtml}

          ${questionsToRender.length === 0 ? `
            <p style="text-align:center;color:var(--text-muted);padding:24px 0;">Không có câu hỏi nào khớp với bộ lọc hiện tại.</p>
          ` : questionsToRender.map((q, idx) => {
            const userChoice = quizUserAnswers[q.id] || null;
            const safeDictKey = (q.dictId || q.word || '').replace(/'/g, "\\'");
            return `
              <div class="quiz-item-card">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:0.74rem;color:var(--text-muted);flex-wrap:wrap;">
                  <strong>Câu ${idx + 1}/${questionsToRender.length}</strong>
                  <span style="display:inline-flex;align-items:center;gap:8px;">
                    <span>${q.source}</span>
                    ${q.reviewHref ? `<a href="${q.reviewHref}" class="slim-link-btn" style="text-decoration:none;padding:2px 7px;font-size:0.7rem;">🔗 Mở đề gốc</a>` : ''}
                  </span>
                </div>
                <div class="quiz-q-text">${q.questionText}</div>
                <div class="quiz-opts-grid ${q.isMeaningMode ? 'is-meaning-opts' : ''}">
                  ${letters.map(letter => {
                    const optText = q.options && q.options[letter] ? q.options[letter] : '';
                    let cls = 'quiz-opt-btn';
                    if (userChoice) {
                      if (letter === q.correctAnswer) cls += ' is-correct';
                      else if (letter === userChoice) cls += ' is-wrong';
                    }
                    return `
                      <button type="button" class="${cls}" onclick="answerVocabQuiz('${q.id}', '${letter}', '${safeDictKey}')">
                        <span class="ans-key">${letter}</span>
                        <span>${optText}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
                ${userChoice ? `
                  <div class="quiz-explain-box">
                    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px;">
                      <span style="font-weight:700;color:${userChoice === q.correctAnswer ? 'var(--success)' : 'var(--danger)'};">
                        ${userChoice === q.correctAnswer ? '✓ Chính xác!' : `✕ Đáp án đúng: (${q.correctAnswer}) ${q.options[q.correctAnswer] || ''}`}
                      </span>
                      ${safeDictKey ? `<button type="button" class="slim-link-btn" onclick="openDictWordModal('${safeDictKey}', event)">🔍 Xem Gia đình từ &amp; Map 40 đề</button>` : ''}
                    </div>
                    ${q.questionTranslation ? `<div><strong>Dịch / Cụm từ:</strong> ${q.questionTranslation}</div>` : ''}
                    ${q.explanation ? `<div style="color:var(--text-secondary);margin-top:2px;">${q.explanation}</div>` : ''}
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}

          ${pagerHtml}
        </div>
      `;
    }

    // ── WORD DETAIL MODAL (40-Test Frequency + Word Family + Question Map) ──
    function openDictWordModal(wordOrId, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      const entry = resolveDictEntry(wordOrId);
      const modal = typeof document !== 'undefined' ? document.getElementById('dict-word-modal') : null;
      const body = typeof document !== 'undefined' ? document.getElementById('dict-word-modal-body') : null;
      if (!entry || !modal || !body) return null;

      activeDictWordKey = entry.id;
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function'
        ? storage.getStudyProgress()
        : { vocabStatus: {}, vocabStarred: {} };
      const st = (prog.vocabStatus && prog.vocabStatus[entry.id]) || 'unseen';
      const starred = Boolean(prog.vocabStarred && prog.vocabStarred[entry.id]);
      const safeWordEsc = entry.w.replace(/'/g, "\\'");
      const decodedQMap = (entry.qMap || []).map(decodeQMapCode);

      body.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;">
              <h2 style="margin:0;font-size:1.55rem;font-weight:800;color:var(--text-primary);">${entry.w}</h2>
              <span class="pos-tag">${entry.pos}</span>
              ${entry.ipa ? `<span class="vc-ipa" style="font-size:0.88rem;">${entry.ipa}</span>` : ''}
              <span class="dict-mini-badge">Mục tiêu ${entry.band}+</span>
            </div>
            <div style="font-size:1.05rem;font-weight:800;color:var(--success);margin-top:4px;">${entry.m}</div>
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
            <button type="button" class="icon-pill-btn" onclick="speakEnglishWord('${safeWordEsc}', event)">🔊 Phát âm</button>
            <button type="button" class="icon-pill-btn ${starred ? 'starred' : ''}" onclick="handleToggleStar('${entry.id}', event); openDictWordModal('${entry.id}')">${starred ? '⭐ Đã lưu' : '☆ Lưu từ'}</button>
            <button type="button" class="vc-icon-btn ${st === 'mastered' ? 'active-mastered' : ''}" onclick="setWordStatus('${entry.id}', 'mastered'); openDictWordModal('${entry.id}')">✓ Đã thuộc</button>
            <button type="button" class="icon-pill-btn" onclick="closeDictWordModal()" aria-label="Đóng cửa sổ">✕</button>
          </div>
        </div>

        <div class="dict-freq-grid">
          <div class="dict-freq-box">
            <div class="dict-freq-num" style="color:var(--accent-secondary);">${entry.tot}</div>
            <div class="dict-freq-lbl">Tổng lần gặp / 40 đề</div>
          </div>
          <div class="dict-freq-box">
            <div class="dict-freq-num">${entry.parts.lc}</div>
            <div class="dict-freq-lbl">Nghe (Part 1–4)</div>
          </div>
          <div class="dict-freq-box">
            <div class="dict-freq-num" style="color:var(--success);">${entry.parts.p56}</div>
            <div class="dict-freq-lbl">Part 5–6 (${entry.p56Opt} chọn • ${entry.p56Ans} đúng)</div>
          </div>
          <div class="dict-freq-box">
            <div class="dict-freq-num">${entry.parts.p7}</div>
            <div class="dict-freq-lbl">Đọc hiểu (Part 7)</div>
          </div>
        </div>

        ${entry.fam && entry.fam.length >= 2 ? `
          <div class="dict-sec-block">
            <div class="dict-sec-title">🌳 Gia đình từ / Các từ cùng gốc trong 40 đề (${entry.fam.length} từ)</div>
            <div class="dict-fam-list">
              ${entry.fam.map(f => {
                const isSelf = f.w.toLowerCase() === entry.w.toLowerCase();
                const safeF = f.w.replace(/'/g, "\\'");
                return `
                  <button type="button" class="dict-fam-chip ${isSelf ? 'is-self' : ''}" onclick="openDictWordModal('${safeF}', event)">
                    <strong>${f.w}</strong>
                    <span class="pos-tag" style="padding:1px 5px;font-size:0.65rem;">${f.pos}</span>
                    <span style="color:var(--text-secondary);font-size:0.76rem;">${f.m}</span>
                    <span style="color:var(--text-muted);font-size:0.7rem;">(${f.tot})</span>
                  </button>
                `;
              }).join('')}
            </div>
          </div>
        ` : ''}

        ${(entry.colloc && entry.colloc.length > 0) || entry.tip ? `
          <div class="dict-sec-block" style="font-size:0.84rem;line-height:1.5;">
            ${entry.colloc && entry.colloc.length > 0 ? `<div><strong>📌 Cụm từ hay gặp:</strong> ${entry.colloc.join(' • ')}</div>` : ''}
            ${entry.tip ? `<div style="margin-top:4px;color:var(--text-secondary);"><strong>💡 Mẹo thi ETS:</strong> ${entry.tip}</div>` : ''}
          </div>
        ` : ''}

        ${entry.ex && entry.ex.length > 0 ? `
          <div class="dict-sec-block">
            <div class="dict-sec-title">📝 Ngữ cảnh thực tế trích từ Bộ đề ETS</div>
            ${entry.ex.map(s => `
              <div style="font-size:0.83rem;line-height:1.48;margin-bottom:8px;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--border-glass);">
                <div style="font-size:0.72rem;color:var(--accent-secondary);font-weight:700;margin-bottom:2px;">${s.q}</div>
                <div style="font-weight:600;color:var(--text-primary);">"${s.en}"</div>
                <div style="color:var(--text-secondary);margin-top:2px;">→ ${s.vi}</div>
              </div>
            `).join('')}
          </div>
        ` : ''}

        <div class="dict-sec-block">
          <div class="dict-sec-title">🗺️ Map câu hỏi xuất hiện trong 40 Bộ đề ETS (Bấm để mở đề gốc)</div>
          <div class="dict-qmap-list">
            ${decodedQMap.map(item => `
              <a href="${item.href}" class="dict-qmap-chip ${item.isAns ? 'is-ans' : ''}" title="Mở câu hỏi này trên trang giải chi tiết">
                <span>${item.label}</span>
                <span style="opacity:0.85;font-size:0.68rem;">(${item.roleLabel})</span>
              </a>
            `).join('')}
          </div>
        </div>
      `;

      if (modal.classList) modal.classList.add('open');
      if (typeof document !== 'undefined' && document.body && document.body.style) {
        document.body.style.overflow = 'hidden';
      }
      return entry;
    }

    function closeDictWordModal(event) {
      if (event && event.target && event.target.id && event.target.id !== 'dict-word-modal') return;
      activeDictWordKey = '';
      const modal = typeof document !== 'undefined' ? document.getElementById('dict-word-modal') : null;
      if (modal && modal.classList) modal.classList.remove('open');
      if (typeof document !== 'undefined' && document.body && document.body.style) {
        document.body.style.overflow = '';
      }
    }

    function renderWorkspace() {
      const container = typeof document !== 'undefined' ? document.getElementById('vocab-workspace-container') : null;
      if (!container) return;
      if (currentMode === 'flashcard') {
        container.innerHTML = renderFlashcardMode();
      } else if (currentMode === 'quiz') {
        container.innerHTML = renderQuizMode();
      } else {
        container.innerHTML = renderDictionaryMode();
      }
    }

    function renderAll() {
      renderBandSelector();
      renderBandOverview();
      renderWorkspace();
    }

    function flipFlashcard() {
      isFlashcardFlipped = !isFlashcardFlipped;
      renderWorkspace();
    }

    function stepFlashcard(delta) {
      const filtered = getFilteredDictionaryEntries(true);
      const { items } = getCurrentPackSlice(filtered);
      if (items.length === 0) return;
      flashcardIndex = (flashcardIndex + delta + items.length) % items.length;
      isFlashcardFlipped = false;
      renderWorkspace();
    }

    function setWordStatus(wordId, status) {
      const storage = getSafeStorage();
      sessionJustAnswered.add(wordId);
      if (storage && typeof storage.setVocabWordStatus === 'function') {
        storage.setVocabWordStatus(wordId, status);
      }
      renderAll();
    }

    function markWordStatusAndNext(wordId, status) {
      const storage = getSafeStorage();
      sessionJustAnswered.add(wordId);
      if (storage && typeof storage.setVocabWordStatus === 'function') {
        storage.setVocabWordStatus(wordId, status);
      }
      const filtered = getFilteredDictionaryEntries(true);
      const { items } = getCurrentPackSlice(filtered);
      if (items.length > 0) {
        flashcardIndex = (flashcardIndex + 1) % items.length;
      }
      isFlashcardFlipped = false;
      renderAll();
    }

    function handleToggleStar(wordId, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleVocabStar === 'function') {
        storage.toggleVocabStar(wordId);
      }
      renderAll();
    }

    function answerVocabQuiz(questionId, choice, dictKey) {
      quizUserAnswers[questionId] = choice;
      sessionJustAnswered.add(questionId);
      const storage = getSafeStorage();
      if (storage && typeof storage.saveVocabQuizScore === 'function') {
        const packKey = quizSourceMode === 'dict'
          ? `pack_${currentBand}_${vocabPosFilter}_${currentPack}`
          : `ets_p5_vocab_${currentBand}`;
        const answeredKeys = Object.keys(quizUserAnswers);
        storage.saveVocabQuizScore(packKey, answeredKeys.length, Math.max(answeredKeys.length, PACK_SIZE));
      }
      renderWorkspace();
    }

    function resetVocabQuiz() {
      quizUserAnswers = {};
      sessionJustAnswered.clear();
      renderWorkspace();
    }

    function exportStudyBackup() {
      const storage = getSafeStorage();
      if (!storage || typeof storage.exportStudyProgressJSON !== 'function') return null;
      const jsonStr = storage.exportStudyProgressJSON();
      if (typeof document !== 'undefined' && typeof Blob !== 'undefined' && typeof URL !== 'undefined') {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `toeic_study_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
      return jsonStr;
    }

    function triggerImportStudyBackup() {
      const input = typeof document !== 'undefined' ? document.getElementById('study-backup-file-input') : null;
      if (input && typeof input.click === 'function') input.click();
    }

    function handleImportStudyBackup(event) {
      const file = event && event.target && event.target.files && event.target.files[0];
      if (!file || typeof FileReader === 'undefined') return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e && e.target ? e.target.result : '';
        const storage = getSafeStorage();
        if (storage && typeof storage.importStudyProgressJSON === 'function') {
          const res = storage.importStudyProgressJSON(content);
          if (res && res.ok) {
            if (typeof alert === 'function') alert('✅ Khôi phục tiến độ học tập thành công!');
            renderAll();
          } else if (typeof alert === 'function') {
            alert('⚠️ ' + ((res && res.error) || 'File backup không hợp lệ.'));
          }
        }
      };
      reader.readAsText(file);
    }

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('DOMContentLoaded', () => {
        const storage = getSafeStorage();
        if (storage && typeof storage.initTheme === 'function') storage.initTheme();
        let initialBand = '450';
        if (storage && typeof storage.getStudyProgress === 'function') {
          initialBand = storage.getStudyProgress().lastBand || '450';
        }
        let targetWord = '';
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('band')) initialBand = params.get('band');
          if (params.get('mode')) switchVocabMode(params.get('mode'));
          if (params.get('word')) targetWord = params.get('word');
        } catch (_) {}
        selectBand(initialBand);
        if (targetWord) {
          switchVocabMode('dict');
          handleDictSearch(targetWord);
          openDictWordModal(targetWord);
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' && activeDictWordKey) {
          closeDictWordModal();
          return;
        }
        if (currentMode !== 'flashcard' || activeDictWordKey) return;
        const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
        if (e.code === 'Space') {
          e.preventDefault();
          flipFlashcard();
        } else if (e.code === 'ArrowRight') {
          stepFlashcard(1);
        } else if (e.code === 'ArrowLeft') {
          stepFlashcard(-1);
        }
      });
    }

    if (typeof window !== 'undefined') {
      window.selectBand = selectBand;
      window.switchVocabMode = switchVocabMode;
      window.selectVocabPack = selectVocabPack;
      window.openPackInMode = openPackInMode;
      window.flipFlashcard = flipFlashcard;
      window.stepFlashcard = stepFlashcard;
      window.shuffleFlashcards = shuffleFlashcards;
      window.setWordStatus = setWordStatus;
      window.markWordStatusAndNext = markWordStatusAndNext;
      window.handleToggleStar = handleToggleStar;
      window.setQuizSourceMode = setQuizSourceMode;
      window.setQuizP5Filter = setQuizP5Filter;
      window.stepQuizP5Page = stepQuizP5Page;
      window.answerVocabQuiz = answerVocabQuiz;
      window.resetVocabQuiz = resetVocabQuiz;
      window.handleDictSearch = handleDictSearch;
      window.setDictBandFilter = setDictBandFilter;
      window.setDictPosFilter = setDictPosFilter;
      window.setDictSortBy = setDictSortBy;
      window.stepDictPage = stepDictPage;
      window.openDictWordModal = openDictWordModal;
      window.closeDictWordModal = closeDictWordModal;
      window.resolveDictEntry = resolveDictEntry;
      window.decodeQMapCode = decodeQMapCode;
      window.exportStudyBackup = exportStudyBackup;
      window.triggerImportStudyBackup = triggerImportStudyBackup;
      window.handleImportStudyBackup = handleImportStudyBackup;
      window.speakEnglishWord = speakEnglishWord;
      window.toggleTheme = toggleTheme;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        PACK_SIZE,
        selectBand,
        switchVocabMode,
        selectVocabPack,
        openPackInMode,
        flipFlashcard,
        stepFlashcard,
        shuffleFlashcards,
        setWordStatus,
        markWordStatusAndNext,
        handleToggleStar,
        setQuizSourceMode,
        setQuizP5Filter,
        stepQuizP5Page,
        buildDictQuizQuestionForEntry,
        answerVocabQuiz,
        resetVocabQuiz,
        handleDictSearch,
        setDictBandFilter,
        setDictPosFilter,
        setDictSortBy,
        stepDictPage,
        openDictWordModal,
        closeDictWordModal,
        resolveDictEntry,
        decodeQMapCode,
        getFilteredDictionaryEntries,
        exportStudyBackup,
        computeBandStats
      };
    }
  </script>
</body>
</html>
