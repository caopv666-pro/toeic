<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Từ Vựng TOEIC 450+ ➔ 850+ — TOEIC Master</title>
  <meta name="description" content="Học từ vựng TOEIC tinh gọn theo từng mục tiêu điểm 450+, 550+, 650+, 750+, 850+ qua Flashcard, Danh sách từ và Trắc nghiệm ETS.">

  <link rel="stylesheet" href="css/base.css?v=20261024v10">
  <link rel="stylesheet" href="css/layout.css?v=20261024v10">
  <link rel="stylesheet" href="css/components.css?v=20261024v10">
  <link rel="stylesheet" href="css/responsive.css?v=20261024v10">
  <style>
    /* ── Ultra-Minimalist Top Filter & Control Bar (Synced with index.html) ── */
    .study-top-section {
      padding: 16px 0 10px;
      text-align: center;
      max-width: 860px;
      margin: 0 auto;
    }
    .band-chip-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 0 auto 12px;
      max-width: 540px;
    }
    .band-chip-btn {
      flex: 1 1 0;
      padding: 7px 6px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      min-width: 0;
    }
    .band-chip-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .band-chip-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .band-chip-label {
      font-size: 0.84rem;
      font-weight: 800;
      line-height: 1.15;
    }
    .band-chip-sub {
      font-size: 0.66rem;
      font-weight: 600;
      opacity: 0.85;
    }

    /* Topic Pills Row */
    .topic-pills-wrap {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 12px;
    }
    .topic-pill-btn {
      padding: 6px 13px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .topic-pill-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .topic-pill-btn.active {
      background: rgba(99, 102, 241, 0.18);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    .topic-pill-count {
      font-size: 0.7rem;
      padding: 1px 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
    }
    .topic-pill-btn.active .topic-pill-count {
      background: var(--accent-primary);
      color: #ffffff;
    }

    /* Slim Status & Backup Bar */
    .slim-status-strip {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 8px 14px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }
    .slim-progress-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1 1 240px;
      min-width: 0;
    }
    .slim-bar-track {
      flex: 1;
      max-width: 140px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
    .slim-bar-fill {
      height: 100%;
      background: var(--success);
      border-radius: 999px;
      transition: width 0.25s ease;
    }
    .slim-actions-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .slim-link-btn {
      padding: 4px 9px;
      border-radius: var(--radius-sm);
      background: transparent;
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .slim-link-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
      background: rgba(99, 102, 241, 0.1);
    }

    /* ── Minimalist Flashcard ── */
    .fc-container {
      max-width: 580px;
      margin: 0 auto 32px;
    }
    .fc-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .vocab-flashcard {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-xl);
      padding: 24px 24px 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
      user-select: none;
    }
    .vocab-flashcard:hover {
      border-color: var(--accent-primary);
    }
    .vocab-flashcard.is-flipped {
      border-color: var(--accent-secondary);
    }
    .fc-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .pos-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      padding: 2px 8px;
      border-radius: 6px;
      background: rgba(99, 102, 241, 0.14);
      color: #a5b4fc;
    }
    .icon-pill-btn {
      padding: 5px 10px;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .icon-pill-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    .icon-pill-btn.starred {
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.5);
      background: rgba(245, 158, 11, 0.12);
    }
    .fc-body {
      text-align: center;
      padding: 20px 8px;
    }
    .fc-word {
      font-size: 2rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }
    .fc-ipa {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }
    .fc-meaning {
      font-size: 1.35rem;
      font-weight: 800;
      color: var(--success);
      margin-bottom: 12px;
    }
    .fc-example-en {
      font-size: 0.92rem;
      color: var(--text-secondary);
      line-height: 1.5;
      max-width: 480px;
      margin: 0 auto;
    }
    .fc-back-details {
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.84rem;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .fc-hint {
      text-align: center;
      font-size: 0.74rem;
      color: var(--text-muted);
    }
    .fc-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
    }

    /* ── Minimalist Word List Grid (2 Columns like index.html) ── */
    .list-filter-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .search-box-minimal {
      flex: 1 1 220px;
      padding: 7px 12px;
      border-radius: var(--radius-md);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.84rem;
    }
    .filter-chips-group {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .mini-filter-chip {
      padding: 5px 10px;
      border-radius: var(--radius-full);
      font-size: 0.76rem;
      font-weight: 600;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
    }
    .mini-filter-chip.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }

    .vocab-compact-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 40px;
    }
    .vocab-compact-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: border-color 0.15s ease;
    }
    .vocab-compact-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .vocab-compact-card.is-mastered {
      border-left: 3px solid var(--success);
    }
    .vocab-compact-card.is-learning {
      border-left: 3px solid var(--warning);
    }
    .vc-row-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }
    .vc-word-group {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      min-width: 0;
    }
    .vc-word {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--text-primary);
    }
    .vc-ipa {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-family: var(--font-mono);
    }
    .vc-actions {
      display: flex;
      align-items: center;
      gap: 4px;
      flex-shrink: 0;
    }
    .vc-icon-btn {
      padding: 3px 7px;
      border-radius: 6px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      font-size: 0.74rem;
      font-weight: 600;
      cursor: pointer;
    }
    .vc-icon-btn:hover {
      color: var(--text-primary);
      border-color: var(--accent-primary);
    }
    .vc-icon-btn.active-mastered {
      background: rgba(16, 185, 129, 0.16);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.4);
    }
    .vc-icon-btn.active-learning {
      background: rgba(245, 158, 11, 0.16);
      color: #fbbf24;
      border-color: rgba(245, 158, 11, 0.4);
    }
    .vc-meaning {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--success);
    }
    .vc-sub-note {
      font-size: 0.78rem;
      color: var(--text-secondary);
      line-height: 1.4;
    }
    .vc-example-line {
      font-size: 0.78rem;
      color: var(--text-muted);
      padding-top: 5px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      line-height: 1.4;
    }

    /* ── Minimalist Quiz View ── */
    .quiz-wrap {
      max-width: 720px;
      margin: 0 auto 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .quiz-item-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 16px;
    }
    .quiz-q-text {
      font-size: 0.96rem;
      font-weight: 700;
      line-height: 1.5;
      margin: 6px 0 12px;
    }
    .quiz-opts-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .quiz-opt-btn {
      text-align: left;
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-primary);
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .quiz-opt-btn:hover {
      border-color: var(--accent-primary);
    }
    .quiz-opt-btn.is-correct {
      background: rgba(16, 185, 129, 0.18);
      border-color: var(--success);
      color: var(--success);
    }
    .quiz-opt-btn.is-wrong {
      background: rgba(239, 68, 68, 0.18);
      border-color: var(--danger);
      color: var(--danger);
    }
    .quiz-explain-box {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      background: rgba(99, 102, 241, 0.08);
      border-left: 3px solid var(--accent-primary);
      font-size: 0.82rem;
      line-height: 1.45;
    }

    @media (max-width: 640px) {
      .vocab-compact-grid,
      .quiz-opts-grid {
        grid-template-columns: 1fr;
      }
      .band-chip-label {
        font-size: 0.78rem;
      }
    }

    [data-theme="light"] .band-chip-btn,
    [data-theme="light"] .topic-pill-btn,
    [data-theme="light"] .slim-status-strip,
    [data-theme="light"] .vocab-flashcard,
    [data-theme="light"] .vocab-compact-card,
    [data-theme="light"] .quiz-item-card,
    [data-theme="light"] .search-box-minimal,
    [data-theme="light"] .mini-filter-chip,
    [data-theme="light"] .quiz-opt-btn,
    [data-theme="light"] .vc-icon-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #1e293b;
    }
    [data-theme="light"] .band-chip-btn.active,
    [data-theme="light"] .mini-filter-chip.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    [data-theme="light"] .topic-pill-btn.active {
      background: #eef2ff;
      color: #312e81;
      border-color: #6366f1;
    }
    [data-theme="light"] .fc-back-details {
      background: #f8fafc;
      border-color: #e2e8f0;
    }
    [data-theme="light"] .vc-example-line {
      border-top-color: #f1f5f9;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="app-navbar">
    <div class="nav-brand">
      <a href="index.html" style="color: inherit; display: flex; align-items: center; gap: 8px; text-decoration: none;">
        <span>🎯 TOEIC Master</span>
      </a>
      <span class="brand-badge">Từ Vựng</span>
    </div>
    <div class="nav-links">
      <div class="header-ctrl-dropdown" id="header-zoom-ctrl">
        <button type="button" class="nav-icon-ctrl-btn" id="zoom-menu-btn" onclick="StorageService.toggleHeaderPopover('zoom-popover-menu', event)" aria-label="Điều chỉnh cỡ chữ và thu phóng toàn trang" title="Chỉnh cỡ chữ / Thu phóng toàn trang">
          <span>🔤</span>
          <span id="zoom-level-label">100%</span>
        </button>
        <div class="header-ctrl-popover" id="zoom-popover-menu" style="display: none;" onclick="event.stopPropagation()">
          <div class="popover-ctrl-title">🔤 Cỡ chữ / Zoom toàn trang</div>
          <div class="zoom-stepper-row">
            <button type="button" class="zoom-step-btn" onclick="StorageService.stepPageZoom(-10)" title="Thu nhỏ (-10%)" aria-label="Thu nhỏ 10%">➖</button>
            <span class="zoom-current-val" id="zoom-popover-val">100%</span>
            <button type="button" class="zoom-step-btn" onclick="StorageService.stepPageZoom(10)" title="Phóng to (+10%)" aria-label="Phóng to 10%">➕</button>
          </div>
          <div class="ctrl-preset-grid">
            <button type="button" class="zoom-preset-btn" data-zoom="85" onclick="StorageService.setPageZoom(85)">85%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="90" onclick="StorageService.setPageZoom(90)">90%</button>
            <button type="button" class="zoom-preset-btn active" data-zoom="100" onclick="StorageService.setPageZoom(100)">100%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="110" onclick="StorageService.setPageZoom(110)">110%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="120" onclick="StorageService.setPageZoom(120)">120%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="130" onclick="StorageService.setPageZoom(130)">130%</button>
          </div>
        </div>
      </div>

      <button class="fullscreen-toggle-btn" id="fullscreen-btn" type="button" onclick="StorageService.toggleFullscreen()" aria-label="Bật chế độ toàn màn hình" aria-pressed="false" title="Bật / Tắt chế độ toàn màn hình">
        <svg class="fs-icon-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>

      </button>

      <div class="header-ctrl-dropdown" id="header-main-menu-ctrl">
        <button type="button" class="nav-menu-trigger-btn" id="main-menu-btn" onclick="StorageService.toggleHeaderPopover('main-menu-popover', event)" aria-label="Mở menu điều hướng và cài đặt" title="Menu chức năng">
          <span aria-hidden="true">☰</span>
        </button>
        <div class="header-ctrl-popover main-menu-popover" id="main-menu-popover" style="display: none;" onclick="event.stopPropagation()">
          <div class="popover-ctrl-title">🧭 Menu Học Tập &amp; Cài Đặt</div>
          <div class="main-menu-list">
            <a href="index.html" class="main-menu-item">
              <span class="main-menu-item-left"><span>📝</span><span>Luyện đề ETS</span></span>
            </a>
            <a href="vocab.html" class="main-menu-item active">
              <span class="main-menu-item-left"><span>📚</span><span>Học Từ Vựng</span></span>
              <span class="main-menu-badge">450+ ➔ 850+</span>
            </a>
            <a href="grammar.html" class="main-menu-item">
              <span class="main-menu-item-left"><span>📐</span><span>Học Ngữ Pháp</span></span>
              <span class="main-menu-badge">450+ ➔ 850+</span>
            </a>
            <a href="history.html" class="main-menu-item nav-link-btn">
              <span class="main-menu-item-left"><span>📊</span><span>Lịch sử thi</span></span>
            </a>

              <span class="main-menu-theme-label"><span>🎨</span><span>Giao diện Sáng / Tối</span></span>
              <button class="theme-toggle-btn" id="theme-btn" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng / Tối">
                🌓
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    <section class="study-top-section">
      <!-- 1. Compact Band Selector Row (450+ .. 850+) -->
      <div class="band-chip-row" id="vocab-band-selector" role="tablist" aria-label="Chọn mục tiêu điểm từ vựng"></div>

      <!-- 2. Mode Selector Tabs (Synced with index.html .mode-tabs) -->
      <div class="mode-tabs" role="tablist" aria-label="Chọn chế độ học từ vựng" style="margin-bottom: 12px;">
        <button type="button" class="mode-tab-btn active" id="vmode-list" onclick="switchVocabMode('list')" aria-pressed="true">
          📋 Danh sách từ
        </button>
        <button type="button" class="mode-tab-btn" id="vmode-flashcard" onclick="switchVocabMode('flashcard')" aria-pressed="false">
          🃏 Flashcard
        </button>
        <button type="button" class="mode-tab-btn" id="vmode-quiz" onclick="switchVocabMode('quiz')" aria-pressed="false">
          🎯 Quiz ETS
        </button>
      </div>

      <!-- 3. Compact Topic Pills -->
      <div class="topic-pills-wrap" id="vocab-topic-tabs" role="group" aria-label="Chọn chủ đề từ vựng"></div>

      <!-- 4. Slim Progress & Backup Strip -->
      <div class="slim-status-strip" id="vocab-band-overview"></div>
      <input type="file" id="study-backup-file-input" accept=".json,application/json" style="display: none;" onchange="handleImportStudyBackup(event)">
    </section>

    <!-- Active Workspace -->
    <section id="vocab-workspace-container" aria-live="polite"></section>
  </main>

  <script src="js/app-config.js?v=20261024v10"></script>
  <script src="js/storage-service.js?v=20261024v10"></script>
  <script src="js/study-data.js?v=20261024v10"></script>
  <script>
    let currentBand = '450';
    let currentTopicId = '';
    let currentMode = 'list'; // Default to clean scannable list; 'list' | 'flashcard' | 'quiz'
    let flashcardIndex = 0;
    let isFlashcardFlipped = false;
    let listSearchQuery = '';
    let listStatusFilter = 'all';
    let quizUserAnswers = {};

    function getSafeStorage() {
      return (typeof StorageService !== 'undefined')
        ? StorageService
        : (typeof window !== 'undefined' && window.StorageService ? window.StorageService : null);
    }

    function getStudyData() {
      if (typeof StudyData !== 'undefined' && StudyData) return StudyData;
      if (typeof window !== 'undefined' && window.StudyData) return window.StudyData;
      return { bands: [], vocabTopics: [], grammarTopics: [] };
    }

    function toggleTheme() {
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleTheme === 'function') {
        storage.toggleTheme();
      }
    }

    function speakEnglishWord(text, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      if (typeof window === 'undefined' || !window.speechSynthesis || typeof SpeechSynthesisUtterance === 'undefined') {
        return false;
      }
      try {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(String(text || ''));
        utter.lang = 'en-US';
        utter.rate = 0.92;
        window.speechSynthesis.speak(utter);
        return true;
      } catch (_) {
        return false;
      }
    }

    function getTopicsForBand(bandId) {
      const data = getStudyData();
      return (data.vocabTopics || []).filter(t => String(t.band) === String(bandId));
    }

    function getCurrentTopic() {
      const topics = getTopicsForBand(currentBand);
      return topics.find(t => t.id === currentTopicId) || topics[0] || null;
    }

    function computeBandStats(bandId) {
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function'
        ? storage.getStudyProgress()
        : { vocabStatus: {}, vocabStarred: {} };
      const topics = getTopicsForBand(bandId);
      let totalWords = 0;
      let masteredCount = 0;
      let learningCount = 0;
      let starredCount = 0;

      topics.forEach(t => {
        (t.words || []).forEach(w => {
          totalWords++;
          const st = prog.vocabStatus && prog.vocabStatus[w.id];
          if (st === 'mastered') masteredCount++;
          else if (st === 'learning') learningCount++;
          if (prog.vocabStarred && prog.vocabStarred[w.id]) starredCount++;
        });
      });

      const pct = totalWords > 0 ? Math.round((masteredCount / totalWords) * 100) : 0;
      return { totalWords, masteredCount, learningCount, starredCount, pct };
    }

    function selectBand(bandId) {
      const validBands = ['450', '550', '650', '750', '850'];
      const clean = String(bandId || '450').replace('+', '').trim();
      currentBand = validBands.includes(clean) ? clean : '450';
      const storage = getSafeStorage();
      if (storage && typeof storage.setStudyBand === 'function') {
        storage.setStudyBand(currentBand);
      }
      const topics = getTopicsForBand(currentBand);
      currentTopicId = topics[0] ? topics[0].id : '';
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      quizUserAnswers = {};
      renderAll();
      return currentBand;
    }

    function selectTopic(topicId) {
      currentTopicId = String(topicId || '');
      flashcardIndex = 0;
      isFlashcardFlipped = false;
      quizUserAnswers = {};
      renderAll();
      return currentTopicId;
    }

    function switchVocabMode(mode) {
      const validModes = ['flashcard', 'list', 'quiz'];
      currentMode = validModes.includes(mode) ? mode : 'list';
      ['flashcard', 'list', 'quiz'].forEach(m => {
        const btn = typeof document !== 'undefined' ? document.getElementById(`vmode-${m}`) : null;
        if (btn) {
          if (btn.classList) btn.classList.toggle('active', m === currentMode);
          if (typeof btn.setAttribute === 'function') btn.setAttribute('aria-pressed', m === currentMode ? 'true' : 'false');
        }
      });
      renderWorkspace();
      return currentMode;
    }

    function renderBandSelector() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-band-selector') : null;
      if (!wrap) return;
      const data = getStudyData();
      const bands = data.bands || [];
      wrap.innerHTML = bands.map(b => {
        const stats = computeBandStats(b.id);
        const isActive = String(b.id) === String(currentBand);
        return `
          <button type="button" class="band-chip-btn ${isActive ? 'active' : ''}" data-band="${b.id}" onclick="selectBand('${b.id}')" aria-pressed="${isActive ? 'true' : 'false'}">
            <span class="band-chip-label">${b.label}</span>
            <span class="band-chip-sub">${stats.masteredCount}/${stats.totalWords}</span>
          </button>
        `;
      }).join('');
    }

    function renderBandOverview() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-band-overview') : null;
      if (!wrap) return;
      const stats = computeBandStats(currentBand);
      const topic = getCurrentTopic();
      const topicLabel = topic ? topic.title : '';

      wrap.innerHTML = `
        <div class="slim-progress-left">
          <strong>Mốc ${currentBand}+:</strong>
          <div class="slim-bar-track" role="progressbar" aria-valuenow="${stats.pct}" aria-valuemin="0" aria-valuemax="100">
            <div class="slim-bar-fill" style="width:${stats.pct}%;"></div>
          </div>
          <span>Đã thuộc <strong>${stats.masteredCount}/${stats.totalWords}</strong> (${stats.pct}%) • ⭐ ${stats.starredCount}</span>
        </div>
        <div class="slim-actions-right">
          <span style="color:var(--text-muted);margin-right:4px;">${topicLabel}</span>
          <button type="button" class="slim-link-btn" onclick="exportStudyBackup()" title="Xuất file JSON sao lưu tiến độ">⬇️ Sao lưu</button>
          <button type="button" class="slim-link-btn" onclick="triggerImportStudyBackup()" title="Khôi phục tiến độ từ file JSON">⬆️ Khôi phục</button>
        </div>
      `;
    }

    function renderTopicTabs() {
      const wrap = typeof document !== 'undefined' ? document.getElementById('vocab-topic-tabs') : null;
      if (!wrap) return;
      const topics = getTopicsForBand(currentBand);
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {} };

      wrap.innerHTML = topics.map(t => {
        const isActive = t.id === currentTopicId;
        const words = t.words || [];
        const mastered = words.filter(w => prog.vocabStatus && prog.vocabStatus[w.id] === 'mastered').length;

        return `
          <button type="button" class="topic-pill-btn ${isActive ? 'active' : ''}" onclick="selectTopic('${t.id}')" aria-pressed="${isActive ? 'true' : 'false'}">
            <span>${t.icon || ''} ${t.title.replace(/\s*\(\d+\+\)$/, '')}</span>
            <span class="topic-pill-count">${mastered}/${words.length}</span>
          </button>
        `;
      }).join('');
    }

    function renderFlashcardMode(topic) {
      const words = (topic && topic.words) || [];
      if (words.length === 0) return '<p style="text-align:center;">Không có dữ liệu từ vựng.</p>';
      if (flashcardIndex < 0) flashcardIndex = 0;
      if (flashcardIndex >= words.length) flashcardIndex = words.length - 1;

      const w = words[flashcardIndex];
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {}, vocabStarred: {} };
      const status = (prog.vocabStatus && prog.vocabStatus[w.id]) || 'unseen';
      const isStarred = Boolean(prog.vocabStarred && prog.vocabStarred[w.id]);

      return `
        <div class="fc-container">
          <div class="fc-meta-row">
            <span>${topic.title} • <strong>${flashcardIndex + 1} / ${words.length}</strong></span>
            <span>${status === 'mastered' ? '✅ Đã thuộc' : (status === 'learning' ? '⏳ Cần ôn' : 'Chưa học')}</span>
          </div>

          <div class="vocab-flashcard ${isFlashcardFlipped ? 'is-flipped' : ''}" id="active-flashcard" onclick="flipFlashcard()" role="button" tabindex="0" aria-label="Lật thẻ từ ${w.word}">
            <div class="fc-header">
              <span class="pos-tag">${w.pos}</span>
              <div style="display:flex;gap:6px;">
                <button type="button" class="icon-pill-btn" onclick="speakEnglishWord('${w.word.replace(/'/g, "\\'")}', event)">🔊 Nghe</button>
                <button type="button" class="icon-pill-btn ${isStarred ? 'starred' : ''}" onclick="handleToggleStar('${w.id}', event)">${isStarred ? '⭐' : '☆'}</button>
              </div>
            </div>

            ${!isFlashcardFlipped ? `
              <div class="fc-body">
                <div class="fc-word">${w.word}</div>
                <div class="fc-ipa">${w.ipa}</div>
                <div class="fc-example-en">"${w.exampleEn}"</div>
              </div>
              <div class="fc-hint">Nhấn vào thẻ hoặc phím Space để lật xem nghĩa &amp; giải thích</div>
            ` : `
              <div class="fc-body" style="padding:12px 4px;">
                <div style="font-size:1.25rem;font-weight:800;margin-bottom:2px;">${w.word} <span style="font-size:0.82rem;font-weight:500;color:var(--text-muted);">${w.ipa}</span></div>
                <div class="fc-meaning">${w.meaning}</div>
                <div class="fc-back-details">
                  <div><strong>Cụm từ / Vị trí:</strong> ${w.collocations}</div>
                  <div><strong>Ghi chú ETS:</strong> ${w.tip}</div>
                  <div style="padding-top:4px;border-top:1px solid rgba(255,255,255,0.06);">
                    <strong>${w.exampleSource}:</strong> "${w.exampleEn}"<br>
                    <span style="color:var(--text-secondary);">→ ${w.exampleVi}</span>
                  </div>
                </div>
              </div>
              <div class="fc-hint">Nhấn vào thẻ để lật lại mặt trước</div>
            `}
          </div>

          <div class="fc-nav-bar">
            <button type="button" class="btn btn-secondary btn-sm" onclick="stepFlashcard(-1)" ${flashcardIndex === 0 ? 'disabled' : ''}>◀ Trước</button>
            <div style="display:flex;gap:6px;">
              <button type="button" class="btn btn-secondary btn-sm" onclick="markWordStatusAndNext('${w.id}', 'learning')">⏳ Cần ôn</button>
              <button type="button" class="btn btn-success btn-sm" onclick="markWordStatusAndNext('${w.id}', 'mastered')">✓ Đã thuộc</button>
            </div>
            <button type="button" class="btn btn-secondary btn-sm" onclick="stepFlashcard(1)" ${flashcardIndex >= words.length - 1 ? 'disabled' : ''}>Tiếp ▶</button>
          </div>
        </div>
      `;
    }

    function renderWordListMode(topic) {
      const words = (topic && topic.words) || [];
      const storage = getSafeStorage();
      const prog = storage && typeof storage.getStudyProgress === 'function' ? storage.getStudyProgress() : { vocabStatus: {}, vocabStarred: {} };
      const q = (listSearchQuery || '').trim().toLowerCase();

      const filtered = words.filter(w => {
        const st = (prog.vocabStatus && prog.vocabStatus[w.id]) || 'unseen';
        const starred = Boolean(prog.vocabStarred && prog.vocabStarred[w.id]);
        if (listStatusFilter === 'mastered' && st !== 'mastered') return false;
        if (listStatusFilter === 'learning' && st !== 'learning') return false;
        if (listStatusFilter === 'unseen' && st !== 'unseen') return false;
        if (listStatusFilter === 'starred' && !starred) return false;
        if (q) {
          return `${w.word} ${w.meaning} ${w.collocations} ${w.exampleEn}`.toLowerCase().includes(q);
        }
        return true;
      });

      const filters = [
        { id: 'all', label: `Tất cả (${words.length})` },
        { id: 'unseen', label: 'Chưa thuộc' },
        { id: 'learning', label: 'Cần ôn' },
        { id: 'mastered', label: 'Đã thuộc' },
        { id: 'starred', label: '⭐' }
      ];

      return `
        <div class="list-filter-bar">
          <input type="search" class="search-box-minimal" id="vocab-search-input" placeholder="Tìm từ vựng, nghĩa hoặc cụm từ..." value="${listSearchQuery.replace(/"/g, '&quot;')}" oninput="handleVocabSearch(this.value)" aria-label="Tìm kiếm từ vựng">
          <div class="filter-chips-group">
            ${filters.map(f => `
              <button type="button" class="mini-filter-chip ${listStatusFilter === f.id ? 'active' : ''}" onclick="setVocabListFilter('${f.id}')">${f.label}</button>
            `).join('')}
          </div>
        </div>

        ${filtered.length === 0 ? `
          <div style="text-align:center;padding:32px;color:var(--text-muted);font-size:0.88rem;">Không có từ vựng nào khớp với bộ lọc.</div>
        ` : `
          <div class="vocab-compact-grid">
            ${filtered.map(w => {
              const st = (prog.vocabStatus && prog.vocabStatus[w.id]) || 'unseen';
              const starred = Boolean(prog.vocabStarred && prog.vocabStarred[w.id]);
              return `
                <article class="vocab-compact-card ${st === 'mastered' ? 'is-mastered' : (st === 'learning' ? 'is-learning' : '')}">
                  <div class="vc-row-top">
                    <div class="vc-word-group">
                      <span class="vc-word">${w.word}</span>
                      <span class="pos-tag">${w.pos}</span>
                      <span class="vc-ipa">${w.ipa}</span>
                    </div>
                    <div class="vc-actions">
                      <button type="button" class="vc-icon-btn" onclick="speakEnglishWord('${w.word.replace(/'/g, "\\'")}', event)" title="Phát âm">🔊</button>
                      <button type="button" class="vc-icon-btn" onclick="handleToggleStar('${w.id}', event)" title="Gắn sao">${starred ? '⭐' : '☆'}</button>
                      <button type="button" class="vc-icon-btn ${st === 'learning' ? 'active-learning' : ''}" onclick="setWordStatus('${w.id}', 'learning')" title="Cần ôn lại">Ôn</button>
                      <button type="button" class="vc-icon-btn ${st === 'mastered' ? 'active-mastered' : ''}" onclick="setWordStatus('${w.id}', 'mastered')" title="Đánh dấu đã thuộc">✓ Thuộc</button>
                    </div>
                  </div>
                  <div class="vc-meaning">${w.meaning}</div>
                  <div class="vc-sub-note">${w.collocations}</div>
                  <div class="vc-example-line">
                    <span style="color:var(--text-secondary);">"${w.exampleEn}"</span> — ${w.exampleVi} <span style="opacity:0.7;">(${w.exampleSource})</span>
                  </div>
                </article>
              `;
            }).join('')}
          </div>
        `}
      `;
    }

    function renderQuizMode(topic) {
      const questions = (topic && topic.quizQuestions) || [];
      if (questions.length === 0) return '<p style="text-align:center;">Không có câu hỏi trắc nghiệm.</p>';

      let answeredCount = 0;
      let correctCount = 0;
      questions.forEach(q => {
        const u = quizUserAnswers[q.id];
        if (u) {
          answeredCount++;
          if (u === q.correctAnswer) correctCount++;
        }
      });

      return `
        <div class="quiz-wrap">
          <div class="slim-status-strip" style="margin-bottom:4px;">
            <span><strong>Trắc nghiệm ${topic.title}</strong> • Đã làm ${answeredCount}/${questions.length} • Đúng <strong style="color:var(--success);">${correctCount}/${questions.length}</strong></span>
            <button type="button" class="slim-link-btn" onclick="resetVocabQuiz()">🔄 Làm lại</button>
          </div>

          ${questions.map((q, idx) => {
            const userChoice = quizUserAnswers[q.id] || null;
            const letters = ['A', 'B', 'C', 'D'];
            return `
              <div class="quiz-item-card">
                <div style="display:flex;justify-content:space-between;font-size:0.74rem;color:var(--text-muted);">
                  <strong>Câu ${idx + 1}/${questions.length}</strong>
                  <span>${q.source}</span>
                </div>
                <div class="quiz-q-text">${q.questionText}</div>
                <div class="quiz-opts-grid">
                  ${letters.map(letter => {
                    const optText = q.options && q.options[letter] ? q.options[letter] : '';
                    let cls = 'quiz-opt-btn';
                    if (userChoice) {
                      if (letter === q.correctAnswer) cls += ' is-correct';
                      else if (letter === userChoice) cls += ' is-wrong';
                    }
                    return `
                      <button type="button" class="${cls}" onclick="answerVocabQuiz('${q.id}', '${letter}')">
                        <span class="ans-key">${letter}</span>
                        <span>${optText}</span>
                      </button>
                    `;
                  }).join('')}
                </div>
                ${userChoice ? `
                  <div class="quiz-explain-box">
                    <div style="font-weight:700;color:${userChoice === q.correctAnswer ? 'var(--success)' : 'var(--danger)'};margin-bottom:3px;">
                      ${userChoice === q.correctAnswer ? '✓ Chính xác!' : `✕ Đáp án đúng: (${q.correctAnswer})`}
                    </div>
                    <div><strong>Dịch:</strong> ${q.questionTranslation}</div>
                    <div style="color:var(--text-secondary);margin-top:2px;">${q.explanation}</div>
                  </div>
                ` : ''}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderWorkspace() {
      const container = typeof document !== 'undefined' ? document.getElementById('vocab-workspace-container') : null;
      if (!container) return;
      const topic = getCurrentTopic();
      if (!topic) {
        container.innerHTML = '';
        return;
      }
      if (currentMode === 'flashcard') {
        container.innerHTML = renderFlashcardMode(topic);
      } else if (currentMode === 'quiz') {
        container.innerHTML = renderQuizMode(topic);
      } else {
        container.innerHTML = renderWordListMode(topic);
      }
    }

    function renderAll() {
      renderBandSelector();
      renderTopicTabs();
      renderBandOverview();
      renderWorkspace();
    }

    function flipFlashcard() {
      isFlashcardFlipped = !isFlashcardFlipped;
      renderWorkspace();
      return isFlashcardFlipped;
    }

    function stepFlashcard(delta) {
      const topic = getCurrentTopic();
      const words = (topic && topic.words) || [];
      if (words.length === 0) return 0;
      flashcardIndex = Math.min(words.length - 1, Math.max(0, flashcardIndex + delta));
      isFlashcardFlipped = false;
      renderWorkspace();
      return flashcardIndex;
    }

    function setWordStatus(wordId, status) {
      const storage = getSafeStorage();
      if (storage && typeof storage.setVocabWordStatus === 'function') {
        const prog = storage.getStudyProgress();
        const cur = prog.vocabStatus && prog.vocabStatus[wordId];
        const next = cur === status ? 'unseen' : status;
        storage.setVocabWordStatus(wordId, next);
      }
      renderAll();
    }

    function markWordStatusAndNext(wordId, status) {
      const storage = getSafeStorage();
      if (storage && typeof storage.setVocabWordStatus === 'function') {
        storage.setVocabWordStatus(wordId, status);
      }
      const topic = getCurrentTopic();
      const words = (topic && topic.words) || [];
      if (flashcardIndex < words.length - 1) flashcardIndex++;
      isFlashcardFlipped = false;
      renderAll();
    }

    function handleToggleStar(wordId, event) {
      if (event && typeof event.stopPropagation === 'function') event.stopPropagation();
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleVocabStar === 'function') {
        storage.toggleVocabStar(wordId);
      }
      renderAll();
    }

    function handleVocabSearch(val) {
      listSearchQuery = String(val || '');
      renderWorkspace();
      const input = typeof document !== 'undefined' ? document.getElementById('vocab-search-input') : null;
      if (input && typeof input.focus === 'function') {
        input.focus();
        try { input.setSelectionRange(listSearchQuery.length, listSearchQuery.length); } catch (_) {}
      }
    }

    function setVocabListFilter(filterId) {
      listStatusFilter = filterId || 'all';
      renderWorkspace();
    }

    function answerVocabQuiz(questionId, choice) {
      quizUserAnswers[questionId] = choice;
      const topic = getCurrentTopic();
      if (topic && Array.isArray(topic.quizQuestions)) {
        let correct = 0;
        topic.quizQuestions.forEach(q => {
          if (quizUserAnswers[q.id] === q.correctAnswer) correct++;
        });
        const storage = getSafeStorage();
        if (storage && typeof storage.saveVocabQuizScore === 'function') {
          storage.saveVocabQuizScore(topic.id, correct, topic.quizQuestions.length);
        }
      }
      renderAll();
    }

    function resetVocabQuiz() {
      quizUserAnswers = {};
      renderWorkspace();
    }

    function exportStudyBackup() {
      const storage = getSafeStorage();
      if (!storage || typeof storage.exportStudyProgressJSON !== 'function') return null;
      const jsonStr = storage.exportStudyProgressJSON();
      if (typeof document !== 'undefined' && typeof Blob !== 'undefined' && typeof URL !== 'undefined') {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `toeic_study_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }
      return jsonStr;
    }

    function triggerImportStudyBackup() {
      const input = typeof document !== 'undefined' ? document.getElementById('study-backup-file-input') : null;
      if (input && typeof input.click === 'function') input.click();
    }

    function handleImportStudyBackup(event) {
      const file = event && event.target && event.target.files && event.target.files[0];
      if (!file || typeof FileReader === 'undefined') return;
      const reader = new FileReader();
      reader.onload = (e) => {
        const content = e && e.target ? e.target.result : '';
        const storage = getSafeStorage();
        if (storage && typeof storage.importStudyProgressJSON === 'function') {
          const res = storage.importStudyProgressJSON(content);
          if (res && res.ok) {
            if (typeof alert === 'function') alert('✅ Khôi phục tiến độ thành công!');
            renderAll();
          } else if (typeof alert === 'function') {
            alert('⚠️ ' + ((res && res.error) || 'File backup không hợp lệ.'));
          }
        }
      };
      reader.readAsText(file);
    }

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('DOMContentLoaded', () => {
        const storage = getSafeStorage();
        if (storage && typeof storage.initTheme === 'function') storage.initTheme();
        let initialBand = '450';
        if (storage && typeof storage.getStudyProgress === 'function') {
          initialBand = storage.getStudyProgress().lastBand || '450';
        }
        try {
          const params = new URLSearchParams(window.location.search);
          if (params.get('band')) initialBand = params.get('band');
          if (params.get('mode')) switchVocabMode(params.get('mode'));
        } catch (_) {}
        selectBand(initialBand);
      });

      document.addEventListener('keydown', (e) => {
        if (currentMode !== 'flashcard') return;
        const tag = e.target && e.target.tagName ? e.target.tagName.toUpperCase() : '';
        if (tag === 'INPUT' || tag === 'TEXTAREA') return;
        if (e.code === 'Space') {
          e.preventDefault();
          flipFlashcard();
        } else if (e.code === 'ArrowRight') {
          stepFlashcard(1);
        } else if (e.code === 'ArrowLeft') {
          stepFlashcard(-1);
        }
      });
    }

    if (typeof window !== 'undefined') {
      window.selectBand = selectBand;
      window.selectTopic = selectTopic;
      window.switchVocabMode = switchVocabMode;
      window.flipFlashcard = flipFlashcard;
      window.stepFlashcard = stepFlashcard;
      window.setWordStatus = setWordStatus;
      window.markWordStatusAndNext = markWordStatusAndNext;
      window.handleToggleStar = handleToggleStar;
      window.handleVocabSearch = handleVocabSearch;
      window.setVocabListFilter = setVocabListFilter;
      window.answerVocabQuiz = answerVocabQuiz;
