<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kết Quả Thi — TOEIC Master</title>
  <meta name="description" content="Kết quả bài thi TOEIC trực tuyến, phân tích điểm số chuẩn ETS và lời giải chi tiết từng câu.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css?v=20261024v7">
  <link rel="stylesheet" href="css/layout.css?v=20261024v7">
  <link rel="stylesheet" href="css/components.css?v=20261024v7">
  <link rel="stylesheet" href="css/responsive.css?v=20261024v7">
  <style>
    /* Compact Navbar so sticky Part 1..7 bar has maximum vertical room and is never covered */
    :root {
      --navbar-height: 48px;
    }
    .app-navbar {
      min-height: 48px !important;
      height: 48px !important;
      padding: 4px 18px !important;
    }
    /* Styling for Sticky Filter & Part Chips Bar in Result Page */
    .result-hero-title {
      font-size: 1.85rem;
      font-weight: 800;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    /* Question Card Header with Inline Audio Player */
    .review-q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      flex-wrap: nowrap;
    }
    .review-q-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .review-q-header .audio-player-box {
      flex: 1;
      max-width: 320px;
      margin: 0 0 0 auto;
      padding: 3px 10px;
      min-height: 34px;
      gap: 8px;
      border-radius: var(--radius-full);
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(99, 102, 241, 0.25);
      box-sizing: border-box;
    }
    [data-theme="light"] .review-q-header .audio-player-box {
      background: #f1f5f9;
      border-color: #cbd5e1;
    }
    .review-q-header .audio-play-btn {
      width: 26px;
      height: 26px;
      min-width: 26px;
      font-size: 0.75rem;
      padding-left: 2px;
    }
    .review-q-header .audio-progress-wrap {
      gap: 3px;
      min-width: 0;
    }
    .review-q-header .audio-top-info {
      gap: 4px;
    }
    .review-q-header .audio-label-text {
      font-size: 0.72rem;
      max-width: 120px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .review-q-header .audio-time-pill {
      font-size: 0.7rem;
      padding: 1px 4px;
    }
    .review-q-header .audio-track-bar {
      height: 4px;
    }
    .filter-tabs-bar {
      position: sticky;
      top: 48px;
      z-index: 88;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }
    [data-theme="light"] .filter-tabs-bar {
      background: rgba(255, 255, 255, 0.94);
      border-color: #cbd5e1;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    .filter-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
    }
    .filter-row-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      min-width: 70px;
      flex-shrink: 0;
    }
    .filter-tabs-group {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      flex: 1;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-tabs-group::-webkit-scrollbar {
      display: none;
    }
    .filter-tab-btn {
      padding: 5px 11px;
      border-radius: var(--radius-full);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-glass);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-tab-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .filter-tab-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .filter-pill-btn {
      flex: 1 1 0;
      min-width: 56px;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-pill-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .filter-pill-btn.active {
      background: var(--accent-secondary);
      color: #0f172a;
      border-color: var(--accent-secondary);
      font-weight: 800;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.3);
    }
    [data-theme="light"] .filter-tab-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }
    [data-theme="light"] .filter-tab-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    [data-theme="light"] .filter-tab-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    [data-theme="light"] .filter-pill-btn {
      background: #ffffff;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    [data-theme="light"] .filter-pill-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }
    [data-theme="light"] .filter-pill-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    .tab-count {
      font-size: 0.74rem;
      opacity: 0.85;
      font-family: var(--font-heading, monospace);
    }
    .score-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .score-summary-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .score-summary-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .score-summary-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      font-family: var(--font-heading);
    }
    .result-action-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .review-section-header {
      display: none !important;
    }
    .review-toggle-all-btns {
      display: flex;
      gap: 8px;
    }
    #detailed-review-section {
      padding-top: 4px;
    }
    html.review-page-active #result-overview-page {
      display: none !important;
    }
    html.review-page-active #detailed-review-section {
      display: block !important;
    }
    @media (max-width: 640px) {
      #result-test-title,
      .result-hero-title {
        font-size: 1.25rem !important;
        line-height: 1.3 !important;
        margin-bottom: 6px !important;
      }
      .review-q-header {
        flex-wrap: nowrap;
        gap: 6px;
        margin-bottom: 6px;
        padding-bottom: 6px;
      }
      .review-q-title-wrap {
        gap: 5px;
        flex-shrink: 0;
      }
      .review-q-header .audio-player-box {
        max-width: none;
        padding: 2px 6px;
        gap: 6px;
        min-height: 28px;
      }
      .review-q-header .audio-label-text {
        display: none;
      }
      .review-q-header .audio-play-btn {
        width: 24px;
        height: 24px;
        min-width: 24px;
        font-size: 0.7rem;
      }
      .review-q-header .audio-time-pill {
        font-size: 0.68rem;
        margin-left: auto;
      }
      .review-q-header .audio-track-bar {
        height: 4px;
      }
      .score-summary-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 24px;
      }
      .score-summary-card {
        padding: 10px 4px;
      }
      .score-summary-title {
        font-size: 0.72rem;
      }
      .score-summary-val {
        font-size: 1.15rem;
      }
      .result-action-btns {
        flex-direction: column;
        width: 100%;
        gap: 10px;
        margin-bottom: 28px;
      }
      .result-action-btns .btn {
        width: 100%;
        white-space: normal;
        text-align: center;
        padding: 12px 14px;
        font-size: 0.95rem;
      }
      .review-section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 10px;
      }
      .review-section-header h2 {
        font-size: 1.15rem !important;
      }
      .review-toggle-all-btns {
        width: 100%;
        display: flex;
        gap: 8px;
      }
      .review-toggle-all-btns .btn {
        flex: 1;
        font-size: 0.76rem;
        padding: 6px 8px;
        white-space: nowrap;
        text-align: center;
      }
      :root {
        --navbar-height: 40px;
      }
      .app-navbar {
        min-height: 40px !important;
        height: 40px !important;
        padding: 2px 10px !important;
      }
      .filter-tabs-bar {
        top: 40px;
        padding: 4px 6px;
        gap: 4px;
        margin-bottom: 4px;
      }
      .filter-row-label {
        display: none;
      }
      .filter-tabs-group {
        width: 100%;
        gap: 3px;
      }
      #part-filter-group .filter-pill-btn {
        flex: 1 1 0;
        min-width: 38px;
        padding: 4px 2px;
        font-size: 0.72rem;
      }
      .filter-tab-btn {
        flex: 1 1 0;
        justify-content: center;
        padding: 3px 5px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="app-navbar">
    <div class="nav-brand">
      <a href="index.html" style="color: inherit; display: flex; align-items: center; gap: 8px;">
        <span>🎯 TOEIC Master</span>
      </a>
    </div>
    <div class="nav-links">
      <!-- Global Page Font-Size / Browser Zoom Control -->
      <div class="header-ctrl-dropdown" id="header-zoom-ctrl">
        <button type="button" class="nav-icon-ctrl-btn" id="zoom-menu-btn" onclick="StorageService.toggleHeaderPopover('zoom-popover-menu', event)" aria-label="Điều chỉnh cỡ chữ và thu phóng toàn trang" title="Chỉnh cỡ chữ / Thu phóng toàn trang">
          <span>🔤</span>
          <span id="zoom-level-label">100%</span>
        </button>
        <div class="header-ctrl-popover" id="zoom-popover-menu" style="display: none;" onclick="event.stopPropagation()">
          <div class="popover-ctrl-title">🔤 Cỡ chữ / Zoom toàn trang</div>
          <div class="zoom-stepper-row">
            <button type="button" class="zoom-step-btn" onclick="StorageService.stepPageZoom(-10)" title="Thu nhỏ (-10%)" aria-label="Thu nhỏ 10%">➖</button>
            <span class="zoom-current-val" id="zoom-popover-val">100%</span>
            <button type="button" class="zoom-step-btn" onclick="StorageService.stepPageZoom(10)" title="Phóng to (+10%)" aria-label="Phóng to 10%">➕</button>
          </div>
          <div class="ctrl-preset-grid">
            <button type="button" class="zoom-preset-btn" data-zoom="85" onclick="StorageService.setPageZoom(85)">85%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="90" onclick="StorageService.setPageZoom(90)">90%</button>
            <button type="button" class="zoom-preset-btn active" data-zoom="100" onclick="StorageService.setPageZoom(100)">100%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="110" onclick="StorageService.setPageZoom(110)">110%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="120" onclick="StorageService.setPageZoom(120)">120%</button>
            <button type="button" class="zoom-preset-btn" data-zoom="130" onclick="StorageService.setPageZoom(130)">130%</button>
          </div>
        </div>
      </div>

      <!-- Global Audio Playback Speed Control -->
      <div class="header-ctrl-dropdown" id="header-speed-ctrl">
        <button type="button" class="nav-icon-ctrl-btn" id="speed-menu-btn" onclick="StorageService.toggleHeaderPopover('speed-popover-menu', event)" aria-label="Điều chỉnh tốc độ phát tất cả âm thanh" title="Chỉnh tốc độ phát cho tất cả âm thanh">
          <span>🎧</span>
          <span id="global-speed-label">1.0x</span>
        </button>
        <div class="header-ctrl-popover" id="speed-popover-menu" style="display: none;" onclick="event.stopPropagation()">
          <div class="popover-ctrl-title">🎧 Tốc độ phát âm thanh</div>
          <div class="ctrl-preset-grid">
            <button type="button" class="speed-preset-btn" data-speed="0.75" onclick="AudioController.setPlaybackRate(0.75)">0.75x</button>
            <button type="button" class="speed-preset-btn" data-speed="0.9" onclick="AudioController.setPlaybackRate(0.9)">0.9x</button>
            <button type="button" class="speed-preset-btn active" data-speed="1" onclick="AudioController.setPlaybackRate(1.0)">1.0x</button>
            <button type="button" class="speed-preset-btn" data-speed="1.15" onclick="AudioController.setPlaybackRate(1.15)">1.15x</button>
            <button type="button" class="speed-preset-btn" data-speed="1.25" onclick="AudioController.setPlaybackRate(1.25)">1.25x</button>
            <button type="button" class="speed-preset-btn" data-speed="1.5" onclick="AudioController.setPlaybackRate(1.5)">1.5x</button>
          </div>
        </div>
      </div>

      <button class="fullscreen-toggle-btn" id="fullscreen-btn" type="button" onclick="StorageService.toggleFullscreen()" aria-label="Bật chế độ toàn màn hình" aria-pressed="false" title="Bật / Tắt chế độ toàn màn hình">
        <svg class="fs-icon-enter" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        <svg class="fs-icon-exit" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none;"><path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"/></svg>
      </button>
      <button class="theme-toggle-btn" id="theme-btn" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng / Tối">
        🌓
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container" style="padding-bottom: 80px;">
    
    <!-- Page 1: Result Overview Page (Score Hero & Part Breakdown) -->
    <div id="result-overview-page">
      <!-- Result Hero Section -->
      <section class="result-hero animate-fade-in">
        <h1 id="result-test-title" class="result-hero-title">EST 2022 — Test 01</h1>
        <p id="result-time-spent" style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 28px;">
          ⏱️ Thời gian làm bài: 0 phút
        </p>

        <!-- Circular Scaled Score 10 - 990 -->
        <div class="score-circle-wrap" role="region" aria-label="Điểm tổng kết quả thi">
          <div class="score-circle-inner">
            <div class="score-val" id="result-total-score">0</div>
            <div class="score-max">/ 990 ĐIỂM</div>
          </div>
        </div>

        <!-- Scaled Scores & Correct Answers Counts -->
        <div class="score-summary-grid">
          <div class="score-summary-card">
            <div class="score-summary-title">🎧 Listening (LC)</div>
            <div class="score-summary-val" id="result-lc-score" style="color: var(--accent-primary);">0 / 495</div>
          </div>
          <div class="score-summary-card">
            <div class="score-summary-title">📖 Reading (RC)</div>
            <div class="score-summary-val" id="result-rc-score" style="color: var(--accent-secondary);">0 / 495</div>
          </div>
          <div class="score-summary-card">
            <div class="score-summary-title">🎯 Số câu đúng</div>
            <div class="score-summary-val" id="result-total-correct" style="color: var(--success);">0 / 200</div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="result-action-btns">
          <button type="button" class="btn btn-primary btn-lg result-btn-detail" onclick="showDetailedReviewAndSyncAria()" id="btn-show-detail" aria-expanded="false" aria-controls="detailed-review-section" aria-label="Xem chi tiết bài làm và lời giải phân tích">
            📝 Xem Chi Tiết Bài Làm & Lời Giải ➔
          </button>
          <button type="button" class="btn btn-secondary btn-lg result-btn-retake" onclick="retakeExam()" aria-label="Làm lại đề thi này">
            🔄 Làm lại đề này
          </button>
        </div>
      </section>

      <!-- Part Breakdown Grid -->
      <section style="margin-bottom: 40px;">
        <h2 style="font-size: 1.3rem; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
          <span>📊</span> Đánh Giá Từng Phần (Part 1 - 7)
        </h2>
        <div class="part-breakdown-grid" id="result-part-breakdown">
          <!-- Rendered dynamically by ResultViewer -->
        </div>
      </section>
    </div>

    <!-- Page 2: Detailed Review Section (Separate Page shown when user clicks 'Xem Chi Tiết Bài Làm') -->
    <section id="detailed-review-section" style="display: none; scroll-margin-top: 90px;" class="animate-fade-in">
      <div class="review-section-header">
        <h2 style="font-size: 1.5rem; display: flex; align-items: center; gap: 8px;">
          <span>📝</span> Chi Tiết Bài Làm & Đáp Án
        </h2>
        <div class="review-toggle-all-btns" style="display: none;">
          <button type="button" class="btn btn-secondary btn-sm" onclick="ResultViewer.toggleAllExplanations(true)" aria-label="Mở tất cả phần giải thích chi tiết">
            🔽 Mở tất cả giải thích
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="ResultViewer.toggleAllExplanations(false)" aria-label="Đóng tất cả phần giải thích chi tiết">
            🔼 Đóng tất cả giải thích
          </button>
        </div>
      </div>

      <!-- Sticky Part Chips & Filter Tabs Bar -->
      <div class="filter-tabs-bar">
        <!-- Sticky Part 1 -> 7 Chips Row (Top) -->
        <div class="filter-row">
          <span class="filter-row-label">Phần thi:</span>
          <div class="filter-tabs-group" id="part-filter-group">
            <button type="button" style="display: none;" class="filter-pill-btn active" data-part="all" onclick="ResultViewer.setPartFilter('all')" aria-pressed="true">
              Tất cả Part
            </button>
            <button type="button" class="filter-pill-btn" data-part="part1" onclick="ResultViewer.setPartFilter('part1')" aria-pressed="false">Part 1</button>
            <button type="button" class="filter-pill-btn" data-part="part2" onclick="ResultViewer.setPartFilter('part2')" aria-pressed="false">Part 2</button>
            <button type="button" class="filter-pill-btn" data-part="part3" onclick="ResultViewer.setPartFilter('part3')" aria-pressed="false">Part 3</button>
            <button type="button" class="filter-pill-btn" data-part="part4" onclick="ResultViewer.setPartFilter('part4')" aria-pressed="false">Part 4</button>
            <button type="button" class="filter-pill-btn" data-part="part5" onclick="ResultViewer.setPartFilter('part5')" aria-pressed="false">Part 5</button>
            <button type="button" class="filter-pill-btn" data-part="part6" onclick="ResultViewer.setPartFilter('part6')" aria-pressed="false">Part 6</button>
            <button type="button" class="filter-pill-btn" data-part="part7" onclick="ResultViewer.setPartFilter('part7')" aria-pressed="false">Part 7</button>
          </div>
        </div>

        <!-- Status Filter Row (Hidden as per UI request) -->
        <div class="filter-row" style="display: none; padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.08);">
          <span class="filter-row-label">Kết quả:</span>
          <div class="filter-tabs-group" id="status-filter-group">
            <button type="button" class="filter-tab-btn active" data-status="all" onclick="ResultViewer.setStatusFilter('all')" aria-pressed="true">
              Tất cả <span class="tab-count" id="count-all">(200)</span>
            </button>
            <button type="button" class="filter-tab-btn" data-status="correct" onclick="ResultViewer.setStatusFilter('correct')" aria-pressed="false">
              ✅ Đúng <span class="tab-count" id="count-correct">(0)</span>
            </button>
            <button type="button" class="filter-tab-btn" data-status="wrong" onclick="ResultViewer.setStatusFilter('wrong')" aria-pressed="false">
              ❌ Sai <span class="tab-count" id="count-wrong">(0)</span>
            </button>
            <button type="button" class="filter-tab-btn" data-status="unanswered" onclick="ResultViewer.setStatusFilter('unanswered')" aria-pressed="false">
              ⚪ Chưa làm <span class="tab-count" id="count-unanswered">(0)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Review Questions Container -->
      <div id="review-questions-container">
        <!-- Rendered dynamically by ResultViewer -->
      </div>
    </section>

  </main>

  <!-- JavaScript Modules -->
  <script src="js/app-config.js?v=20261024v7"></script>
  <script src="js/storage-service.js?v=20261024v7"></script>
  <script src="js/audio-controller.js?v=20261024v7"></script>
  <script src="js/ui-renderer.js?v=20261024v7"></script>
  <script src="js/result-viewer.js?v=20261024v7"></script>

  <script>
    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      try {
        if (typeof window !== 'undefined' && window.location) {
          const earlyParams = new URLSearchParams(window.location.search);
          const earlyShow = (earlyParams.get('show') || earlyParams.get('section') || '').toLowerCase();
          if (earlyParams.get('q') || earlyParams.get('question') || earlyShow === 'review' || earlyShow === 'detail') {
            if (document.documentElement && document.documentElement.classList) {
              document.documentElement.classList.add('no-animations');
              document.documentElement.classList.add('review-page-active');
            }
          }
        }
      } catch (_) {}

      if (typeof window !== 'undefined' && typeof window.addEventListener === 'function') {
        window.addEventListener('popstate', () => {
          try {
            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q') || urlParams.get('question');
            const showParam = (urlParams.get('show') || urlParams.get('section') || '').toLowerCase();
            if (qParam || showParam === 'review' || showParam === 'detail') {
              if (typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.showDetailedReviewSection === 'function') {
                ResultViewer.showDetailedReviewSection(true, false);
              }
            } else if (typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.showSummarySection === 'function') {
              ResultViewer.showSummarySection();
            }
          } catch (_) {}
        });
      }

      document.addEventListener('DOMContentLoaded', async () => {
        if (typeof StorageService !== 'undefined' && StorageService && typeof StorageService.initTheme === 'function') {
          StorageService.initTheme();
        }
        if (typeof AudioController !== 'undefined' && AudioController && typeof AudioController.init === 'function') {
          AudioController.init();
        }
        if (typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.init === 'function') {
          await ResultViewer.init();
        }

        // Deep-linking (?show=review, ?section=review, hoặc ?q=62)
        try {
          if (typeof window !== 'undefined' && window.location) {
            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q') || urlParams.get('question');
            const showParam = urlParams.get('show') || urlParams.get('section');
            if (qParam && typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.scrollToQuestionInReview === 'function') {
              ResultViewer.scrollToQuestionInReview(qParam, true);
            } else if (showParam && (showParam.toLowerCase() === 'review' || showParam.toLowerCase() === 'detail')) {
              showDetailedReviewAndSyncAria(false);
            }
          }
        } catch (_) {}
      });
    }

    function showDetailedReviewAndSyncAria(pushHistory = true) {
      if (typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.showDetailedReviewSection === 'function') {
        ResultViewer.showDetailedReviewSection(false, pushHistory);
      } else if (typeof document !== 'undefined') {
        const overview = document.getElementById('result-overview-page');
        if (overview && overview.style) overview.style.display = 'none';
        const sec = document.getElementById('detailed-review-section');
        if (sec) sec.style.display = 'block';
      }
      if (typeof document !== 'undefined') {
        const btn = document.getElementById('btn-show-detail');
        if (btn) btn.setAttribute('aria-expanded', 'true');
      }
    }

    function toggleTheme() {
      if (typeof StorageService !== 'undefined' && StorageService && typeof StorageService.toggleTheme === 'function') {
        StorageService.toggleTheme();
      } else if (typeof document !== 'undefined' && document.documentElement) {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      }
    }

    function retakeExam() {
      const r = (typeof ResultViewer !== 'undefined' && ResultViewer && ResultViewer.resultData)
        ? ResultViewer.resultData
        : (typeof window !== 'undefined' && window.ResultViewer && window.ResultViewer.resultData ? window.ResultViewer.resultData : null);
      if (r && r.testId != null) {
        let parsed = 1;
        if (typeof r.testId === 'number' && Number.isFinite(r.testId)) {
          parsed = Math.floor(r.testId);
        } else if (typeof r.testId === 'string') {
          const str = r.testId.trim();
          if (/^-\d+/.test(str)) {
            parsed = 1;
          } else {
            const match = str.match(/\d+/);
            parsed = match ? parseInt(match[0], 10) : 1;
          }
        }
        const validTestId = (parsed >= 1 && parsed <= 10) ? parsed : Math.min(10, Math.max(1, Number.isFinite(parsed) ? parsed : 1));
        const validMode = (r.mode === 'part') ? 'part' : 'full';
        let url = `exam.html?test=${validTestId}&mode=${validMode}`;
        if (validMode === 'part' && r.partFilter) {
          const validParts = ['part1', 'part2', 'part3', 'part4', 'part5', 'part6', 'part7'];
          const normPart = String(r.partFilter).toLowerCase();
          if (validParts.includes(normPart)) {
            url += `&part=${normPart}`;
          }
        }
        if (typeof window !== 'undefined' && window.location) {
          window.location.href = url;
        }
        return url;
      } else {
        if (typeof window !== 'undefined' && window.location) {
          window.location.href = 'index.html';
        }
        return 'index.html';
      }
    }

    if (typeof window !== 'undefined') {
      window.retakeExam = retakeExam;
      window.toggleTheme = toggleTheme;
      window.showDetailedReviewAndSyncAria = showDetailedReviewAndSyncAria;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        retakeExam,
        toggleTheme,
        showDetailedReviewAndSyncAria
      };
    }
  </script>
</body>
</html>
