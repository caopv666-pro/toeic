<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Kết Quả Thi — TOEIC Master</title>
  <meta name="description" content="Kết quả bài thi TOEIC trực tuyến, phân tích điểm số chuẩn ETS và lời giải chi tiết từng câu.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css?v=20261019d">
  <link rel="stylesheet" href="css/responsive.css?v=20261019d">
  <style>
    /* Compact Navbar so sticky Part 1..7 bar has maximum vertical room and is never covered */
    :root {
      --navbar-height: 48px;
    }
    .app-navbar {
      min-height: 48px !important;
      height: 48px !important;
      padding: 4px 18px !important;
    }
    /* Styling for Sticky Filter & Part Chips Bar in Result Page */
    .filter-tabs-bar {
      position: sticky;
      top: 48px;
      z-index: 88;
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
      padding: 8px 12px;
      background: var(--bg-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-lg);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.25);
    }
    [data-theme="light"] .filter-tabs-bar {
      background: rgba(255, 255, 255, 0.94);
      border-color: #cbd5e1;
      box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    }
    .filter-row {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 8px;
    }
    .filter-row-label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      min-width: 70px;
      flex-shrink: 0;
    }
    .filter-tabs-group {
      display: flex;
      flex-wrap: nowrap;
      gap: 6px;
      flex: 1;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .filter-tabs-group::-webkit-scrollbar {
      display: none;
    }
    .filter-tab-btn {
      padding: 5px 11px;
      border-radius: var(--radius-full);
      background: var(--bg-tertiary);
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--border-glass);
      cursor: pointer;
      transition: all var(--transition-fast);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-tab-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .filter-tab-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .filter-pill-btn {
      flex: 1 1 0;
      min-width: 56px;
      padding: 6px 10px;
      border-radius: var(--radius-full);
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      transition: all var(--transition-fast);
      text-align: center;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .filter-pill-btn:hover {
      background: rgba(255, 255, 255, 0.14);
      color: #ffffff;
    }
    .filter-pill-btn.active {
      background: var(--accent-secondary);
      color: #0f172a;
      border-color: var(--accent-secondary);
      font-weight: 800;
      box-shadow: 0 2px 10px rgba(6, 182, 212, 0.3);
    }
    [data-theme="light"] .filter-tab-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #334155;
    }
    [data-theme="light"] .filter-tab-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    [data-theme="light"] .filter-tab-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    [data-theme="light"] .filter-pill-btn {
      background: #ffffff;
      color: #475569;
      border: 1px solid #cbd5e1;
    }
    [data-theme="light"] .filter-pill-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
      border-color: #94a3b8;
    }
    [data-theme="light"] .filter-pill-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
    .tab-count {
      font-size: 0.74rem;
      opacity: 0.85;
      font-family: var(--font-heading, monospace);
    }
    .score-summary-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      max-width: 600px;
      margin: 0 auto 32px;
    }
    .score-summary-card {
      background: var(--bg-glass-card);
      border: 1px solid var(--border-glass);
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
    }
    .score-summary-title {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }
    .score-summary-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--text-primary);
      font-family: var(--font-heading);
    }
    .result-action-btns {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 36px;
    }
    .review-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .review-toggle-all-btns {
      display: flex;
      gap: 8px;
    }
    @media (max-width: 640px) {
      .score-summary-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 24px;
      }
      .score-summary-card {
        padding: 10px 4px;
      }
      .score-summary-title {
        font-size: 0.72rem;
      }
      .score-summary-val {
        font-size: 1.15rem;
      }
      .result-action-btns {
        flex-direction: column;
        width: 100%;
        gap: 10px;
        margin-bottom: 28px;
      }
      .result-action-btns .btn {
        width: 100%;
        white-space: normal;
        text-align: center;
        padding: 12px 14px;
        font-size: 0.95rem;
      }
      .review-section-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        margin-bottom: 10px;
      }
      .review-section-header h2 {
        font-size: 1.15rem !important;
      }
      .review-toggle-all-btns {
        width: 100%;
        display: flex;
        gap: 8px;
      }
      .review-toggle-all-btns .btn {
        flex: 1;
        font-size: 0.76rem;
        padding: 6px 8px;
        white-space: nowrap;
        text-align: center;
      }
      :root {
        --navbar-height: 40px;
      }
      .app-navbar {
        min-height: 40px !important;
        height: 40px !important;
        padding: 2px 10px !important;
      }
      .filter-tabs-bar {
        top: 40px;
        padding: 6px 6px;
        gap: 4px;
        margin-bottom: 10px;
      }
      .filter-row-label {
        display: none;
      }
      .filter-tabs-group {
        width: 100%;
        gap: 3px;
      }
      #part-filter-group .filter-pill-btn {
        flex: 1 1 0;
        min-width: 38px;
        padding: 4px 2px;
        font-size: 0.72rem;
      }
      .filter-tab-btn {
        flex: 1 1 0;
        justify-content: center;
        padding: 3px 5px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="app-navbar">
    <div class="nav-brand">
      <a href="index.html" style="color: inherit; display: flex; align-items: center; gap: 8px;">
        <span>🎯 TOEIC Master</span>
      </a>
      <span class="brand-badge">Bảng Điểm</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link-btn">Trang chủ</a>
      <a href="history.html" class="nav-link-btn">Lịch sử thi</a>
      <button class="theme-toggle-btn" id="theme-btn" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng / Tối">
        🌓
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container" style="padding-bottom: 80px;">
    
    <!-- Result Hero Section -->
    <section class="result-hero animate-fade-in">
      <h1 id="result-test-title" style="font-size: 2rem; margin-bottom: 8px;">EST 2022 — Test 01</h1>
      <p id="result-time-spent" style="color: var(--text-secondary); font-size: 1rem; margin-bottom: 28px;">
        ⏱️ Thời gian làm bài: 0 phút
      </p>

      <!-- Circular Scaled Score 10 - 990 -->
      <div class="score-circle-wrap" role="region" aria-label="Điểm tổng kết quả thi">
        <div class="score-circle-inner">
          <div class="score-val" id="result-total-score">0</div>
          <div class="score-max">/ 990 ĐIỂM</div>
        </div>
      </div>

      <!-- Scaled Scores & Correct Answers Counts -->
      <div class="score-summary-grid">
        <div class="score-summary-card">
          <div class="score-summary-title">🎧 Listening (LC)</div>
          <div class="score-summary-val" id="result-lc-score" style="color: var(--accent-primary);">0 / 495</div>
        </div>
        <div class="score-summary-card">
          <div class="score-summary-title">📖 Reading (RC)</div>
          <div class="score-summary-val" id="result-rc-score" style="color: var(--accent-secondary);">0 / 495</div>
        </div>
        <div class="score-summary-card">
          <div class="score-summary-title">🎯 Số câu đúng</div>
          <div class="score-summary-val" id="result-total-correct" style="color: var(--success);">0 / 200</div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="result-action-btns">
        <button type="button" class="btn btn-primary btn-lg result-btn-detail" onclick="showDetailedReviewAndSyncAria()" id="btn-show-detail" aria-expanded="false" aria-controls="detailed-review-section" aria-label="Xem chi tiết bài làm và lời giải phân tích">
          📝 Xem Chi Tiết Bài Làm & Lời Giải ➔
        </button>
        <button type="button" class="btn btn-secondary btn-lg result-btn-retake" onclick="retakeExam()" aria-label="Làm lại đề thi này">
          🔄 Làm lại đề này
        </button>
      </div>
    </section>

    <!-- Part Breakdown Grid -->
    <section style="margin-bottom: 40px;">
      <h2 style="font-size: 1.3rem; margin-bottom: 18px; display: flex; align-items: center; gap: 8px;">
        <span>📊</span> Đánh Giá Từng Phần (Part 1 - 7)
      </h2>
      <div class="part-breakdown-grid" id="result-part-breakdown">
        <!-- Rendered dynamically by ResultViewer -->
      </div>
    </section>

    <!-- Detailed Review Section (Hidden until user clicks 'Xem Chi Tiết Bài Làm') -->
    <section id="detailed-review-section" style="display: none; scroll-margin-top: 90px;" class="animate-fade-in">
      <div class="review-section-header">
        <h2 style="font-size: 1.5rem; display: flex; align-items: center; gap: 8px;">
          <span>📝</span> Chi Tiết Bài Làm & Đáp Án
        </h2>
        <div class="review-toggle-all-btns">
          <button type="button" class="btn btn-secondary btn-sm" onclick="ResultViewer.toggleAllExplanations(true)" aria-label="Mở tất cả phần giải thích chi tiết">
            🔽 Mở tất cả giải thích
          </button>
          <button type="button" class="btn btn-secondary btn-sm" onclick="ResultViewer.toggleAllExplanations(false)" aria-label="Đóng tất cả phần giải thích chi tiết">
            🔼 Đóng tất cả giải thích
          </button>
        </div>
      </div>

      <!-- Sticky Part Chips & Filter Tabs Bar -->
      <div class="filter-tabs-bar">
        <!-- Sticky Part 1 -> 7 Chips Row (Top) -->
        <div class="filter-row">
          <span class="filter-row-label">Phần thi:</span>
          <div class="filter-tabs-group" id="part-filter-group">
            <button type="button" style="display: none;" class="filter-pill-btn active" data-part="all" onclick="ResultViewer.setPartFilter('all')" aria-pressed="true">
              Tất cả Part
            </button>
            <button type="button" class="filter-pill-btn" data-part="part1" onclick="ResultViewer.setPartFilter('part1')" aria-pressed="false">Part 1</button>
            <button type="button" class="filter-pill-btn" data-part="part2" onclick="ResultViewer.setPartFilter('part2')" aria-pressed="false">Part 2</button>
            <button type="button" class="filter-pill-btn" data-part="part3" onclick="ResultViewer.setPartFilter('part3')" aria-pressed="false">Part 3</button>
            <button type="button" class="filter-pill-btn" data-part="part4" onclick="ResultViewer.setPartFilter('part4')" aria-pressed="false">Part 4</button>
            <button type="button" class="filter-pill-btn" data-part="part5" onclick="ResultViewer.setPartFilter('part5')" aria-pressed="false">Part 5</button>
            <button type="button" class="filter-pill-btn" data-part="part6" onclick="ResultViewer.setPartFilter('part6')" aria-pressed="false">Part 6</button>
            <button type="button" class="filter-pill-btn" data-part="part7" onclick="ResultViewer.setPartFilter('part7')" aria-pressed="false">Part 7</button>
          </div>
        </div>

        <!-- Status Filter Row -->
        <div class="filter-row" style="padding-top: 6px; border-top: 1px dashed rgba(255,255,255,0.08);">
          <span class="filter-row-label">Kết quả:</span>
          <div class="filter-tabs-group" id="status-filter-group">
            <button type="button" class="filter-tab-btn active" data-status="all" onclick="ResultViewer.setStatusFilter('all')" aria-pressed="true">
              Tất cả <span class="tab-count" id="count-all">(200)</span>
            </button>
            <button type="button" class="filter-tab-btn" data-status="correct" onclick="ResultViewer.setStatusFilter('correct')" aria-pressed="false">
              ✅ Đúng <span class="tab-count" id="count-correct">(0)</span>
            </button>
            <button type="button" class="filter-tab-btn" data-status="wrong" onclick="ResultViewer.setStatusFilter('wrong')" aria-pressed="false">
              ❌ Sai <span class="tab-count" id="count-wrong">(0)</span>
            </button>
            <button type="button" class="filter-tab-btn" data-status="unanswered" onclick="ResultViewer.setStatusFilter('unanswered')" aria-pressed="false">
              ⚪ Chưa làm <span class="tab-count" id="count-unanswered">(0)</span>
            </button>
          </div>
        </div>
      </div>

      <!-- Review Questions Container -->
      <div id="review-questions-container">
        <!-- Rendered dynamically by ResultViewer -->
      </div>
    </section>

  </main>

  <!-- JavaScript Modules -->
  <script src="js/app-config.js?v=20261019d"></script>
  <script src="js/storage-service.js"></script>
  <script src="js/audio-controller.js"></script>
  <script src="js/ui-renderer.js?v=20261019d"></script>
  <script src="js/result-viewer.js?v=20261019d"></script>

  <script>
    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      try {
        if (typeof window !== 'undefined' && window.location) {
          const earlyParams = new URLSearchParams(window.location.search);
          const earlyShow = (earlyParams.get('show') || earlyParams.get('section') || '').toLowerCase();
          if (earlyParams.get('q') || earlyParams.get('question') || earlyShow === 'review' || earlyShow === 'detail') {
            document.documentElement.classList.add('no-animations');
          }
        }
      } catch (_) {}

      document.addEventListener('DOMContentLoaded', async () => {
        if (typeof StorageService !== 'undefined' && StorageService && typeof StorageService.initTheme === 'function') {
          StorageService.initTheme();
        }
        if (typeof AudioController !== 'undefined' && AudioController && typeof AudioController.init === 'function') {
          AudioController.init();
        }
        if (typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.init === 'function') {
          await ResultViewer.init();
        }

        // Deep-linking (?show=review, ?section=review, hoặc ?q=62)
        try {
          if (typeof window !== 'undefined' && window.location) {
            const urlParams = new URLSearchParams(window.location.search);
            const qParam = urlParams.get('q') || urlParams.get('question');
            const showParam = urlParams.get('show') || urlParams.get('section');
            if (qParam && typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.scrollToQuestionInReview === 'function') {
              ResultViewer.scrollToQuestionInReview(qParam, true);
            } else if (showParam && (showParam.toLowerCase() === 'review' || showParam.toLowerCase() === 'detail')) {
              showDetailedReviewAndSyncAria();
            }
          }
        } catch (_) {}
      });
    }

    function showDetailedReviewAndSyncAria() {
      if (typeof ResultViewer !== 'undefined' && ResultViewer && typeof ResultViewer.showDetailedReviewSection === 'function') {
        ResultViewer.showDetailedReviewSection();
      } else if (typeof document !== 'undefined') {
        const sec = document.getElementById('detailed-review-section');
        if (sec) sec.style.display = 'block';
      }
      if (typeof document !== 'undefined') {
        const btn = document.getElementById('btn-show-detail');
        if (btn) btn.setAttribute('aria-expanded', 'true');
      }
    }

    function toggleTheme() {
      if (typeof StorageService !== 'undefined' && StorageService && typeof StorageService.toggleTheme === 'function') {
        StorageService.toggleTheme();
      } else if (typeof document !== 'undefined' && document.documentElement) {
        const current = document.documentElement.getAttribute('data-theme') || 'dark';
        document.documentElement.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
      }
    }

    function retakeExam() {
      const r = (typeof ResultViewer !== 'undefined' && ResultViewer && ResultViewer.resultData)
        ? ResultViewer.resultData
        : (typeof window !== 'undefined' && window.ResultViewer && window.ResultViewer.resultData ? window.ResultViewer.resultData : null);
      if (r && r.testId != null) {
        let parsed = 1;
        if (typeof r.testId === 'number' && Number.isFinite(r.testId)) {
          parsed = Math.floor(r.testId);
        } else if (typeof r.testId === 'string') {
          const str = r.testId.trim();
          if (/^-\d+/.test(str)) {
            parsed = 1;
          } else {
            const match = str.match(/\d+/);
            parsed = match ? parseInt(match[0], 10) : 1;
          }
        }
        const validTestId = (parsed >= 1 && parsed <= 10) ? parsed : Math.min(10, Math.max(1, Number.isFinite(parsed) ? parsed : 1));
        const validMode = (r.mode === 'part') ? 'part' : 'full';
        let url = `exam.html?test=${validTestId}&mode=${validMode}`;
        if (validMode === 'part' && r.partFilter) {
          const validParts = ['part1', 'part2', 'part3', 'part4', 'part5', 'part6', 'part7'];
          const normPart = String(r.partFilter).toLowerCase();
          if (validParts.includes(normPart)) {
            url += `&part=${normPart}`;
          }
        }
        if (typeof window !== 'undefined' && window.location) {
          window.location.href = url;
        }
        return url;
      } else {
        if (typeof window !== 'undefined' && window.location) {
          window.location.href = 'index.html';
        }
        return 'index.html';
      }
    }

    if (typeof window !== 'undefined') {
      window.retakeExam = retakeExam;
      window.toggleTheme = toggleTheme;
      window.showDetailedReviewAndSyncAria = showDetailedReviewAndSyncAria;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        retakeExam,
        toggleTheme,
        showDetailedReviewAndSyncAria
      };
    }
  </script>
</body>
</html>
