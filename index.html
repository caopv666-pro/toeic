<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>TOEIC Master — Nền tảng Thi thử & Luyện thi TOEIC Chuẩn ETS</title>
  <meta name="description" content="Nền tảng thi thử TOEIC trực tuyến chuẩn format ETS 2022, audio cắt từng câu, chấm điểm 990 tự động và lời giải chi tiết.">
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="css/base.css?v=20261020a">
  <link rel="stylesheet" href="css/layout.css?v=20261020a">
  <link rel="stylesheet" href="css/components.css?v=20261020a">
  <link rel="stylesheet" href="css/responsive.css?v=20261020a">
  <style>
    .part-filter-btn {
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      border-radius: var(--radius-full);
      background: var(--bg-secondary);
      border: 1px solid var(--border-glass);
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition-fast);
      white-space: nowrap;
    }
    .part-filter-btn:hover {
      background: var(--bg-glass-hover);
      color: var(--text-primary);
    }
    .part-filter-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
      box-shadow: 0 2px 10px var(--accent-primary-glow);
    }
    .book-chip-row {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: nowrap;
      gap: 6px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 480px;
      margin-left: auto;
      margin-right: auto;
    }
    .book-chip-row .part-filter-btn {
      flex: 1 1 0;
      padding: 7px 6px;
      font-size: 0.82rem;
      font-weight: 700;
      text-align: center;
      min-width: 0;
    }
    .tests-grid.tests-grid-2col {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 48px;
    }
    .test-card.compact-test-card {
      padding: 14px 14px;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 10px;
    }
    .compact-card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .compact-card-top .test-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .test-best-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: var(--radius-full);
      background: rgba(16, 185, 129, 0.15);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.3);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .compact-card-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      width: 100%;
    }
    .compact-card-actions .test-start-btn {
      flex: 1 1 auto;
      padding: 8px 10px;
      font-size: 0.84rem;
      font-weight: 700;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }
    .compact-card-actions .test-sol-btn {
      flex: 0 0 auto;
      padding: 8px 10px;
      font-size: 0.8rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      .tests-grid.tests-grid-2col {
        gap: 8px;
      }
      .test-card.compact-test-card {
        padding: 10px 10px;
        gap: 8px;
      }
      .compact-card-top .test-title {
        font-size: 0.95rem;
      }
      .compact-card-actions .test-start-btn {
        padding: 7px 8px;
        font-size: 0.78rem;
      }
      .compact-card-actions .test-sol-btn {
        padding: 7px 7px;
        font-size: 0.75rem;
      }
    }
    [data-theme="light"] .part-filter-btn {
      background: #ffffff;
      border-color: #cbd5e1;
      color: #475569;
    }
    [data-theme="light"] .part-filter-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }
    [data-theme="light"] .part-filter-btn.active {
      background: var(--accent-primary);
      color: #ffffff;
      border-color: var(--accent-primary);
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <nav class="app-navbar">
    <div class="nav-brand">
      <span>🎯 TOEIC Master</span>
      <span class="brand-badge" id="nav-book-badge">ETS 2022</span>
    </div>
    <div class="nav-links">
      <a href="index.html" class="nav-link-btn active">Trang chủ</a>
      <a href="history.html" class="nav-link-btn">Lịch sử thi</a>
      <button class="theme-toggle-btn" id="theme-btn" type="button" onclick="toggleTheme()" aria-label="Đổi giao diện Sáng / Tối" title="Đổi giao diện Sáng / Tối">
        🌓
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <main class="container">
    
    <!-- Compact Top Filter Section -->
    <section class="hero-section" style="padding: 16px 0 8px;">

      <!-- Active Session Alert (If in progress) -->
      <div id="resume-banner" role="alert" aria-live="polite" style="display: none; max-width: 600px; margin: 0 auto 14px; padding: 12px 16px; background: rgba(99, 102, 241, 0.15); border: 1px solid var(--accent-primary); border-radius: var(--radius-md); text-align: left;">
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;">
          <div>
            <span style="color: var(--accent-secondary); font-weight: 700; font-size: 0.85rem;">⚠️ BÀI THI ĐANG LÀM DỞ</span>
            <p id="resume-desc" style="color: var(--text-primary); font-size: 0.88rem; margin-top: 2px;"></p>
          </div>
          <div style="display: flex; gap: 6px; align-items: center;">
            <button class="btn btn-secondary btn-sm" type="button" onclick="discardActiveExam()" aria-label="Hủy bỏ bài thi đang làm dở" style="border: 1px solid var(--border-color); background: transparent; color: var(--text-secondary);" title="Hủy bỏ bài thi đang làm dở">Hủy ✕</button>
            <button class="btn btn-primary btn-sm" type="button" onclick="resumeActiveExam()" aria-label="Tiếp tục làm bài thi đang làm dở">Làm tiếp ➔</button>
          </div>
        </div>
      </div>

      <!-- Book Selector Pills (1 Single Compact Row: ETS 2022 / ETS 2023 / ETS 2024 / ETS 2026) -->
      <div id="book-selector-wrap" class="book-chip-row" role="group" aria-label="Chọn bộ đề thi">
        <button class="part-filter-btn active" id="book-btn-2022" data-book="EST 2022" type="button" onclick="selectBook('EST 2022')" aria-pressed="true">ETS 2022</button>
        <button class="part-filter-btn" id="book-btn-2023" data-book="EST 2023" type="button" onclick="selectBook('EST 2023')" aria-pressed="false">ETS 2023</button>
        <button class="part-filter-btn" id="book-btn-2024" data-book="EST 2024" type="button" onclick="selectBook('EST 2024')" aria-pressed="false">ETS 2024</button>
        <button class="part-filter-btn" id="book-btn-2026" data-book="EST 2026" type="button" onclick="selectBook('EST 2026')" aria-pressed="false">ETS 2026</button>
      </div>

      <!-- Mode Selector Tabs -->
      <div class="mode-tabs" role="tablist" aria-label="Chọn chế độ thi" style="margin-bottom: 14px;">
        <button class="mode-tab-btn active" id="tab-full" type="button" role="tab" onclick="switchMode('full')" aria-pressed="true" aria-selected="true">
          ⏱️ Full Test (200c)
        </button>
        <button class="mode-tab-btn" id="tab-part" type="button" role="tab" onclick="switchMode('part')" aria-pressed="false" aria-selected="false">
          🎯 Theo Part
        </button>
      </div>

      <!-- Part Filter Pills (Visible when 'part' mode is selected) -->
      <div id="part-selector-wrap" style="display: none; justify-content: center; flex-wrap: wrap; gap: 6px; margin-bottom: 14px;">
        <button class="part-filter-btn active" data-part="part1" type="button" onclick="selectPartFilter('part1', this)" aria-pressed="true">Part 1</button>
        <button class="part-filter-btn" data-part="part2" type="button" onclick="selectPartFilter('part2', this)" aria-pressed="false">Part 2</button>
        <button class="part-filter-btn" data-part="part3" type="button" onclick="selectPartFilter('part3', this)" aria-pressed="false">Part 3</button>
        <button class="part-filter-btn" data-part="part4" type="button" onclick="selectPartFilter('part4', this)" aria-pressed="false">Part 4</button>
        <button class="part-filter-btn" data-part="part5" type="button" onclick="selectPartFilter('part5', this)" aria-pressed="false">Part 5</button>
        <button class="part-filter-btn" data-part="part6" type="button" onclick="selectPartFilter('part6', this)" aria-pressed="false">Part 6</button>
        <button class="part-filter-btn" data-part="part7" type="button" onclick="selectPartFilter('part7', this)" aria-pressed="false">Part 7</button>
      </div>
    </section>

    <!-- Tests 1 - 10 Grid (2 Tests per row) -->
    <section>
      <div style="display: none;">
        <h2 id="book-section-heading">ETS 2022</h2>
      </div>

      <div class="tests-grid tests-grid-2col" id="tests-card-grid">
        <!-- Rendered dynamically by script -->
      </div>
    </section>

  </main>

  <!-- Scripts -->
  <script src="js/app-config.js?v=20261022v2"></script>
  <script src="js/storage-service.js?v=20261022v2"></script>
  <script>
    let currentMode = 'full';
    let selectedPart = 'part1';
    let currentBook = 'EST 2022';

    function getSafeStorage() {
      return (typeof StorageService !== 'undefined')
        ? StorageService
        : (typeof window !== 'undefined' && window.StorageService ? window.StorageService : null);
    }

    function getConfigParts() {
      if (typeof AppConfig !== 'undefined' && AppConfig && AppConfig.PARTS) {
        return AppConfig.PARTS;
      }
      return {
        part1: { name: 'Part 1: Photographs', count: 6 },
        part2: { name: 'Part 2: Question-Response', count: 25 },
        part3: { name: 'Part 3: Conversations', count: 39 },
        part4: { name: 'Part 4: Short Talks', count: 30 },
        part5: { name: 'Part 5: Incomplete Sentences', count: 30 },
        part6: { name: 'Part 6: Text Completion', count: 16 },
        part7: { name: 'Part 7: Reading Comprehension', count: 54 }
      };
    }

    function getSafeConfig() {
      return { PARTS: getConfigParts() };
    }

    function getSafeTestId(testId) {
      if (testId === null || testId === undefined) return 1;
      if (typeof testId === 'number') {
        return Number.isFinite(testId) ? Math.min(10, Math.max(1, Math.floor(testId))) : 1;
      }
      const str = String(testId).trim();
      if (/^-\d+/.test(str)) {
        return 1;
      }
      const match = str.match(/\d+/);
      const num = match ? parseInt(match[0], 10) : 1;
      return Math.min(10, Math.max(1, isNaN(num) ? 1 : num));
    }

    if (typeof document !== 'undefined' && typeof document.addEventListener === 'function') {
      document.addEventListener('DOMContentLoaded', () => {
        const storage = getSafeStorage();
        if (storage && typeof storage.initTheme === 'function') {
          storage.initTheme();
        }
        if (typeof AppConfig !== 'undefined' && AppConfig && typeof AppConfig.getSelectedBook === 'function') {
          selectBook(AppConfig.getSelectedBook());
        }

      // URL Deep-linking support: ?mode=part&part=part5 hoặc ?mode=full
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const urlBook = urlParams.get('book');
        if (urlBook === 'EST 2026' || urlBook === 'EST 2024' || urlBook === 'EST 2023' || urlBook === 'EST 2022') {
          selectBook(urlBook);
        }
        const urlMode = urlParams.get('mode');
        const urlPart = urlParams.get('part');
        if (urlMode && urlMode.toLowerCase() === 'part') {
          switchMode('part');
          if (urlPart) {
            selectPartFilter(urlPart);
          }
        } else if (urlMode && urlMode.toLowerCase() === 'full') {
          switchMode('full');
        }
      } catch (_) {}

      checkActiveSession();
      renderTestCards();
    });
  }

    function selectBook(bookKey) {
      currentBook = (bookKey === 'EST 2026' || bookKey === 'EST 2024' || bookKey === 'EST 2023') ? bookKey : 'EST 2022';
      if (typeof AppConfig !== 'undefined' && AppConfig && typeof AppConfig.setSelectedBook === 'function') {
        AppConfig.setSelectedBook(currentBook);
      }
      if (typeof document !== 'undefined' && typeof document.getElementById === 'function') {
        const b2022 = document.getElementById('book-btn-2022');
        const b2023 = document.getElementById('book-btn-2023');
        const b2024 = document.getElementById('book-btn-2024');
        const b2026 = document.getElementById('book-btn-2026');
        const heading = document.getElementById('book-section-heading');
        if (b2022 && b2022.classList && typeof b2022.classList.toggle === 'function') {
          b2022.classList.toggle('active', currentBook === 'EST 2022');
          if (typeof b2022.setAttribute === 'function') b2022.setAttribute('aria-pressed', currentBook === 'EST 2022' ? 'true' : 'false');
        }
        if (b2023 && b2023.classList && typeof b2023.classList.toggle === 'function') {
          b2023.classList.toggle('active', currentBook === 'EST 2023');
          if (typeof b2023.setAttribute === 'function') b2023.setAttribute('aria-pressed', currentBook === 'EST 2023' ? 'true' : 'false');
        }
        if (b2024 && b2024.classList && typeof b2024.classList.toggle === 'function') {
          b2024.classList.toggle('active', currentBook === 'EST 2024');
          if (typeof b2024.setAttribute === 'function') b2024.setAttribute('aria-pressed', currentBook === 'EST 2024' ? 'true' : 'false');
        }
        if (b2026 && b2026.classList && typeof b2026.classList.toggle === 'function') {
          b2026.classList.toggle('active', currentBook === 'EST 2026');
          if (typeof b2026.setAttribute === 'function') b2026.setAttribute('aria-pressed', currentBook === 'EST 2026' ? 'true' : 'false');
        }
        const navBadge = document.getElementById('nav-book-badge');
        const shortLabel = currentBook.replace('EST', 'ETS');
        if (heading) {
          heading.textContent = shortLabel;
        }
        if (navBadge) {
          navBadge.textContent = shortLabel;
        }
      }
      renderTestCards();
      return currentBook;
    }

    function toggleTheme() {
      const storage = getSafeStorage();
      if (storage && typeof storage.toggleTheme === 'function') {
        storage.toggleTheme();
      } else if (typeof document !== 'undefined' && document.documentElement) {
        const cur = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', cur);
      }
    }

    function checkActiveSession() {
      const storage = getSafeStorage();
      if (!storage || typeof storage.getActiveSession !== 'function') return;
      const saved = storage.getActiveSession();
      if (saved && saved.userAnswers && typeof saved.userAnswers === 'object' && !Array.isArray(saved.userAnswers)) {
        const count = Object.keys(saved.userAnswers).length;
        if (count > 0) {
          const banner = document.getElementById('resume-banner');
          const desc = document.getElementById('resume-desc');
          if (!banner || !desc) return;

          const config = getSafeConfig();
          const partInfo = (saved.mode === 'part' && saved.partFilter && config.PARTS[saved.partFilter])
            ? config.PARTS[saved.partFilter]
            : null;
          const partLabel = partInfo ? ` • ${partInfo.name.split(':')[0]}` : ' (Full Test)';
          const total = partInfo ? partInfo.count : 200;

          const rawTime = Number(saved.timeRemaining);
          const remMinutes = Number.isFinite(rawTime) ? Math.max(0, Math.floor(rawTime / 60)) : 0;
          const testIdNum = getSafeTestId(saved.testId);

          desc.textContent = `Test ${testIdNum}${partLabel} • Đã làm ${count}/${total} câu • Còn ${remMinutes} phút`;
          banner.style.display = 'block';
        }
      }
    }

    function resumeActiveExam() {
      const storage = getSafeStorage();
      const saved = storage && typeof storage.getActiveSession === 'function' ? storage.getActiveSession() : null;
      if (saved) {
        const testId = getSafeTestId(saved.testId);
        const mode = (saved.mode === 'part') ? 'part' : 'full';
        let url = `exam.html?test=${testId}&mode=${mode}`;
        if (mode === 'part' && saved.partFilter) {
          url += `&part=${encodeURIComponent(saved.partFilter)}`;
        }
        if (typeof window !== 'undefined' && window.location) {
          window.location.href = url;
        }
        return url;
      }
      return null;
    }

    function discardActiveExam() {
      if (typeof confirm === 'function' && !confirm('Bạn có chắc chắn muốn hủy bài thi đang làm dở? Toàn bộ tiến độ chưa nộp sẽ bị xóa.')) {
        return false;
      }
      const storage = getSafeStorage();
      if (storage && typeof storage.clearActiveSession === 'function') {
        storage.clearActiveSession();
      }
      const banner = document.getElementById('resume-banner');
      if (banner) banner.style.display = 'none';
      return true;
    }

    function switchMode(mode) {
      currentMode = (mode === 'part') ? 'part' : 'full';
      const tabFull = document.getElementById('tab-full');
      const tabPart = document.getElementById('tab-part');
      const selectorWrap = document.getElementById('part-selector-wrap');

      if (tabFull) {
        if (tabFull.classList && typeof tabFull.classList.toggle === 'function') {
          tabFull.classList.toggle('active', currentMode === 'full');
        }
        if (typeof tabFull.setAttribute === 'function') {
          tabFull.setAttribute('aria-pressed', currentMode === 'full' ? 'true' : 'false');
          tabFull.setAttribute('aria-selected', currentMode === 'full' ? 'true' : 'false');
        }
      }
      if (tabPart) {
        if (tabPart.classList && typeof tabPart.classList.toggle === 'function') {
          tabPart.classList.toggle('active', currentMode === 'part');
        }
        if (typeof tabPart.setAttribute === 'function') {
          tabPart.setAttribute('aria-pressed', currentMode === 'part' ? 'true' : 'false');
          tabPart.setAttribute('aria-selected', currentMode === 'part' ? 'true' : 'false');
        }
      }
      if (selectorWrap && selectorWrap.style) {
        selectorWrap.style.display = (currentMode === 'part') ? 'flex' : 'none';
      }
      renderTestCards();
      return currentMode;
    }

    function selectPartFilter(partKey, btnEl) {
      const validParts = ['part1', 'part2', 'part3', 'part4', 'part5', 'part6', 'part7'];
      let raw = (typeof partKey === 'string') ? partKey.trim().toLowerCase() : '';
      if (/^\d+$/.test(raw)) raw = 'part' + raw;
      selectedPart = validParts.includes(raw) ? raw : 'part1';

      const targetBtn = btnEl || ((typeof document !== 'undefined' && typeof document.querySelector === 'function')
        ? document.querySelector(`.part-filter-btn[data-part="${selectedPart}"]`)
        : null);

      if (typeof document !== 'undefined' && typeof document.querySelectorAll === 'function') {
        const btns = document.querySelectorAll('.part-filter-btn');
        if (btns && typeof btns.forEach === 'function') {
          btns.forEach(b => {
            if (typeof b.getAttribute === 'function' && b.getAttribute('data-book')) return;
            const isActive = (b === targetBtn) || (typeof b.getAttribute === 'function' && b.getAttribute('data-part') === selectedPart);
            if (b.classList && typeof b.classList.toggle === 'function') {
              b.classList.toggle('active', isActive);
            }
            if (typeof b.setAttribute === 'function') {
              b.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            }
          });
        }
        renderTestCards();
      }
      return selectedPart;
    }

    function renderTestCards() {
      const grid = document.getElementById('tests-card-grid');
      if (!grid) return;
      let html = '';

      const storage = getSafeStorage();
      const historyList = (storage && typeof storage.getExamHistory === 'function')
        ? (storage.getExamHistory() || [])
        : [];
      const bookKey = (currentBook === 'EST 2026' || currentBook === 'EST 2024' || currentBook === 'EST 2023') ? currentBook : 'EST 2022';

      for (let t = 1; t <= 10; t++) {
        const testNumStr = t < 10 ? `0${t}` : `${t}`;
        const isFull = currentMode === 'full';
        const partShort = !isFull ? ` • P${selectedPart.replace('part', '')}` : '';

        // Find best history record for this book + test + mode
        let bestBadgeHtml = '';
        if (Array.isArray(historyList) && historyList.length > 0) {
          const matches = historyList.filter(item => {
            if (!item || getSafeTestId(item.testId) !== t) return false;
            const itemBook = item.bookName || (item.testTitle && item.testTitle.includes('2026') ? 'EST 2026' : item.testTitle && item.testTitle.includes('2024') ? 'EST 2024' : item.testTitle && item.testTitle.includes('2023') ? 'EST 2023' : 'EST 2022');
            if (itemBook !== bookKey) return false;
            if (isFull) return item.mode !== 'part';
            return item.mode === 'part' && String(item.partFilter || '').toLowerCase() === selectedPart;
          });
          if (matches.length > 0) {
            if (isFull) {
              const bestScore = Math.max(...matches.map(m => Number(m.totalScore) || 0));
              bestBadgeHtml = `<span class="test-best-badge" title="Điểm cao nhất đã đạt">🏆 ${bestScore}đ</span>`;
            } else {
              const bestItem = matches.reduce((a, b) => ((Number(b.totalCorrect) || 0) > (Number(a.totalCorrect) || 0) ? b : a), matches[0]);
              bestBadgeHtml = `<span class="test-best-badge" title="Kết quả tốt nhất">✓ ${bestItem.totalCorrect || 0}/${bestItem.totalQuestions || 0}</span>`;
            }
          }
        }

        html += `
          <div class="test-card compact-test-card">
            <div class="compact-card-top">
              <h3 class="test-title">Test ${testNumStr}${partShort}</h3>
              ${bestBadgeHtml}
            </div>
            <div class="compact-card-actions">
              <button type="button" class="btn btn-primary test-start-btn" onclick="startExam(${t})" aria-label="Bắt đầu làm bài Test ${testNumStr}">
                Bắt đầu ➔
              </button>
              <button type="button" class="btn btn-secondary test-sol-btn" onclick="viewTestSolution(${t})" aria-label="Xem giải Test ${testNumStr}" title="Xem lời giải chi tiết Test ${testNumStr}">
                📖 Giải
              </button>
            </div>
          </div>
        `;
      }
      grid.innerHTML = html;
    }

    function viewTestSolution(testId) {
      const parsed = getSafeTestId(testId);
      const clampedTest = Math.min(10, Math.max(1, parsed));
      if (typeof AppConfig !== 'undefined' && AppConfig && typeof AppConfig.setSelectedBook === 'function') {
        AppConfig.setSelectedBook(currentBook);
      }
      let url = `result.html?book=${encodeURIComponent(currentBook)}&test=${clampedTest}&show=review`;
      if (currentMode === 'part') {
        url += `&part=${encodeURIComponent(selectedPart)}`;
      }
      if (typeof window !== 'undefined' && window.location) {
        window.location.href = url;
      }
      return url;
    }

    function startExam(testId) {
      const parsed = getSafeTestId(testId);
      const clampedTest = Math.min(10, Math.max(1, parsed));
      if (typeof AppConfig !== 'undefined' && AppConfig && typeof AppConfig.setSelectedBook === 'function') {
        AppConfig.setSelectedBook(currentBook);
      }
      let url = `exam.html?test=${clampedTest}&mode=${currentMode}`;
      if (currentMode === 'part') {
        url += `&part=${encodeURIComponent(selectedPart)}`;
      }
      if (typeof window !== 'undefined' && window.location) {
        window.location.href = url;
      }
      return url;
    }

    if (typeof window !== 'undefined') {
      window.selectBook = selectBook;
      window.switchMode = switchMode;
      window.selectPartFilter = selectPartFilter;
      window.startExam = startExam;
      window.viewTestSolution = viewTestSolution;
      window.checkActiveSession = checkActiveSession;
      window.resumeActiveExam = resumeActiveExam;
      window.discardActiveExam = discardActiveExam;
      window.renderTestCards = renderTestCards;
      window.toggleTheme = toggleTheme;
      window.getSafeStorage = getSafeStorage;
      window.getSafeConfig = getSafeConfig;
      window.getConfigParts = getConfigParts;
      window.getSafeTestId = getSafeTestId;
    }

    if (typeof module !== 'undefined' && module.exports) {
      module.exports = {
        selectBook,
        switchMode,
        selectPartFilter,
        startExam,
        viewTestSolution,
        checkActiveSession,
        resumeActiveExam,
        discardActiveExam,
        renderTestCards,
        toggleTheme,
        getSafeStorage,
        getSafeConfig,
        getConfigParts,
        getSafeTestId
      };
    }
  </script>
</body>
